<!DOCTYPE html>

<title data-page-node-id="Zq23PuOZ6lR6dXkZKSOJ8w" data-pnid-children="DBz3G6ilIdxw04kRCwvQJW">涨潮归 · 个人办公工作台</title>
<style data-page-node-id="XtkV839SbjGnUcEEKaOwBO" data-pnid-children="CFVbYqZxbZKEMVfT87f3zr">
  :root{
  --bg:#0c1416;
  --bg-2:#131f22;
  --surface:#18262a;
  --surface-2:#1e2f33;
  --line:#27393e;
  --line-soft:#203036;
  --text:#e3eeec;
  --text-2:#a7bfbd;
  --text-3:#7d9694;
  --text-4:#5f7775;
  --accent:#14b8a6;
  --accent-dark:#2dd4bf;
  --accent-deep:#5eead4;
  --accent-soft:#10312e;
  --accent-soft2:#0d2624;
  --cyan:#38bdf8;
  --cyan-soft:#0e2b34;
  --danger:#f87171;
  --danger-soft:#3a1c1c;
  --danger-line:#5c2a2a;
  --warn:#fbbf24;
  --warn-soft:#33270f;
  --warn-line:#5a4415;
  --radius:14px;
  --radius-sm:10px;
  --radius-xs:8px;
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.28);
  --sh-3:0 2px 4px rgba(0,0,0,.34), 0 12px 32px rgba(0,0,0,.38);
  --sh-4:0 20px 50px rgba(0,0,0,.55);
  --nav-w:248px;
  color-scheme:dark;
  --serif:ui-serif,"Songti SC","Georgia","Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}

/* 全局 SVG 兜底尺寸 —— 防止任何未显式约束的图标撑满容器 */
svg{width:16px;height:16px;flex:0 0 auto;display:inline-block;vertical-align:middle}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#2c4044;border-radius:9px;border:3.5px solid var(--bg);background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#3a5257;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ================= Layout ================= */
.app{display:flex;min-height:100vh}
.nav{
  width:var(--nav-w);flex:0 0 var(--nav-w);
  background:linear-gradient(180deg,#152123 0%,#101b1e 60%,#0d1719 100%);
  border-right:1px solid var(--line);
  padding:24px 16px 20px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:3px;
}
/* 【v19】品牌行紧凑化：去掉品牌名左侧的圆形图标（省出 36px 横向空间），
   把「品牌名 / 日期」与右侧的「主题按钮 + 云同步徽标」收成左右两组，整体更聚拢 */
.brand{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:2px 6px 14px;margin-bottom:2px;border-bottom:1px solid var(--line-soft)}
/* flex-basis 取 0（而非 auto）：即便英文界面品牌名较长，也不会把右侧操作组挤到第二行 */
.brand-txt{min-width:0;flex:1 1 0;overflow:hidden}
.brand-act{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;margin-left:auto}
.brand-act .lang-btn{margin-left:0}
/* 【v19】品牌名与日期均强制单行，空间不足时省略号收尾（中文文案短，不会触发） */
.brand-t{font-weight:660;font-size:15.5px;letter-spacing:.1px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-s{font-size:11.5px;color:var(--text-3);margin-top:1px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-label{font-size:10.5px;color:var(--text-4);padding:16px 10px 7px;letter-spacing:1.1px;font-weight:700;text-transform:uppercase}

/* 语言切换 */
.lang-btn{
  margin-left:auto;flex:0 0 auto;align-self:flex-start;
  padding:3.5px 9px;border-radius:20px;border:1px solid var(--line);
  background:var(--surface);color:var(--text-2);
  font-size:11px;font-weight:700;letter-spacing:.3px;transition:.15s;box-shadow:var(--sh-1);
}
.lang-btn:hover{border-color:var(--accent);color:var(--accent-deep);background:var(--accent-soft2)}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;position:relative;
  padding:10px 11px;border-radius:var(--radius-sm);
  color:var(--text-2);font-weight:520;text-align:left;font-size:13.5px;
  transition:background .16s ease,color .16s ease;
}
.nav-item:hover{background:var(--accent-soft2);color:var(--text)}
.nav-item.on{background:var(--accent-soft);color:var(--accent-deep);font-weight:650}
.nav-item.on::before{
  content:"";position:absolute;left:-16px;top:50%;transform:translateY(-50%);
  width:3px;height:19px;border-radius:0 3px 3px 0;background:var(--accent);
}
.nav-item.on svg{color:var(--accent)}
.nav-item svg{width:17px;height:17px;color:var(--text-3);transition:color .16s}
.nav-item:hover svg{color:var(--accent-dark)}
.nav-count{
  margin-left:auto;font-size:11px;font-weight:700;min-width:21px;text-align:center;
  padding:1.5px 6px;border-radius:20px;background:var(--bg-2);color:var(--text-2);letter-spacing:.2px
}
.nav-item.on .nav-count{background:var(--accent-soft2);color:var(--accent-deep)}
.nav-count.hot{background:var(--danger);color:#3a1212;box-shadow:0 1px 4px rgba(209,59,56,.3)}
.nav-count.zero{display:none}
.nav-foot{margin-top:auto;padding:14px 11px 0;border-top:1px solid var(--line-soft);font-size:11px;color:var(--text-4);line-height:1.75}
.nav-foot b{display:block;color:var(--text-3);font-weight:600}

.main{flex:1;min-width:0;padding:28px 36px 80px;max-width:1200px}

/* ================= Hero ================= */
.hero{
  position:relative;border-radius:var(--radius);overflow:hidden;margin-bottom:20px;
  box-shadow:var(--sh-2);border:1px solid var(--line);background:var(--surface);
  min-height:158px;display:flex;align-items:center;
}
.hero-img{position:absolute;inset:0;background-size:cover;background-position:center 62%;opacity:.4;filter:saturate(.8) brightness(.75)}
.hero-ov{position:absolute;inset:0;background:
  linear-gradient(100deg,rgba(255,255,255,.97) 0%,rgba(255,255,255,.93) 34%,rgba(255,255,255,.6) 56%,rgba(255,255,255,.12) 78%,rgba(255,255,255,0) 100%),
  linear-gradient(180deg,rgba(13,148,136,.05),rgba(14,147,181,.05));}
.hero-c{position:relative;padding:26px 30px;max-width:640px;min-width:0}
.hero-eyebrow{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:1.2px;color:var(--accent-dark);text-transform:uppercase;margin-bottom:9px;flex-wrap:wrap}
.hero-eyebrow svg{width:14px;height:14px}
.hero h1{margin:0;font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:-.3px;line-height:1.3;color:#0b2a28;word-break:break-word}
.hero p{margin:8px 0 0;font-size:13.5px;color:var(--text-2);line-height:1.7;max-width:520px;word-break:break-word}
.hero p b{color:var(--accent-deep);font-weight:660}
.hero p .rd{color:var(--danger);font-weight:660}

/* ================= Topbar ================= */
.topbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.topbar h1{margin:0;font-size:22px;font-weight:660;letter-spacing:-.35px;line-height:1.3}
.topbar .sub{font-size:12.5px;color:var(--text-3);margin-top:4px;line-height:1.6}
.topbar-act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ================= Buttons ================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8.5px 15px;border-radius:var(--radius-sm);font-weight:600;font-size:13px;
  background:var(--surface);border:1px solid var(--line);color:var(--text-2);
  transition:border-color .15s,background .15s,color .15s,box-shadow .15s,transform .1s;
  white-space:nowrap;box-shadow:var(--sh-1);letter-spacing:.1px;
}
.btn:hover{border-color:#3d5459;color:var(--text);box-shadow:var(--sh-2)}
.btn:active{transform:translateY(.5px)}
.btn svg{width:15px;height:15px}
.btn-primary{
  background:linear-gradient(180deg,#2dd4bf,var(--accent));
  border-color:var(--accent);color:#04231f;
  box-shadow:0 1px 2px rgba(11,127,116,.2),0 4px 12px rgba(11,127,116,.22),inset 0 1px 0 rgba(255,255,255,.16);
}
.btn-primary:hover{background:linear-gradient(180deg,#5eead4,var(--accent-dark));border-color:var(--accent-dark);color:#04231f;box-shadow:0 2px 4px rgba(11,127,116,.24),0 7px 18px rgba(11,127,116,.28),inset 0 1px 0 rgba(255,255,255,.16)}
.btn-danger{color:var(--danger);border-color:var(--danger-line);background:var(--surface)}
.btn-danger:hover{background:var(--danger-soft);color:var(--danger);border-color:#7a3a3a}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:var(--radius-xs)}
.btn-sm svg{width:13.5px;height:13.5px}

/* ================= Card ================= */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--sh-2);margin-bottom:18px;overflow:hidden;
  transition:box-shadow .22s ease;
}
.card:hover{box-shadow:var(--sh-3)}
.card-h{
  display:flex;align-items:center;gap:10px;padding:15px 20px;flex-wrap:wrap;
  border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg,#1b2a2e,var(--surface));
}
.card-h > svg{width:17px;height:17px;color:var(--accent);flex:0 0 17px}
.card-h h2{margin:0;font-size:14.5px;font-weight:660;letter-spacing:-.1px}
.card-h .hint{font-size:11.5px;color:var(--text-4);font-weight:500}
.card-h .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* 【v20】卡片头常驻按钮（如「我的事项」的「批量管理」）作为标题行的独立成员，贴到该行最右 */
.card-h .head-act{flex:0 0 auto;white-space:nowrap}
/* 【v20】标题不参与收缩，否则右侧控件变宽时标题会被压瘦折行 */
.card-h > h2{flex:0 0 auto}
/* 【v21】「我的事项」卡片头改成两行：第1行＝标题 + 紧急程度/分类/批量管理（靠右）；
   第2行＝分组标签（靠右）。给第2行 flex-basis:100% 即强制另起一行，
   再清掉 margin-left:auto 换成 justify-content:flex-end，两行都贴右边缘对齐。 */
.card-h .sp-row2{flex:1 1 100%;margin-left:0;justify-content:flex-end}
.card-b{padding:18px 20px}
.card-b.tight{padding:5px 20px 14px}

/* ================= Focus banner ================= */
.focus{
  border:1px solid var(--danger-line);border-radius:var(--radius);margin-bottom:18px;
  box-shadow:0 1px 2px rgba(180,50,46,.05),0 6px 20px rgba(180,50,46,.08);overflow:hidden;
  background:linear-gradient(180deg,#2a1b1c,var(--surface));
}
.focus.clear{
  border-color:var(--line);background:linear-gradient(180deg,var(--accent-soft2),var(--surface));
  box-shadow:0 1px 2px rgba(10,90,82,.04),0 6px 20px rgba(10,90,82,.06);
}
.focus-h{
  display:flex;align-items:center;gap:10px;padding:15px 20px;
  border-bottom:1px solid var(--danger-line);
  background:linear-gradient(180deg,rgba(209,59,56,.05),transparent);
}
.focus.clear .focus-h{border-color:#1e3a37;background:linear-gradient(180deg,rgba(13,148,136,.05),transparent)}
.focus-h h2{margin:0;font-size:15px;font-weight:700;color:var(--danger);letter-spacing:-.1px}
.focus.clear .focus-h h2{color:var(--accent-deep)}
.focus-h > svg{width:18px;height:18px;color:var(--danger);flex:0 0 18px}
.focus.clear .focus-h > svg{color:var(--accent)}
.focus-h .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.focus-b{padding:4px 20px 14px}
.frow{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.frow:last-child{border-bottom:none}
.frow .ft{flex:1;min-width:0}
.frow .ft b{font-weight:600;display:block;word-break:break-word;font-size:13.8px;letter-spacing:-.05px}
.frow .ft span{font-size:12px;color:var(--text-2);display:block;margin-top:3px;word-break:break-word;line-height:1.6}
.frow .ft span b,.frow .ft span strong{display:inline}
.frow .fa{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--danger);margin-top:8px;flex:0 0 6px;box-shadow:0 0 0 3px rgba(209,59,56,.13)}
.allclear{display:flex;align-items:center;gap:9px;padding:11px 0;color:var(--text-2);font-size:13px}
.allclear svg{width:17px;height:17px;color:var(--accent)}

/* 非焦点页的紧凑提醒条 */
.mini-alert{
  display:flex;align-items:center;gap:10px;padding:11px 16px;margin-bottom:18px;
  border:1px solid var(--danger-line);border-radius:var(--radius-sm);
  background:linear-gradient(180deg,#2a1b1c,var(--surface));box-shadow:var(--sh-1);
}
.mini-alert > svg{width:16px;height:16px;color:var(--danger);flex:0 0 16px}
.mini-alert .mt{flex:1;min-width:0;font-size:13px;color:#7a2c2a}
.mini-alert .mt b{color:var(--danger);font-weight:700}
/* 【v13】.mini-ok：学习打卡「今天已记」的绿色提示条，与 .mini-alert 同构 */
.mini-ok{
  display:flex;align-items:center;gap:10px;padding:11px 16px;margin-bottom:18px;
  border:1px solid var(--line);border-radius:var(--radius-sm);
  background:linear-gradient(180deg,#0f2b28,var(--surface));box-shadow:var(--sh-1);
}
.mini-ok > svg{width:16px;height:16px;color:var(--accent);flex:0 0 16px}
.mini-ok .mt{flex:1;min-width:0;font-size:13px;color:var(--text-2)}

/* ================= Pills ================= */
.pill{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:650;
  padding:2.5px 9px;border-radius:20px;background:var(--bg-2);color:var(--text-2);
  white-space:nowrap;letter-spacing:.1px;line-height:1.6;
}
.pill.red{background:var(--danger-soft);color:var(--danger);box-shadow:inset 0 0 0 1px rgba(209,59,56,.13)}
.pill.teal{background:var(--accent-soft);color:var(--accent-deep);box-shadow:inset 0 0 0 1px rgba(13,148,136,.13)}
.pill.cyan{background:var(--cyan-soft);color:#7dd3fc;box-shadow:inset 0 0 0 1px rgba(14,147,181,.13)}
.pill.warn{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(168,98,6,.13)}
.pill.gray{background:var(--surface-2);color:var(--text-2)}
.p1{background:var(--danger-soft);color:var(--danger);box-shadow:inset 0 0 0 1px rgba(248,113,113,.22)}
.p2{background:var(--warn-soft);color:#96580a;box-shadow:inset 0 0 0 1px rgba(150,88,10,.14)}
.p3{background:var(--cyan-soft);color:#0a6f8c;box-shadow:inset 0 0 0 1px rgba(10,111,140,.13)}
.p4{background:var(--surface-2);color:var(--text-2)}

/* ================= Forms ================= */
.form{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.grow{flex:1 1 220px}
/* 【v20】表单里的固定宽度字段：桌面按固定宽排（便于同行并排），窄屏不带 inline 样式，
   由下面媒体查询里的 .form .f{flex:1 1 100%} 统一压成整行，避免留半行空白 */
.f-w150{flex:0 0 150px}
.f-w176{flex:0 0 176px}
/* 【v21】三字段强制同行（「要做什么」+「轻急缓重」+「截止日期」）：容器不换行，
   空间不足时三者按 flex-basis 比例收缩；否则第三个字段会被整行甩到下一行、右侧留半行空白。
   窄屏由 860px 媒体查询的 .form-3in1{flex-wrap:wrap} 放开换行，三字段各自整行堆叠。 */
.form-3in1{flex-wrap:nowrap}
.f-prio{flex:0 1 130px}
.f-due{flex:0 1 176px;min-width:150px}
.f label{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.5px;text-transform:uppercase}
input[type=text],input[type=date],select,textarea{
  width:100%;padding:9.5px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--surface-2);outline:none;transition:border-color .15s,box-shadow .15s,background .15s;
}
input[type=text]:hover,input[type=date]:hover,select:hover,textarea:hover{border-color:#3a5257}
textarea{resize:none;min-height:64px;line-height:1.68}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface-2);box-shadow:0 0 0 3.5px rgba(45,212,191,.16)}
input::placeholder,textarea::placeholder{color:var(--text-4)}
select{-webkit-appearance:none;-moz-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238aa3a1' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px}
/* 【v26】原生下拉列表（点开后弹出的选项面板）配色跟随主题 ——
   面板底色取自 select 自身的 background-color 与各 option 的 background-color，此前两者都未显式指定，
   于是回落到浏览器/系统默认色（深色主题下仍然是浅色面板，与页面割裂）。
   显式给出后，深浅两套主题各自成套，且随 --surface / --text 变量自动跟主题走。
   选中项用 background-image 渐变兜底：部分平台会用系统高亮色覆盖 option 的 background-color，
   只有 background-image 能压住它，保证选中项也是主题色。 */
select{color:var(--text);background-color:var(--surface-2)}
select option,select optgroup{background-color:var(--surface);color:var(--text)}
select option:checked{background-image:linear-gradient(var(--accent-soft),var(--accent-soft));color:var(--accent-deep)}
select:disabled{background-color:var(--bg-2);color:var(--text-3)}

/* 【v27】主题化下拉面板 .sdp —— 手机端点开 select 弹出的「选项列表」由系统绘制，
   iOS 走原生滚轮、Android 走系统列表，两条路径都不吃页面的 CSS（v26 的 option 配色只在桌面浏览器生效），
   于是深色主题下仍然是一块白底，非常刺眼。既然原生弹层改不动，就自己画一个：
   触摸端拦截 select 的按下事件（preventDefault 挡掉原生弹层），改用下面这套主题面板。 */
.sdp{position:absolute;z-index:220;padding:5px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-sm);box-shadow:var(--sh-3);overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;animation:sdpin .13s ease-out}
/* 入场动画只做位移、不动 opacity：万一动画因任何原因停在首帧，
   「透明度从 0 开始」会让整块面板直接不可见（实测无头环境就复现了这个假死），
   而位移停在首帧最多是偏 5px，面板始终看得见。 */
@keyframes sdpin{from{transform:translateY(-5px)}to{transform:none}}
.sdp .o{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;padding:9px 12px;
  border-radius:8px;border:0;background:transparent;font:inherit;font-size:14px;line-height:1.45;
  color:var(--text-2);text-align:left;cursor:pointer}
.sdp .o + .o{margin-top:2px}
.sdp .o .ck{width:15px;height:15px;flex:0 0 auto;opacity:0;color:var(--accent)}
.sdp .o.on{background:var(--accent-soft);color:var(--accent-deep);font-weight:660}
.sdp .o.on .ck{opacity:1}
.sdp .o:active{background:var(--accent-soft2)}
.sdp .o .tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdp-mask{position:absolute;inset:0;z-index:210}

/* 【v28】日期输入框与主题化日历面板
   input[type=date] 在 Android 上点开的日期盘同样是系统绘制的 Jetpack/原生控件，
   深色主题下依旧是白盘 —— 与原生下拉同源，一并换成自绘。
   输入框本身也显式铺底色+改文字色+反转内置日历小图标（默认深色图标在深色底上几乎看不见）。 */
input[type=date]{background-color:var(--surface-2);color:var(--text);font-variant-numeric:tabular-nums}
html[data-theme="dark"] input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1) brightness(1.75);opacity:.72}
html[data-theme="dark"] input[type=date]::-webkit-datetime-edit{color:var(--text)}
html[data-theme="dark"] input[type=date]::-webkit-datetime-edit-fields-wrapper{color:var(--text)}
.sdp-cal{position:absolute;z-index:230;padding:11px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--sh-3);width:288px;max-width:calc(100% - 20px);
  animation:sdpin .13s ease-out}
.sdp-cal .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.sdp-cal .hd .ym{flex:1;text-align:center;font-size:14.5px;font-weight:700;color:var(--text);letter-spacing:.4px}
.sdp-cal .nb{width:38px;height:38px;flex:0 0 auto;border-radius:9px;display:flex;align-items:center;
  justify-content:center;color:var(--text-2);background:var(--bg-2)}
.sdp-cal .nb:active{background:var(--accent-soft2);color:var(--accent-deep)}
.sdp-cal .wk,.sdp-cal .gd{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.sdp-cal .wk{margin-bottom:4px}
.sdp-cal .wk span{text-align:center;font-size:11px;color:var(--text-3);padding:2px 0;font-weight:600}
.sdp-cal .gd .d{height:38px;border-radius:9px;font-size:13.5px;color:var(--text-2);background:transparent;
  display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.sdp-cal .gd .d:active{background:var(--accent-soft2)}
.sdp-cal .gd .d.emp{border:0}
.sdp-cal .gd .d.today{color:var(--accent-deep);font-weight:700;box-shadow:inset 0 0 0 1px var(--accent-soft2)}
.sdp-cal .gd .d.on{background:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:none}
.sdp-cal .ft{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)}
.sdp-cal .ft button{flex:1;padding:0;height:41px;border-radius:9px;font-size:13.5px;font-weight:600;
  background:var(--bg-2);color:var(--text-2)}
.sdp-cal .ft button:active{background:var(--accent-soft2);color:var(--accent-deep)}

/* ================= Task list ================= */
.seg{display:inline-flex;background:var(--bg-2);border-radius:var(--radius-sm);padding:3px;gap:2px}
.seg button{padding:5.5px 13px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text-2);transition:.15s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--accent-deep);box-shadow:0 1px 3px rgba(10,50,46,.1)}
/* 【v11】分组数量徽标：让"这个分组里有几条"一眼可见，避免云端有数据却以为丢了 */
.seg button .cnt{display:inline-block;min-width:16px;margin-left:5px;padding:0 4px;border-radius:9px;background:var(--line-soft);font-size:11px;font-weight:700;color:var(--text-3);line-height:16px;text-align:center;font-variant-numeric:tabular-nums}
.seg button.on .cnt{background:var(--accent-soft);color:var(--accent-deep)}
.seg button .cnt.zero{opacity:.45}
/* 【v11】云端自检表格 */
.diag-tb{width:100%;border-collapse:collapse;font-size:12.5px}
.diag-tb th,.diag-tb td{padding:7px 9px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
.diag-tb tr:last-child td{border-bottom:none}
.diag-tb th{color:var(--text-3);font-weight:600;font-size:11.5px;letter-spacing:.02em;white-space:nowrap}
.diag-tb td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.diag-tb .st-ok{color:var(--accent)}
.diag-tb .st-bad{color:var(--danger)}
.diag-tb .st-off{color:var(--text-3)}
.diag-tb .why{color:var(--text-3);font-size:11.5px}
.diag-note{margin:10px 0 0;font-size:12px;color:var(--text-3);line-height:1.7}
.list{display:flex;flex-direction:column}
.item{
  display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft);
  align-items:flex-start;position:relative;transition:background .15s;
}
.item:last-child{border-bottom:none}
.item::before{content:"";position:absolute;left:-20px;top:11px;bottom:11px;width:2.5px;border-radius:0 3px 3px 0;background:transparent;transition:background .15s}
.item.pr1::before{background:#d9403c}
.item.pr2::before{background:#dc8a12}
.item.pr3::before{background:var(--cyan)}
.item.pr4::before{background:#3a5257}
.item.done::before{background:#3a5257}
.item.od{background:linear-gradient(90deg,rgba(209,59,56,.075),rgba(209,59,56,.025) 55%,transparent 82%);margin:0 -20px;padding:13px 20px}
.item.od::before{left:0}
.item.od .it-title{color:#bd302d}
.item.done .it-title{text-decoration:line-through;text-decoration-color:var(--text-4);color:var(--text-3)}
.chk{
  width:20px;height:20px;flex:0 0 20px;border:1.8px solid #3a5257;border-radius:6px;margin-top:2px;
  display:flex;align-items:center;justify-content:center;background:var(--surface-2);transition:.16s;
}
.chk:hover{border-color:var(--accent);background:var(--accent-soft2);transform:scale(1.06)}
.chk.on{background:linear-gradient(180deg,#12a096,var(--accent-dark));border-color:var(--accent-dark);box-shadow:0 1px 4px rgba(13,148,136,.3)}
.chk svg{width:12.5px;height:12.5px;color:#fff;opacity:0;stroke-width:3.6}
.chk.on svg{opacity:1}
.it-main{flex:1;min-width:0}
.it-title{font-weight:545;word-break:break-word;font-size:13.9px;letter-spacing:-.05px;line-height:1.55}
.it-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px}
.it-act{display:flex;gap:3px;flex-shrink:0;align-items:center}
.ico-btn{width:31px;height:31px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;color:var(--text-4);transition:.15s}
.ico-btn:hover{background:var(--bg-2);color:var(--text-2)}
.ico-btn.red:hover{background:var(--danger-soft);color:var(--danger)}
.ico-btn svg{width:15px;height:15px}

/* ================= 日期分组（即将到来） ================= */
.dgroup{margin-bottom:6px}
.dgroup:last-child{margin-bottom:0}
.dgroup-h{
  display:flex;align-items:center;gap:9px;padding:12px 0 7px;
  position:sticky;top:0;background:linear-gradient(180deg,var(--surface) 72%,rgba(24,38,42,0));z-index:2;
}
.dg-d{font-size:12.5px;font-weight:700;color:var(--accent-deep);letter-spacing:.1px}
.dg-x{font-size:11.5px;color:var(--text-4)}
.dg-n{margin-left:auto;font-size:11px;font-weight:650;color:var(--text-3);background:var(--bg-2);padding:1.5px 8px;border-radius:20px}
.dgroup .list{border-left:2px solid var(--line-soft);padding-left:13px;margin-left:2px}
.dgroup .item::before{display:none}

/* ================= 子筛选栏（按项目） ================= */
.subbar{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  padding:11px 20px;border-bottom:1px solid var(--line-soft);background:var(--surface);
}
.sb-l{font-size:11px;font-weight:700;color:var(--text-4);letter-spacing:.5px;text-transform:uppercase;margin-right:2px}

/* 任务上的项目标签 */
.pill.proj-link{
  background:var(--accent-soft);color:var(--accent-deep);cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(13,148,136,.16);transition:.15s;border:none;font-family:inherit;
}
.pill.proj-link:hover{background:var(--accent);color:#04231f;box-shadow:0 1px 5px rgba(13,148,136,.3)}
.pill.proj-link svg{width:11px;height:11px}

/* ================= 项目卡内的关联待办 ================= */
.ptasks{margin-top:11px;padding-top:11px;border-top:1px solid var(--line-soft)}
.pt-h{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.pt-t{font-size:11px;font-weight:700;color:var(--text-4);letter-spacing:.5px;text-transform:uppercase}
.pt-c{font-size:11.5px;font-weight:650;color:var(--text-2)}
.pt-c .rd{color:var(--danger)}
.pt-h .btn{margin-left:auto}
.pt-bar{height:6px;background:var(--bg-2);border-radius:20px;overflow:hidden;margin-bottom:10px;box-shadow:inset 0 1px 2px rgba(10,50,46,.05)}
.pt-fill{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .5s cubic-bezier(.4,0,.2,1)}
.pt-fill.full{background:linear-gradient(90deg,var(--accent),#3fbfa8)}
.pt-list{display:flex;flex-direction:column;gap:1px}
.pt-i{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px}
.pt-chk{
  width:16px;height:16px;flex:0 0 16px;border:1.6px solid #3a5257;border-radius:5px;
  display:flex;align-items:center;justify-content:center;background:var(--surface-2);transition:.15s;
}
.pt-chk:hover{border-color:var(--accent);background:var(--accent-soft)}
.pt-chk svg{width:10px;height:10px;color:var(--accent);opacity:0;stroke-width:3.6}
.pt-chk:hover svg{opacity:.75}
.pt-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#20403e}
.pt-d{font-size:11px;color:var(--text-4);flex-shrink:0;font-weight:550}
.pt-d.od{color:var(--danger);font-weight:700}
.pt-more{
  margin-top:5px;font-size:11.5px;font-weight:650;color:var(--accent-dark);
  text-align:left;padding:3px 0;transition:.15s;
}
.pt-more:hover{color:var(--accent-deep);text-decoration:underline}
.pt-none{font-size:12px;color:var(--text-4);line-height:1.6}
.pt-done{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--accent-dark);font-weight:550}
.pt-done svg{width:14px;height:14px;color:var(--accent)}

/* ================= Notes ================= */
.tagbar{display:flex;gap:7px;flex-wrap:wrap}
.tag-chip{
  padding:4.5px 12px;border-radius:20px;border:1px solid var(--line);font-size:12px;
  font-weight:600;color:var(--text-2);background:var(--surface);transition:.15s;box-shadow:var(--sh-1);
}
.tag-chip:hover{border-color:#3a5257;color:var(--text)}
.tag-chip.on{background:linear-gradient(180deg,#2dd4bf,var(--accent));border-color:var(--accent);color:#04231f;box-shadow:0 2px 7px rgba(13,148,136,.28)}
/* 【v13】个人事项：分类标签多选器 + 我的事项顶部筛选条 */
.pcat-box{display:flex;flex-wrap:wrap;gap:6px;padding:8px 9px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);max-height:134px;overflow:auto}
.pcat-chip{padding:4px 11px;font-size:12px;box-shadow:none}
.pcat-new{border-style:dashed;color:var(--text-3);background:transparent}
/* 【v15】筛选条并入卡片标题行：去掉独立区块的内边距与分隔线，左侧加一道细分隔与分组按钮区分 */
.pflt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pflt-lb{font-size:11.5px;font-weight:600;color:var(--text-3);white-space:nowrap}
.pflt-sel{width:auto;min-width:106px;max-width:186px;padding:6px 24px 6px 9px;font-size:12.5px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:13px}
.note{
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:15px 16px;position:relative;
  background:linear-gradient(165deg,#1c2c2f 0%,var(--surface) 55%);transition:box-shadow .2s,border-color .2s,transform .2s;
  box-shadow:var(--sh-1);
}
.note::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:var(--radius-sm) 0 0 var(--radius-sm);background:linear-gradient(180deg,var(--accent),var(--cyan));opacity:.8}
.note:hover{box-shadow:var(--sh-3);border-color:#3a5257;transform:translateY(-1.5px)}
.note:hover::before{opacity:1}
.note p{margin:0 0 11px;white-space:pre-wrap;word-break:break-word;font-size:13.4px;line-height:1.68;padding-right:26px;color:#173432}
.note .nf{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.note .nf time{font-size:11px;color:var(--text-4);margin-left:auto;font-weight:500}
/* 记事操作组：置顶 / 编辑 / 复制 / 删除（悬停或触屏常显） */
.note-ops{position:absolute;top:7px;right:7px;display:flex;gap:2px;opacity:0;transition:.15s;background:var(--surface);border-radius:8px;padding:2px;box-shadow:0 1px 5px rgba(0,0,0,.12);z-index:2}
.note:hover .note-ops,.note:focus-within .note-ops{opacity:1}
.note-ops .ico-btn{width:27px;height:27px;border-radius:7px}
.note-ops .ico-btn svg{width:13px;height:13px}
.note-ops .ico-btn.on{color:var(--warn)}
.note.pinned{border-color:var(--warn)}
.note.pinned::before{background:linear-gradient(180deg,var(--warn),var(--accent))}
/* 批量选择条 */
.sel-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 2px;border-bottom:1px dashed var(--line-soft);margin-bottom:8px}
.sel-bar .btn{min-height:36px;padding:7px 13px;font-size:12.5px}
.sel-bar .sb-hint{font-size:12px;color:var(--text-3)}
/* 批量模式行首复选框（复用 .chk 样式，略小） */
.chk.pick{flex:0 0 22px;width:22px;height:22px;border-radius:7px}
.chk.pick svg{width:12px;height:12px}
@media(max-width:860px){
  .note-ops{opacity:1}
}

/* ================= Projects ================= */
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:13px}
.proj{
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;background:var(--surface);
  box-shadow:var(--sh-1);transition:box-shadow .2s,transform .2s,border-color .2s;position:relative;overflow:hidden;
}
.proj::after{content:"";position:absolute;left:0;right:0;top:0;height:2.5px;background:linear-gradient(90deg,var(--accent),var(--cyan))}
.proj:hover{box-shadow:var(--sh-3);transform:translateY(-1.5px)}
.proj.blocked{border-color:var(--danger-line);background:linear-gradient(180deg,#2a1b1c,var(--surface))}
.proj.blocked::after{background:linear-gradient(90deg,var(--danger),#fca5a5)}
.proj.done{background:linear-gradient(180deg,#1c2c2f,var(--surface))}
.proj.done::after{background:linear-gradient(90deg,#3a5257,#4a6367)}
.proj-h{display:flex;align-items:center;gap:9px;margin-bottom:11px;padding-bottom:11px;border-bottom:1px solid var(--line-soft)}
.proj-h b{font-size:14.5px;font-weight:660;word-break:break-word;letter-spacing:-.15px}
.proj-h .sp{margin-left:auto;display:flex;gap:2px;align-items:center;flex-shrink:0}
.kv{display:flex;gap:10px;padding:5.5px 0;font-size:13px;align-items:flex-start}
.kv .k{flex:0 0 50px;color:var(--text-4);font-size:11px;font-weight:700;padding-top:2.5px;letter-spacing:.4px;text-transform:uppercase}
.kv .v{flex:1;min-width:0;word-break:break-word;white-space:pre-wrap;line-height:1.62;color:#1c3b39}
.kv .v.em{color:var(--danger);font-weight:560}
.kv .v.na{color:var(--text-4)}

/* ================= Review ================= */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:13px}
.stat{
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:15px 16px;
  background:linear-gradient(165deg,#1c2c2f,var(--surface) 70%);box-shadow:var(--sh-1);
  transition:box-shadow .2s,transform .2s;
}
.stat:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.stat .n{font-family:var(--serif);font-size:31px;font-weight:600;letter-spacing:-.8px;line-height:1.1;color:var(--accent-deep)}
.stat .l{font-size:11.5px;color:var(--text-3);margin-top:5px;font-weight:600;letter-spacing:.3px}
.stat.red{background:linear-gradient(165deg,#2a1b1c,var(--surface) 70%);border-color:var(--danger-line)}
.stat.red .n{color:var(--danger)}
.bars{display:flex;flex-direction:column;gap:13px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-row .bl{flex:0 0 108px;font-size:12.5px;color:var(--text-2);font-weight:570}
.bar-track{flex:1;display:block;height:9px;background:var(--bg-2);border-radius:20px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(10,50,46,.05)}
.bar-fill{display:block;height:100%;min-width:3px;border-radius:20px;transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.bar-fill.z{min-width:0}
.bar-row .bv{flex:0 0 48px;text-align:right;font-size:12.5px;font-weight:700;color:var(--text-2)}
.blk{padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13px;line-height:1.65}
.blk:last-child{border-bottom:none}
.blk b{font-weight:650}
.blk span{color:var(--danger)}

/* ================= Empty ================= */
.empty{text-align:center;padding:34px 16px;color:var(--text-4);font-size:13px}
.empty svg{width:28px;height:28px;margin-bottom:10px;color:#4a6367;stroke-width:1.6}

/* ================= Backup ================= */
.bk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:13px}
.bk{border:1px solid var(--line);border-radius:var(--radius-sm);padding:17px;background:linear-gradient(165deg,#1c2c2f,var(--surface));box-shadow:var(--sh-1)}
.bk h3{margin:0 0 6px;font-size:13.5px;font-weight:660;display:flex;align-items:center;gap:8px}
.bk h3 svg{width:16px;height:16px;color:var(--accent)}
.bk p{margin:0 0 14px;font-size:12.5px;color:var(--text-2);line-height:1.68}

/* ================= Nudge ================= */
.nudge{
  display:flex;gap:12px;align-items:flex-start;padding:14px 18px;margin-bottom:18px;
  border:1px solid var(--warn-line);background:linear-gradient(180deg,#2e2412,var(--surface));
  border-radius:var(--radius);box-shadow:0 1px 2px rgba(150,100,10,.05),0 6px 18px rgba(150,100,10,.07);
}
.nudge svg.i{width:18px;height:18px;color:var(--warn);flex:0 0 18px;margin-top:2px}
.nudge .nt{flex:1;min-width:0;font-size:13px;color:#5f4310;line-height:1.65}
.nudge .nt b{display:block;font-weight:700;color:var(--warn);margin-bottom:2px;font-size:13.5px}
.nudge .na{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;align-items:center}

/* ================= Toast / Modal ================= */
.toasts{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:90;align-items:flex-end}
.toast{
  background:linear-gradient(180deg,#12403c,#0b302d);color:#fff;padding:12px 17px;border-radius:11px;
  font-size:13px;font-weight:550;box-shadow:0 12px 34px rgba(8,42,39,.32),inset 0 1px 0 rgba(255,255,255,.09);
  display:flex;align-items:center;gap:9px;animation:tin .28s cubic-bezier(.2,.9,.3,1);max-width:min(90vw,370px);
}
.toast svg{width:15px;height:15px;flex:0 0 15px;color:#5fd6c6}
.toast.err{background:linear-gradient(180deg,#8e2320,#761c19)}
.toast.err svg{color:#ffb3b0}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

/* ===== 工作日记：双勾选 ===== */
.chk.rep{border-radius:50%}
.chk.rep.on{background:var(--cyan);border-color:var(--cyan);color:#04231f}
.chk-grp{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.chk-lb{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-3);font-weight:600;cursor:pointer;user-select:none}
.chk-lb .chk{width:19px;height:19px}
.chk-lb.on{color:var(--accent-deep)}

/* ===== 检查任务台账 ===== */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* 【v24】min-width 由 900px 降到 820px：台账去掉「序号」列后，各列在最挤状态下约需 843px，
   而旧值 900px 会在窗口较窄（台账容器 <900px）时把表格强行撑宽，导致最右侧的编辑/删除按钮
   被推到横向滚动区之外 —— 即用户遇到的「单屏看不到操作按钮」。820px 让 1280 宽窗口也能一屏放下。 */
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
.tbl th{text-align:left;font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.5px;padding:0 10px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--bg-2)}
.tbl .tg{font-weight:620;color:var(--text)}
.tbl .dt{font-variant-numeric:tabular-nums;color:var(--text-2);white-space:nowrap;font-size:12.5px}
.tbl .dt.od{color:var(--danger);font-weight:650}
.tbl .dt.soon{color:var(--warn);font-weight:650}
.tbl .acts{display:flex;gap:4px;justify-content:flex-end}
.tbl select.sm{padding:4px 7px;font-size:12px;border-radius:7px;min-width:92px;width:auto}
/* 【v16】台账表头可点击排序：▲▼ 指示当前列与方向 */
.tbl th.th-s{cursor:pointer;user-select:none;transition:color .15s}
.tbl th.th-s:hover{color:var(--text-2)}
.tbl th.th-s .ar{display:inline-flex;vertical-align:-2px;margin-left:3px;opacity:.4}
.tbl th.th-s .ar svg{width:11px;height:11px;stroke-width:2.6}
.tbl th.th-s.on{color:var(--accent-deep)}
.tbl th.th-s.on .ar{opacity:1}
/* 【v16】复查时间列改成可直接选日期的输入框 */
.tbl input[type=date].dt-inp{padding:4px 8px;font-size:12px;border-radius:7px;min-width:134px;width:auto;font-variant-numeric:tabular-nums}
.tbl input[type=date].dt-inp.od{color:var(--danger);border-color:rgba(209,59,56,.42)}
.tbl input[type=date].dt-inp.soon{color:var(--warn);border-color:rgba(168,98,6,.42)}
.rc-hint{display:block;font-size:10.5px;line-height:1.45;margin-top:2px;color:var(--text-4)}
.rc-hint.od{color:var(--danger);font-weight:650}
.rc-hint.soon{color:var(--warn);font-weight:650}
/* 【v16】移动端卡片区里的排序条（表格在窄屏隐藏，靠它排序） */
.ins-sortbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:10px}
.ins-sortbar .sb-l{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.5px}
.ins-sortbar select{width:auto;flex:1 1 130px;padding:7px 30px 7px 10px;font-size:16px;border-radius:8px}
.ins-sortbar .btn{min-height:38px}
.ins-f input[type=date].dt-inp{width:100%;font-size:16px}
.ins-cards{display:flex;flex-direction:column;gap:10px}
.ins-card{border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 15px;background:var(--surface)}
.ins-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.ins-nm{font-size:14px;font-weight:660;color:var(--text)}
.ins-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px 14px;margin-bottom:10px}
.ins-f{display:flex;flex-direction:column;gap:3px}
.ins-f .k{font-size:10.5px;font-weight:700;color:var(--text-4);letter-spacing:.5px}
.ins-f .v{font-size:12.5px;color:var(--text-2);word-break:break-all}
.ins-bar{height:4px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:9px}
.ins-bar > span{display:block;height:100%;background:linear-gradient(90deg,#0d9488,#0e93b5)}
@media(max-width:860px){ .tbl{min-width:760px} }
.ins-cards{display:none}
@media(max-width:760px){ .tbl-wrap.ins{display:none} .ins-cards{display:flex} }
/* 【v22】台账卡片底部筛选条：任务分类 / 检查结果 两个下拉 + 检查对象关键字搜索 + 重置。
   独立成一条页脚（与列表区之间一条细线分隔），且**始终渲染** —— 哪怕筛选后列表为空，
   重置入口也还在，用户不至于被困在空列表里。 */
.ins-flt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:13px 20px;border-top:1px solid var(--line-soft)}
.ins-flt .q-in{width:220px;flex:0 1 220px;min-width:130px}
/* 【v22】窄屏：搜索框独占一行，两个下拉与按钮自动换行堆叠；按钮补到 44px 满足触摸目标（btn-sm 默认 38px）。
   这段必须写在上面基础规则**之后** —— 页首那段 860px 媒体查询位置更早，
   同优先级的窄屏规则放在那里会被后面的基础样式反压，搜索框就铺不满一行了。 */
@media (max-width:860px){
  .ins-flt{padding:12px 15px}
  .ins-flt .q-in{width:auto;flex:1 1 100%;min-width:0}
  .ins-flt .btn{min-height:44px}
}
/* 桌面端把两个下拉压到与搜索框等高（都是 40px），按钮也提到 40px —— 一行里控件高矮一致；
   窄屏交给 860px 媒体查询的通用大控件样式 */
@media (min-width:861px){
  .ins-flt .pflt-sel{height:40px;padding:0 30px 0 11px;font-size:13px;min-width:124px;max-width:190px}
  .ins-flt .btn{min-height:40px}
}
/* 批量导入 */
.imp{border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 15px;background:var(--surface-2)}
.imp > summary{cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:640;color:var(--text-2);list-style:none;min-height:32px}
.imp > summary::-webkit-details-marker{display:none}
.imp > summary:hover{color:var(--accent-dark)}
.imp > summary svg{width:15px;height:15px}
.imp[open] > summary{margin-bottom:11px;padding-bottom:10px;border-bottom:1px solid var(--line-soft)}
.imp-hint{font-size:12px;color:var(--text-3);line-height:1.75;margin:0 0 10px}
.imp-tip{font-size:11.5px;color:var(--text-4);line-height:1.7;margin-top:2px}
.prev{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-xs);background:var(--bg-2);margin-bottom:13px}
.prev table{width:100%;border-collapse:collapse;font-size:12.5px}
.prev th{position:sticky;top:0;background:var(--surface);font-size:11px;color:var(--text-3);padding:7px 9px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
.prev td{padding:7px 9px;border-bottom:1px solid var(--line-soft);color:var(--text-2);white-space:nowrap}
.prev tr:last-child td{border-bottom:none}
.prev .no{color:var(--text-4);font-size:11.5px}
.imp-opts{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.ckl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);cursor:pointer;min-height:30px;line-height:1.5}
.ckl input{width:16px;height:16px;flex:0 0 16px;accent-color:var(--accent);cursor:pointer}
.stat .sb{font-size:11px;color:var(--text-3);margin-top:2px;line-height:1.4}

/* ================= 主题切换（暗黑 / 明亮） ================= */
:root{
  --hero-ov:linear-gradient(100deg,rgba(12,20,22,.97) 0%,rgba(12,20,22,.93) 34%,rgba(12,20,22,.62) 56%,rgba(12,20,22,.14) 78%,rgba(12,20,22,0) 100%),linear-gradient(180deg,rgba(45,212,191,.05),rgba(56,189,248,.05));
  --hero-ov-m:linear-gradient(180deg,rgba(12,20,22,.96) 0%,rgba(12,20,22,.9) 55%,rgba(12,20,22,.72) 100%);
  --hero-ink:#eaf6f4; --hero-op:.42; --hero-ft:saturate(.8) brightness(.72);
  --nav-grad:linear-gradient(180deg,#152123 0%,#101b1e 60%,#0d1719 100%);
  --scroll:#2c4044; --scroll-hi:#3a5257;
  --bd-hi:#3a5257; --fill-mute:#3a5257; --fill-mute-2:#4a6367;
  --card-a:#1c2c2f; --card-b:#1b2a2e; --red-a:#2a1b1c; --warn-a:#2e2412;
  --on-accent:#04231f; --on-danger:#3a1212; --on-cyan:#7dd3fc; --on-warn:#fbbf24;
  --danger-2:#fca5a5; --danger-bd:#7a3a3a;
  --ink:#cfdedc; --ink-2:#c3d8d6; --od-ink:#fca5a5;
  --mini-red:#f0a5a2; --nudge-ink:#e8c98a; --line-accent:#1e3a37;
  --toast:linear-gradient(180deg,#12403c,#0b302d); --toast-err:linear-gradient(180deg,#8e2320,#761c19);
}
html[data-theme="light"]{
  --bg:#f7faf9; --bg-2:#eef4f3; --surface:#fff; --surface-2:#fbfdfd;
  --line:#e3eeec; --line-soft:#eaf2f1;
  --text:#173432; --text-2:#4a6362; --text-3:#7d9694; --text-4:#9fb2b0;
  --accent:#0d9488; --accent-dark:#12a096; --accent-deep:#0b7a70;
  --accent-soft:#e6f5f2; --accent-soft2:#f0faf8;
  --cyan:#0e93b5; --cyan-soft:#e5f4f8;
  --danger:#d9403c; --danger-soft:#fdf0ef; --danger-line:#f0cfcd;
  --warn:#c9820a; --warn-soft:#fdf6e6; --warn-line:#f2e2be;
  --sh-1:0 1px 2px rgba(16,60,56,.05);
  --sh-2:0 1px 2px rgba(16,60,56,.05),0 4px 14px rgba(16,60,56,.05);
  --sh-3:0 2px 4px rgba(16,60,56,.06),0 12px 32px rgba(16,60,56,.1);
  --sh-4:0 20px 50px rgba(16,60,56,.18);
  --hero-ov:linear-gradient(100deg,rgba(255,255,255,.97) 0%,rgba(255,255,255,.93) 34%,rgba(255,255,255,.6) 56%,rgba(255,255,255,.12) 78%,rgba(255,255,255,0) 100%),linear-gradient(180deg,rgba(13,148,136,.05),rgba(14,147,181,.05));
  --hero-ov-m:linear-gradient(180deg,rgba(255,255,255,.96) 0%,rgba(255,255,255,.9) 55%,rgba(255,255,255,.72) 100%);
  --hero-ink:#0b2a28; --hero-op:.96; --hero-ft:none;
  --nav-grad:linear-gradient(180deg,#fff 0%,#fbfdfd 60%,#f7fbfb 100%);
  --scroll:#cfdedd; --scroll-hi:#b9cfcd;
  --bd-hi:#c3d8d6; --fill-mute:#c2d3d2; --fill-mute-2:#c9dbda;
  --card-a:#f6fcfb; --card-b:#fdfefe; --red-a:#fffbfb; --warn-a:#fffcf4;
  --on-accent:#fff; --on-danger:#fff; --on-cyan:#0a6f8c; --on-warn:#96580a;
  --danger-2:#e7716e; --danger-bd:#eaa9a7;
  --ink:#173432; --ink-2:#20403e; --od-ink:#bd302d;
  --mini-red:#7a2c2a; --nudge-ink:#5f4310; --line-accent:#dcece9;
  --toast:linear-gradient(180deg,#0d9488,#0b7a70); --toast-err:linear-gradient(180deg,#d9403c,#bd302d);
  color-scheme:light;
}
/* 硬编码色的主题化：用 html 前缀提一层优先级，两个主题共用同一套规则 */
html .nav{background:var(--nav-grad)}
html ::-webkit-scrollbar-thumb{background:var(--scroll)}
html ::-webkit-scrollbar-thumb:hover{background:var(--scroll-hi)}
html .hero h1{color:var(--hero-ink)}
html .hero-ov{background:var(--hero-ov)}
html .hero-img{opacity:var(--hero-op);filter:var(--hero-ft)}
html .card-h{background:linear-gradient(180deg,var(--card-b),var(--surface))}
html .focus{background:linear-gradient(180deg,var(--red-a),var(--surface))}
html .mini-alert{background:linear-gradient(180deg,var(--red-a),var(--surface))}
html .mini-alert .mt{color:var(--mini-red)}
html .mini-ok{background:linear-gradient(180deg,#eaf7f4,var(--surface))}
html .focus.clear .focus-h{border-color:var(--line-accent)}
html .item.od .it-title{color:var(--od-ink)}
html .chk{border-color:var(--bd-hi)}
html .pt-chk{border-color:var(--bd-hi)}
html .item.pr4::before{background:var(--fill-mute)}
html .item.done::before{background:var(--fill-mute)}
html .pt-n{color:var(--ink-2)}
html .btn:hover{border-color:var(--bd-hi)}
html .btn-primary{color:var(--on-accent)}
html .btn-primary:hover{color:var(--on-accent)}
html .btn-danger:hover{border-color:var(--danger-bd)}
html .pill.proj-link:hover{color:var(--on-accent)}
html .tag-chip:hover{border-color:var(--bd-hi)}
html .tag-chip.on{color:var(--on-accent)}
html .pill.cyan{color:var(--on-cyan)}
html .p2{color:var(--on-warn)}
html .p3{color:var(--on-cyan)}
html .nav-count.hot{color:var(--on-danger)}
html .chk.rep.on{color:var(--on-accent)}
html .note{background:linear-gradient(165deg,var(--card-a) 0%,var(--surface) 55%)}
html .note:hover{border-color:var(--bd-hi)}
html .note p{color:var(--ink)}
html .kv .v{color:var(--ink-2)}
html .stat{background:linear-gradient(165deg,var(--card-a),var(--surface) 70%)}
html .stat.red{background:linear-gradient(165deg,var(--red-a),var(--surface) 70%)}

html .proj.blocked{background:linear-gradient(180deg,var(--red-a),var(--surface))}
html .proj.blocked::after{background:linear-gradient(90deg,var(--danger),var(--danger-2))}

html .toast{background:var(--toast)}

html input[type=text]:hover,html input[type=date]:hover,html select:hover,html textarea:hover{border-color:var(--bd-hi)}
@media(max-width:860px){ html .hero-ov{background:var(--hero-ov-m)} }
/* 【v18】主题按钮右对齐到边栏内边缘，与紧随其下的同步徽标组成一簇（原来 margin-left:6px 紧贴品牌名） */
.lang-btn.thm{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;padding:4px 7px}
.lang-btn.thm svg{width:13px;height:13px}
/* 【v25】横竖屏切换按钮：与主题按钮完全同规格（13px 图标 + 4px/7px 内边距 = 23px 高），
   同处 .brand-act 一簇内并排，因此不会抬高品牌行高度。
   图标是一个竖放手机，切到横屏后整体旋转 90° 并高亮，用朝向本身表达当前状态 */
.brand-act #rotBtn{margin-left:0;display:inline-flex;align-items:center;justify-content:center;padding:4px 7px}
.brand-act #rotBtn svg{width:13px;height:13px;transition:transform .26s ease}
html[data-orient="land"] #rotBtn svg{transform:rotate(90deg)}
html[data-orient="land"] #rotBtn{color:var(--accent-deep);border-color:var(--accent);background:var(--accent-soft2)}
/* 【v26】横屏视图（页面内旋转模拟）—— 真实方向锁不可用时的兜底，也是新版的主路径：
   给 body 转 90° 并把宽高对调（宽取视口高、高取视口宽），让 844×390 的横屏版面
   真实铺满「竖持」手机的屏幕。这样即便系统锁了旋转方向、或浏览器拒绝 lock，
   用户横置手机后看到的也是正常的横屏界面，而不再是竖屏拉伸。
   两个关键点：
     ① body 用 position:fixed 承接旋转 —— 它是 transform 容器，页面里的 .toasts / .mask 等
        fixed 浮层会一并跟着转，不会出现"页面转了、弹层没转"的错位；
     ② 坐标轴整体转了 90°，vh / vw 的语义随之对调：凡原本按「视口高」定的尺寸
        （.app 的最小高、宽屏下 .nav 的固定高、.modal 的最大高）必须改按视口宽算，
        否则内容会比容器高出一大截、底部留下大片空白。 */
html[data-orient-rot="1"]{overflow:hidden}
html[data-orient-rot="1"] body{
  position:fixed;top:0;left:0;
  width:100vh;height:100vw;
  width:100dvh;height:100dvw;
  transform:rotate(90deg) translateY(-100%);
  transform-origin:top left;
  overflow:hidden;
  /* 【v29】rot 模式下把 body 子树的手势权整体交出去（touch-action 沿祖先链取交集），
     滚动统一由下方 JS 的 WBRS 模块用 touchmove 手动驱动 ——
     原生手势管道按「屏幕轴向」找滚动容器，而旋转后页面的 Y 轴落在屏幕 X 轴上，
     用户在屏幕上上下划对应的是页面 X 轴（overflow-x:hidden），原生路径永远滚不动 */
  touch-action:none;
}
/* 【v27 修复】横屏后「划不动」的根因：让 body 既是被 90° 旋转的元素、又是滚动容器。
   自己转又自己滚，在移动端浏览器里触摸滚动会失效（滚动层与变换层的坐标系打架，iOS 尤其明显），
   用户看到的就是「已经是横屏了，但上下怎么划都不动」。
   修法：body 只当旋转外壳（overflow:hidden），滚动下放给它内部不参与变换的 .app —— 
   .app 是普通元素，是标准应用外壳的滚动容器，触摸滚动可靠；.nav 是 sticky，仍在 .app 内贴着顶部。
   注意 .app 原来的 min-height:100vw 必须换成 height:100%（有确定高度才可能滚动），
   同时给 .main 补 min-height:0 —— 纵向 flex 子项默认 min-height:auto，不补的话
   .main 会被内容撑高到全高，.app 里就永远没有可滚动区。 */
html[data-orient-rot="1"] .app{
  height:100%;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  /* 【v29】rot 模式下不再依赖原生触摸滚动（轴向错位，见 body 处注释），
     JS 驱动负责一切滚动；touch-action:none 防止浏览器抢跑错误轴向的手势 */
  touch-action:none;
}
html[data-orient-rot="1"] .main{min-height:0}
html[data-orient-rot="1"] .modal{max-height:calc(100vw - 44px);max-height:calc(100dvw - 44px)}
html[data-orient-rot="1"] .toast{max-width:min(90vh,370px)}
/* 宽屏布局下的边栏是「固定高 100vh + 内部滚动」，旋转后同样是视口高语义，需一并换成视口宽；
   窄屏（≤860px）的边栏是顶部横条（height:auto），不能动，故只在 861px 以上覆盖 */
@media (min-width:861px){
  html[data-orient-rot="1"] .nav{height:100vw;height:100dvw;overflow-y:auto;overflow-x:hidden}
}


/* ===== 日程日历 ===== */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h{text-align:center;font-size:12px;color:var(--text-3);padding:4px 0;font-weight:600}
.cal-cell{border:1px solid var(--line-soft);border-radius:10px;min-height:84px;padding:5px;cursor:pointer;background:var(--card);transition:border-color .15s,background .15s;min-width:0}
html .cal-cell:hover{border-color:var(--bd-hi)}
.cal-cell.out{opacity:.42}
.cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cal-cell.rest{background:linear-gradient(180deg,var(--red-a),var(--card))}
.cal-cell.makeup{background:linear-gradient(180deg,var(--warn-a),var(--card))}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:3px;min-width:0}
.cal-d{font-size:13px;font-weight:650;color:var(--text);flex:0 0 auto}
.cal-badge{font-size:10px;line-height:1;padding:2px 5px;border-radius:6px;white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bdg-rest{background:#d9403c;color:#fff}
.bdg-work{background:#e0821e;color:#3a2400}
.bdg-we{background:var(--fill-mute-2);color:var(--text-3)}
.cal-evs{display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-ev{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;width:100%;min-width:0;text-align:left;font:inherit;font-size:11.5px;padding:3px 6px;border-radius:6px;background:var(--surface);color:var(--text);border:0;cursor:pointer;overflow:hidden;white-space:normal;word-break:break-all;line-height:1.42}
html .cal-ev:hover{filter:brightness(1.06)}
.cal-more{font-size:10.5px;color:var(--text-3);padding-left:4px}
.sched-hint{font-size:12px;color:var(--text-3);margin:0 0 10px;line-height:1.6}
.sch-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sch-nav strong{font-size:15px;letter-spacing:.3px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk-col{border:1px solid var(--line-soft);border-radius:10px;min-height:170px;padding:6px;background:var(--card);cursor:pointer;min-width:0}
html .wk-col:hover{border-color:var(--bd-hi)}
.wk-col.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.wk-col.rest{background:linear-gradient(180deg,var(--red-a),var(--card))}
.wk-col.makeup{background:linear-gradient(180deg,var(--warn-a),var(--card))}
.wk-h{display:flex;align-items:center;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.wk-d{font-size:14px;font-weight:680;color:var(--text)}
.wk-wd{font-size:11px;color:var(--text-3)}
.wk-evs{display:flex;flex-direction:column;gap:4px;min-width:0}
.wk-ev{display:block;width:100%;min-width:0;text-align:left;font:inherit;font-size:11.5px;padding:4px 7px;border-radius:6px;background:var(--surface);color:var(--text);border:0;cursor:pointer;overflow:hidden;white-space:normal;word-break:break-all;line-height:1.42}
html .wk-ev:hover{filter:brightness(1.06)}
.wk-empty{font-size:11px;color:var(--text-3);padding:6px 2px}
@media(max-width:860px){
  .cal-grid{gap:2px}.cal-cell{min-height:64px;padding:3px}
  .cal-d{font-size:12px}.cal-ev{font-size:10px;padding:2px 4px}
  .cal-badge{font-size:9px;padding:2px 3px;max-width:calc(100% - 24px)}
  /* 周视图改为横向滑动列：每列保底 148px，内容不再挤压溢出 */
  .wk{grid-template-columns:unset;grid-auto-flow:column;grid-auto-columns:minmax(148px,1fr);gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:none}
  .wk::-webkit-scrollbar{display:none}
  .wk-col{min-height:120px;padding:6px}
  .wk-h{flex-wrap:nowrap;white-space:nowrap}
  .wk-d{font-size:12px}
}
/* ---------- 全局搜索结果 ---------- */
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:none}
.srow .st{min-width:0;flex:1 1 auto}
.srow .st b{display:block;font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .st span{display:block;font-size:12px;color:var(--text-4);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .btn{flex:0 0 auto;white-space:nowrap}
/* ---------- 云同步状态徽标（借鉴 Notion / Google Docs 同步指示） ----------
   【v17】原先是 position:fixed 钉在左下角的浮层，偶尔会压住正文内容；改为普通流内元素。
   【v18】挂载点再挪一次：页面右上角顶部栏 → 左侧边栏品牌行「主题切换按钮」旁边。
   【v19】不再靠 margin:auto 各自抢占剩余空间，改与主题按钮同处 .brand-act 组内并排（gap 5px）。 */
/* 【v19】徽标压缩：字号 11→10px、内边距 4.5/10→2/6px、状态点 8→6px、文案收进 4 字以内
   （完整状态说明见 title 悬停提示），整体宽度由约 96px 降到 44~56px */
.sync-chip{display:inline-flex;align-items:center;gap:4px;line-height:1.45;
  padding:2px 6px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.2px;cursor:default;
  background:var(--surface);border:1px solid var(--line);color:var(--text-2);white-space:nowrap;user-select:none}
.sync-slot{display:inline-flex;align-items:center;flex:0 0 auto}
/* 【v18】矮屏兜底：边栏为 100vh 固定高，徽标多占一行后（<647px 视口）底部页脚会被裁；
   允许边栏纵向滚动，保证导航项与页脚都能访问到 */
@media (min-width:861px){ .nav{overflow-y:auto;overflow-x:hidden} }
/* 兜底：万一没渲染出 .sync-slot，退化成右上角固定小徽标，保证状态看得见 */
.sync-chip.fixed{position:fixed;right:14px;top:14px;z-index:1200;box-shadow:0 2px 10px rgba(0,0,0,.10)}
/* 【v19】状态点同步缩小 8→6px，与 10px 字号视觉配重 */
.sync-chip .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.sync-chip.ok .dot{background:#22a06b}
.sync-chip.busy .dot{background:var(--accent);animation:syncPulse 1s ease-in-out infinite}
.sync-chip.err .dot{background:#d9403c;animation:syncPulse .6s ease-in-out infinite}
.sync-chip.off .dot{background:var(--text-4)}
.sync-chip.busy,.sync-chip.err{color:var(--accent)}
.sync-chip.err{color:#d9403c}
@keyframes syncPulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
/* 【v19】窄屏（≤860px 边栏变顶部横条）空间充足，按钮与徽标同处 .brand-act 内并排，无需额外定位 */
@media(max-width:860px){.sync-chip{padding:2px 6px;font-size:9.5px}}
/* ---------- GitHub 风格任务完成热力图 ---------- */
.heat{display:flex;flex-direction:column;gap:8px}
.heat-grid{display:flex;gap:3px;overflow-x:auto;padding:2px 0;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.heat-col{display:grid;grid-template-rows:repeat(7,1fr);gap:3px}
.heat-cell{width:11px;height:11px;border-radius:2.5px;background:var(--surface);border:1px solid var(--line-soft)}
.heat-l0{background:var(--surface);border:1px solid var(--line-soft)}
.heat-l1{background:#9ec9f0;border-color:#9ec9f0}
.heat-l2{background:#5f9fe4;border-color:#5f9fe4}
.heat-l3{background:#2f7de0;border-color:#2f7de0}
.heat-l4{background:#1b5bb0;border-color:#1b5bb0}
.heat-legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-3)}
.heat-legend .heat-cell{width:10px;height:10px}
@media(max-width:860px){.heat-cell{width:10px;height:10px}}
/* ---------- 日程相对日期徽标 ---------- */
.pill.rel{font-weight:650}
.pill.rel.past{background:rgba(217,64,60,.14);color:#d9403c}
.pill.rel.today{background:rgba(47,125,224,.15);color:#2f7de0}
/* ---------- 【v13】学习计划模块 ---------- */
/* 30 天打卡格：按「评分」深浅着色，未打卡留空；点击即载入当天记录 */
.stu-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
@media(max-width:860px){.stu-grid{grid-template-columns:repeat(6,1fr);gap:5px}}
.stu-cell{
  position:relative;aspect-ratio:1/1;border-radius:9px;border:1px solid var(--line-soft);
  background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;cursor:pointer;transition:.15s;padding:2px;overflow:hidden;
}
.stu-cell:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--sh-2)}
.stu-cell .d{font-size:12.5px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stu-cell .m{font-size:9.5px;line-height:1;opacity:.85;font-variant-numeric:tabular-nums}
.stu-cell.lv1{background:#d6f0ea;border-color:#b6e5dc}
.stu-cell.lv2{background:#8fdcc9;border-color:#7ad3bd}
.stu-cell.lv3{background:#43bfa4;border-color:#35b295;color:#04231f}
.stu-cell.lv4{background:#0d9488;border-color:#0b8074;color:#eafffb}
.stu-cell.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.stu-cell.future{opacity:.34;cursor:default}
.stu-cell.future:hover{transform:none;box-shadow:none;border-color:var(--line-soft)}
/* 八维评分：5 个小方块，点一下即打分（再次点击清零） */
/* 每格＝标签(34px) + 5 个 22px 方块(110+12 间距) ≈ 160px，auto-fit 按此换行 */
.stu-dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px}
.stu-dim{display:flex;align-items:center;gap:7px;min-width:0}
.stu-dim .dl{font-size:12px;color:var(--text-2);font-weight:600;flex:0 0 34px;white-space:nowrap}
.stu-dim .ds{display:flex;gap:3px;min-width:0}
.stu-dim .dsb{
  width:22px;height:22px;flex:0 0 22px;border-radius:5px;border:1px solid var(--line-soft);
  background:var(--surface-2);cursor:pointer;padding:0;transition:.13s;
}
.stu-dim .dsb:hover{border-color:var(--accent)}
.stu-dim .dsb.on{background:linear-gradient(180deg,#2dd4bf,var(--accent-dark));border-color:var(--accent-dark)}
/* 长文本输入在窄屏不再被 flex 压扁 */
.stu-ta{min-height:62px;resize:vertical}
/* 图例：与日历格同一套色阶，避免借用 heat-l（蓝系）与 teal 主色不一致 */
.stu-legend{display:flex;align-items:center;gap:5px;margin-top:12px;font-size:11px;color:var(--text-3)}
.stu-legend .sc{width:13px;height:13px;border-radius:3.5px;border:1px solid var(--line-soft);background:var(--surface)}
.stu-legend .sc.lv1{background:#d6f0ea;border-color:#b6e5dc}
.stu-legend .sc.lv2{background:#8fdcc9;border-color:#7ad3bd}
.stu-legend .sc.lv3{background:#43bfa4;border-color:#35b295}
.stu-legend .sc.lv4{background:#0d9488;border-color:#0b8074}
@media(max-width:860px){
  /* 窄屏：八维改成「标签一行 + 5 个按钮均分整行」，
     单个按钮宽度由 26px 提到 44px 以上，满足手指点击热区要求
     （260px 内容宽 - 4 个 3px 间距 = 248 / 5 ≈ 49px）。*/
  .stu-dims{grid-template-columns:1fr}
  .stu-dim{flex-direction:column;align-items:stretch;gap:5px}
  .stu-dim .dl{flex:none}
  .stu-dim .ds{width:100%}
  .stu-dim .dsb{flex:1 1 0;width:auto;height:44px;border-radius:8px}
}
/* ---------- 【v14】学习时间块（按小时 + 四态 + 时长对账） ---------- */
/* 一行 = 小时 + 状态块 + 内容输入。状态块点一下循环，不触发整页重渲染（否则输入框会失焦丢字） */
.blk-row{display:grid;grid-template-columns:52px 74px minmax(0,1fr);gap:9px;align-items:center;padding:6px 0}
.blk-row + .blk-row{border-top:0.5px solid var(--line-soft)}
.blk-h{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.blk-st{
  display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:30px;
  border-radius:var(--radius-xs);border:1px solid var(--line-soft);background:var(--surface-2);
  font-size:12px;font-weight:600;color:var(--text-4);cursor:pointer;padding:0 6px;transition:.13s;
  font-family:inherit;
}
.blk-st:hover{border-color:var(--accent);color:var(--text-2)}
.blk-st.s-focus{background:var(--accent-soft);color:var(--accent-deep);border-color:rgba(13,148,136,.34)}
.blk-st.s-normal{background:var(--cyan-soft);color:#5ba3c4;border-color:rgba(14,147,181,.32)}
.blk-st.s-drift{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)}
.blk-st.s-rest{background:var(--surface-2);color:var(--text-3);border-color:var(--line)}
.blk-tx{
  width:100%;min-height:30px;padding:4px 9px;border-radius:var(--radius-xs);
  border:1px solid transparent;background:transparent;color:var(--text);font-size:13px;
  font-family:inherit;transition:.13s;
}
.blk-tx::placeholder{color:var(--text-4)}
.blk-tx:hover{border-color:var(--line-soft);background:var(--surface-2)}
.blk-tx:focus{outline:none;border-color:var(--accent);background:var(--surface-2)}
.blk-tx:disabled{cursor:default}
/* 时长对账条：两块数字并排，差值 >30min 才提示（避免为几分钟的正常误差报警） */
.blk-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:11px;margin-bottom:13px}
.blk-sum .bx{background:var(--surface-2);border-radius:var(--radius-xs);padding:10px 12px}
.blk-sum .bx .k{font-size:11.5px;color:var(--text-3);margin-bottom:3px}
.blk-sum .bx .v{font-size:21px;font-weight:660;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.blk-sum .bx .u{font-size:12px;color:var(--text-3);font-weight:400;margin-left:3px}
.blk-sum .bx.warn .v{color:var(--warn)}
.blk-sum .bx.good .v{color:var(--accent-deep)}
.blk-note{font-size:12.5px;color:var(--text-2);line-height:1.65;margin-top:2px}
.blk-note b{color:var(--warn);font-weight:650}
.blk-note.ok b{color:var(--accent-deep)}
/* 时间轴速览：一格一小时，点一下跳到该行 */
.blk-strip{display:flex;gap:2px;overflow-x:auto;padding:2px 0 5px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.blk-strip i{
  flex:1 1 0;min-width:15px;height:19px;border-radius:3px;background:var(--surface-2);
  border:1px solid var(--line-soft);font-style:normal;
}
.blk-strip i.s-focus{background:var(--accent);border-color:var(--accent-dark)}
.blk-strip i.s-normal{background:#2f8ba3;border-color:#2f8ba3}
.blk-strip i.s-drift{background:var(--danger);border-color:var(--danger)}
.blk-strip i.s-rest{background:var(--surface);border-color:var(--line)}
.blk-strip i.now{box-shadow:0 0 0 1.5px var(--text-3)}
.blk-acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
/* 窄屏：小时与状态并排一行，内容独占一行（输入区不被压到不足44px） */
@media(max-width:860px){
  .blk-row{grid-template-columns:48px 66px minmax(0,1fr);gap:7px;padding:7px 0}
  .blk-st{min-height:34px}
  .blk-tx{min-height:36px}
  .blk-sum{grid-template-columns:1fr 1fr;gap:9px}
  .blk-sum .bx .v{font-size:19px}
}
@media(max-width:420px){
  .blk-row{grid-template-columns:44px 58px minmax(0,1fr);gap:6px}
  .blk-st{font-size:11px;padding:0 3px;min-height:34px}
  .blk-h{font-size:11.5px}
}
/* 一周热力网格：7 天 × N 小时，横向找规律 */
.blk-week-grid{display:flex;flex-direction:column;gap:4px;margin-top:13px}
.bwg-row{display:grid;grid-template-columns:38px minmax(0,1fr);gap:7px;align-items:center}
.bwg-lb{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.bwg-cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(11px,1fr));gap:3px}
.bwg-cells i{height:15px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line-soft);display:block}
.bwg-cells i.s-focus{background:var(--accent);border-color:var(--accent-dark)}
.bwg-cells i.s-normal{background:#2f8ba3;border-color:#2f8ba3}
.bwg-cells i.s-drift{background:var(--danger);border-color:var(--danger)}
.bwg-cells i.s-rest{background:var(--surface);border-color:var(--line)}
/* 【v17】番茄钟：住在时间块卡内。倒计时用等宽数字避免秒跳时抖动 */
.pomo-box{
  display:grid;grid-template-columns:auto 1fr;gap:9px 14px;align-items:center;
  padding:12px 14px;margin-bottom:13px;border-radius:var(--radius-sm);
  background:var(--surface-2);border:1px solid var(--line-soft);
}
.pomo-box.on{border-color:rgba(13,148,136,.38);background:var(--accent-soft)}
.pomo-box.brk{border-color:var(--line);background:var(--surface)}
.pomo-box .pomo-l{display:flex;align-items:center;gap:11px;min-width:0}
.pomo-box .pomo-t{
  font-size:27px;font-weight:660;letter-spacing:-.6px;font-variant-numeric:tabular-nums;
  color:var(--text);line-height:1;min-width:88px;
}
.pomo-box.brk .pomo-t{color:var(--text-2)}
.pomo-box .pomo-m{display:flex;flex-direction:column;gap:5px;min-width:0}
.pomo-box .pomo-mn{font-size:11.5px;color:var(--text-3);white-space:nowrap}
.pomo-box .pomo-bar{display:block;width:100%;max-width:190px;height:4px;border-radius:2px;background:var(--line-soft);overflow:hidden}
.pomo-box .pomo-bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .9s linear}
.pomo-box.brk .pomo-bar i{background:var(--text-3)}
.pomo-box .pomo-r{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.pomo-box .hl{grid-column:1 / -1;font-size:11.5px;color:var(--text-4);line-height:1.5}
@media(max-width:860px){
  .pomo-box{grid-template-columns:1fr;gap:9px;padding:11px 12px}
  .pomo-box .pomo-t{font-size:23px;min-width:76px}
  .pomo-box .pomo-r .btn{flex:1 1 auto}
  .pomo-box .pomo-bar{max-width:none}
}
/* 【v16】记录页顶部摘要条：把「连续天数 / 本周有效 / 平均评分」三个数字钉在每天必经的路径上，
   详情去数据页 —— 避免「统计挪到另一页后就再也没看过」 */
.stu-strip{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:11px 16px;margin-bottom:16px;border-radius:var(--radius-sm);
  background:var(--surface-2);border:1px solid var(--line-soft);
}
.stu-strip .it{display:flex;align-items:baseline;gap:6px;min-width:0}
.stu-strip .it b{font-size:17px;font-weight:660;font-variant-numeric:tabular-nums;letter-spacing:-.3px;color:var(--text)}
.stu-strip .it em{font-style:normal;font-size:11.5px;color:var(--text-3);white-space:nowrap}
.stu-strip .bar{width:1px;height:18px;background:var(--line-soft);flex:0 0 1px}
.stu-strip .btn{margin-left:auto;flex:0 0 auto}
@media(max-width:860px){
  .stu-strip{gap:9px 13px;padding:10px 13px}
  .stu-strip .it b{font-size:15.5px}
  .stu-strip .btn{margin-left:0;flex:1 1 100%}
}
/* 时段配置编辑器：一行内排完，窄屏自动换行 */
.blk-cfg{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  padding:10px 12px;margin-bottom:12px;border-radius:var(--radius-xs);
  background:var(--surface-2);border:1px solid var(--line-soft);
}
.blk-cfg .lb{font-size:12px;color:var(--text-3);white-space:nowrap}
.blk-cfg select{padding:4px 7px;font-size:12.5px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.blk-cfg input[type=text]{width:96px;padding:4px 8px;font-size:12.5px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.blk-cfg .hl{flex:1 1 100%;font-size:11.5px;color:var(--text-4);margin-top:2px;line-height:1.5}
/* 走神提示：与「对账结论」区分开，用警示色 + 图标，表明它是可回收线索而非错误 */
.blk-note.drift{display:flex;align-items:flex-start;gap:7px;margin-top:7px;color:var(--warn)}
.blk-note.drift svg{width:14px;height:14px;flex:0 0 14px;margin-top:2px}
.blk-note.drift span{flex:1;min-width:0}
/* 图例：可点击当筛选的话太重，这里只做对照说明 */
.blk-legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:13px;font-size:11.5px;color:var(--text-3)}
@media(max-width:860px){
  .bwg-row{grid-template-columns:32px minmax(0,1fr);gap:5px}
  .bwg-lb{font-size:10px}
  .bwg-cells{gap:2px}
  .bwg-cells i{height:14px;border-radius:2.5px}
}
@media print{ .blk-strip,.blk-acts,.blk-st,.blk-legend{display:none} .blk-tx{border-color:#ccc} }

/* =====================================================================
   【v30】视觉重制层 —— 极光紫青配色
   思路：把原来「墨绿单色 + 灰阶」的配色换成「紫青主色 + 多彩语义色」，
   主色承担品牌与主操作，青/琥珀/翡翠/玫红承担状态语义；深浅两套主题同源，
   只换令牌值，因此所有组件自动跟随，不再逐条硬编码。
   这一层写在最后，用同优先级覆盖前面的令牌与组件规则（后写者胜）。
   ===================================================================== */

/* ---------- 设计令牌 · 暗黑（默认） ---------- */
:root{
  /* 底色：偏冷的深夜蓝，比原来的墨绿更透气，也让紫青主色更跳 */
  --bg:#070B16;
  --bg-2:#0D1424;
  --surface:#121A2E;
  --surface-2:#182340;
  --line:#25325A;
  --line-soft:#1B2542;

  /* 文字：四级灰阶，带一点点蓝调，长文阅读不刺眼 */
  --text:#EAEEFB;
  --text-2:#A9B5D4;
  --text-3:#7C88AA;
  --text-4:#5C688B;

  /* 主色：极光紫（品牌 / 主按钮 / 选中态） */
  --accent:#7C6CFF;
  --accent-dark:#9A8CFF;
  --accent-deep:#BCB2FF;
  --accent-soft:#1E1B4B;
  --accent-soft2:#151433;

  /* 语义色：青（信息）/ 琥珀（提醒）/ 翡翠（完成）/ 玫红（危险）/ 粉（灵感） */
  --cyan:#22D3EE;         --cyan-soft:#0B2A3A;
  --mint:#34D399;         --mint-soft:#0B2E26;
  --warn:#FBBF24;         --warn-soft:#33270F;  --warn-line:#5A4415;
  --danger:#FB7185;       --danger-soft:#3A1626; --danger-line:#5E2138;
  --pink:#F472B6;         --orange:#FB923C;

  --radius:18px;
  --radius-sm:12px;
  --radius-xs:10px;

  /* 阴影：带主色调的柔光，比纯黑投影更「现代 UI」 */
  --sh-1:0 1px 2px rgba(4,7,15,.5);
  --sh-2:0 1px 2px rgba(4,7,15,.45),0 6px 20px rgba(4,7,15,.4);
  --sh-3:0 2px 6px rgba(4,7,15,.45),0 14px 40px rgba(4,7,15,.5);
  --sh-4:0 30px 70px rgba(3,5,12,.7);

  --nav-w:252px;
  --serif:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

  /* 下面这批是给老规则里的硬编码色做主题化的中间令牌 */
  --hero-ov:linear-gradient(100deg,rgba(7,11,22,.97) 0%,rgba(7,11,22,.93) 34%,rgba(7,11,22,.62) 56%,rgba(7,11,22,.16) 78%,rgba(7,11,22,0) 100%),
            linear-gradient(180deg,rgba(124,108,255,.10),rgba(34,211,238,.07));
  --hero-ov-m:linear-gradient(180deg,rgba(7,11,22,.96) 0%,rgba(7,11,22,.92) 55%,rgba(7,11,22,.76) 100%);
  --hero-ink:#F3F1FF; --hero-op:.26; --hero-ft:saturate(1.25) brightness(.72) hue-rotate(-12deg);
  --nav-grad:linear-gradient(180deg,#0C1226 0%,#0A1020 55%,#080D1A 100%);
  --scroll:#2C3A63; --scroll-hi:#3E4F80;
  --bd-hi:#3A4A78; --fill-mute:#33415F; --fill-mute-2:#44527A;
  --card-a:#16203A; --card-b:#17223C; --red-a:#2A1524; --warn-a:#2C2311;
  --on-accent:#0A0716; --on-danger:#2A0812; --on-cyan:#22D3EE; --on-warn:#FBBF24;
  --danger-2:#FDA4AF; --danger-bd:#7A2C44;
  --ink:#DCE3F5; --ink-2:#C9D3EC; --od-ink:#FDA4AF;
  --mini-red:#FDA4AF; --nudge-ink:#F5D48A; --line-accent:#2A2350;
  --toast:linear-gradient(160deg,#2A2270,#141A3C);
  --toast-err:linear-gradient(160deg,#7A1B33,#3E0F22);
  --brand-grad:linear-gradient(120deg,#BCB2FF 0%,#7C6CFF 38%,#22D3EE 100%);
  --ring:rgba(124,108,255,.30);
}

/* ---------- 设计令牌 · 明亮 ---------- */
html[data-theme="light"]{
  --bg:#F4F5FC;
  --bg-2:#EBEDF9;
  --surface:#FFFFFF;
  --surface-2:#F7F8FE;
  --line:#E1E4F3;
  --line-soft:#ECEEF8;

  --text:#141A2E;
  --text-2:#4C5673;
  --text-3:#7B85A0;
  --text-4:#A2AAC0;

  --accent:#6355F0;
  --accent-dark:#7666F5;
  --accent-deep:#4B3FD6;
  --accent-soft:#EEEBFF;
  --accent-soft2:#F6F4FF;

  --cyan:#0891B2;         --cyan-soft:#E4F6FA;
  --mint:#0F9D74;         --mint-soft:#E4F7F1;
  --warn:#C2760A;         --warn-soft:#FDF5E6;  --warn-line:#F0E0BE;
  --danger:#E5485C;       --danger-soft:#FDF0F2; --danger-line:#F5CFD6;
  --pink:#DB2777;         --orange:#EA580C;

  --sh-1:0 1px 2px rgba(23,32,66,.05);
  --sh-2:0 1px 2px rgba(23,32,66,.05),0 6px 18px rgba(23,32,66,.06);
  --sh-3:0 2px 6px rgba(23,32,66,.07),0 16px 40px rgba(23,32,66,.10);
  --sh-4:0 30px 70px rgba(23,32,66,.18);

  --hero-ov:linear-gradient(100deg,rgba(255,255,255,.97) 0%,rgba(255,255,255,.94) 34%,rgba(255,255,255,.66) 56%,rgba(255,255,255,.14) 78%,rgba(255,255,255,0) 100%),
            linear-gradient(180deg,rgba(99,85,240,.07),rgba(8,145,178,.06));
  --hero-ov-m:linear-gradient(180deg,rgba(255,255,255,.97) 0%,rgba(255,255,255,.93) 55%,rgba(255,255,255,.82) 100%);
  --hero-ink:#1A1442; --hero-op:.9; --hero-ft:saturate(1.05);
  --nav-grad:linear-gradient(180deg,#FFFFFF 0%,#FBFCFF 55%,#F6F7FE 100%);
  --scroll:#C8CEE6; --scroll-hi:#AEB6D6;
  --bd-hi:#C8CEE6; --fill-mute:#C6CCE2; --fill-mute-2:#D3D8EA;
  --card-a:#F8F8FF; --card-b:#FBFCFF; --red-a:#FFF7F8; --warn-a:#FFFBF1;
  --on-accent:#FFFFFF; --on-danger:#FFFFFF; --on-cyan:#0A6F8C; --on-warn:#96580A;
  --danger-2:#F27C8C; --danger-bd:#EFA6B2;
  --ink:#1B2340; --ink-2:#2A3452; --od-ink:#C93A4D;
  --mini-red:#A32C3C; --nudge-ink:#6B4A08; --line-accent:#E4E0FF;
  --toast:linear-gradient(160deg,#6355F0,#4436C4);
  --toast-err:linear-gradient(160deg,#E5485C,#B3203A);
  --brand-grad:linear-gradient(120deg,#4B3FD6 0%,#6355F0 45%,#0891B2 100%);
  --ring:rgba(99,85,240,.24);
}

/* ---------- 页面底：一层极光雾，避免大面积死平 ---------- */
html body{
  background:
    radial-gradient(1100px 520px at 8% -8%,rgba(124,108,255,.20),transparent 62%),
    radial-gradient(900px 480px at 96% -6%,rgba(34,211,238,.14),transparent 60%),
    radial-gradient(760px 620px at 62% 108%,rgba(244,114,182,.10),transparent 66%),
    var(--bg);
  background-attachment:fixed;
}
html[data-theme="light"] body{
  background:
    radial-gradient(1000px 480px at 6% -8%,rgba(99,85,240,.13),transparent 60%),
    radial-gradient(880px 460px at 98% -6%,rgba(8,145,178,.11),transparent 58%),
    radial-gradient(700px 560px at 60% 106%,rgba(219,39,119,.07),transparent 64%),
    var(--bg);
  background-attachment:fixed;
}

/* ---------- 侧边栏 ---------- */
html .nav{
  border-right:1px solid var(--line-soft);
  padding:22px 14px 18px;
  box-shadow:1px 0 0 rgba(255,255,255,.02),18px 0 60px rgba(0,0,0,.18);
}
html[data-theme="light"] .nav{box-shadow:1px 0 0 rgba(255,255,255,.7),14px 0 48px rgba(23,32,66,.05)}
html .brand{padding:2px 8px 15px;border-bottom:1px solid var(--line-soft)}
html .brand-t{
  font-size:16px;font-weight:750;letter-spacing:.2px;
  background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:var(--accent-deep);
}
@supports not ((-webkit-background-clip:text) or (background-clip:text)){
  html .brand-t{background:none;-webkit-text-fill-color:currentColor;color:var(--accent-deep)}
}
html .brand-s{font-size:11.5px;color:var(--text-3);letter-spacing:.3px}
html .nav-label{
  font-size:10px;letter-spacing:1.6px;color:var(--text-4);
  padding:18px 10px 8px;
}
html .nav-item{
  border-radius:12px;padding:9.5px 11px;font-size:13.5px;font-weight:560;
  color:var(--text-2);border:1px solid transparent;
}
html .nav-item:hover{background:var(--accent-soft2);color:var(--text);border-color:var(--line-soft)}
html .nav-item.on{
  background:linear-gradient(100deg,rgba(124,108,255,.24),rgba(34,211,238,.10) 70%,transparent);
  color:#FFFFFF;border-color:rgba(124,108,255,.34);
  box-shadow:0 8px 22px rgba(124,108,255,.16),inset 0 1px 0 rgba(255,255,255,.06);
}
html[data-theme="light"] .nav-item.on{
  background:linear-gradient(100deg,rgba(99,85,240,.14),rgba(8,145,178,.08) 70%,transparent);
  color:var(--accent-deep);border-color:rgba(99,85,240,.26);
  box-shadow:0 6px 18px rgba(99,85,240,.10);
}
html .nav-item.on::before{
  left:-14px;width:3px;height:22px;border-radius:0 4px 4px 0;
  background:linear-gradient(180deg,var(--accent),var(--cyan));
  box-shadow:0 0 14px rgba(124,108,255,.7);
}
html .nav-item.on svg{color:var(--accent-dark)}
html[data-theme="light"] .nav-item.on svg{color:var(--accent)}
html .nav-item svg{width:17px;height:17px;stroke-width:1.9}
html .nav-count{background:var(--bg-2);color:var(--text-3);font-weight:700}
html .nav-item.on .nav-count{
  background:rgba(124,108,255,.22);color:#FFFFFF;box-shadow:inset 0 0 0 1px rgba(124,108,255,.3);
}
html[data-theme="light"] .nav-item.on .nav-count{background:rgba(99,85,240,.14);color:var(--accent-deep)}
html .nav-count.hot{
  background:linear-gradient(135deg,var(--danger),var(--orange));color:#fff;
  box-shadow:0 3px 10px rgba(251,113,133,.4);
}
html .nav-foot{color:var(--text-4);border-top:1px solid var(--line-soft)}
html .nav-foot b{color:var(--text-2)}

/* ---------- Hero：极光 + 照片叠底 ---------- */
html .hero{
  border-radius:22px;border:1px solid var(--line);
  min-height:176px;
  background:
    radial-gradient(560px 220px at 12% 4%,rgba(124,108,255,.42),transparent 66%),
    radial-gradient(520px 240px at 78% 106%,rgba(34,211,238,.30),transparent 68%),
    radial-gradient(360px 200px at 96% 12%,rgba(244,114,182,.22),transparent 70%),
    linear-gradient(135deg,#241E5E 0%,#14183C 48%,#0C1230 100%);
  box-shadow:0 24px 60px rgba(10,8,40,.45),inset 0 1px 0 rgba(255,255,255,.08);
  overflow:hidden;
}
html[data-theme="light"] .hero{
  background:
    radial-gradient(560px 220px at 10% 0%,rgba(124,108,255,.30),transparent 64%),
    radial-gradient(520px 240px at 82% 108%,rgba(34,211,238,.24),transparent 66%),
    linear-gradient(135deg,#F1EEFF 0%,#FBF9FF 52%,#EFFBFF 100%);
  box-shadow:0 18px 44px rgba(60,52,140,.12),inset 0 1px 0 rgba(255,255,255,.9);
}
html .hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1px);
  background-size:26px 26px;opacity:.35;
  mask-image:linear-gradient(100deg,#000,transparent 62%);
  -webkit-mask-image:linear-gradient(100deg,#000,transparent 62%);
}
html[data-theme="light"] .hero::after{background-image:radial-gradient(rgba(75,63,214,.10) 1px,transparent 1px);opacity:.5}
html .hero-img{opacity:var(--hero-op);filter:var(--hero-ft);mix-blend-mode:luminosity}
html[data-theme="light"] .hero-img{mix-blend-mode:multiply}
html .hero-c{padding:30px 34px;max-width:660px;position:relative;z-index:2}
html .hero-eyebrow{
  color:var(--accent-deep);font-size:11px;letter-spacing:1.8px;
  padding:4px 11px;border-radius:999px;width:fit-content;
  background:rgba(124,108,255,.16);border:1px solid rgba(124,108,255,.26);
  margin-bottom:12px;
}
html[data-theme="light"] .hero-eyebrow{background:rgba(99,85,240,.10);border-color:rgba(99,85,240,.20)}
html .hero h1{
  font-size:32px;font-weight:750;letter-spacing:-.6px;line-height:1.22;
  color:var(--hero-ink);
}
html .hero p{font-size:13.5px;color:var(--text-2);max-width:560px;margin-top:10px}
html .hero p b{color:var(--accent-deep);font-weight:700}
html[data-theme="light"] .hero p{color:#4C5673}
html[data-theme="light"] .hero p b{color:#4B3FD6}
html .hero p .rd{color:var(--danger);font-weight:700}

/* ---------- 顶栏 / 卡片 ---------- */
html .topbar h1{
  font-size:24px;font-weight:750;letter-spacing:-.5px;
  display:flex;align-items:center;gap:10px;
}
html .topbar h1::before{
  content:"";display:inline-block;width:5px;height:20px;border-radius:3px;
  background:linear-gradient(180deg,var(--accent),var(--cyan));flex:0 0 5px;
}
html .topbar .sub{font-size:12.5px;color:var(--text-3);margin-top:6px;padding-left:15px}
html .card{
  border-radius:var(--radius);
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 42%),var(--surface);
  border:1px solid var(--line-soft);
  box-shadow:var(--sh-2);
}
html[data-theme="light"] .card{background:linear-gradient(180deg,#FFFFFF,#FCFCFF);box-shadow:var(--sh-2)}
html .card:hover{box-shadow:var(--sh-3);border-color:var(--line)}
html .card-h{
  padding:15px 20px;
  background:linear-gradient(100deg,rgba(124,108,255,.10),rgba(34,211,238,.05) 55%,transparent 92%),var(--surface);
  border-bottom:1px solid var(--line-soft);
}
html[data-theme="light"] .card-h{background:linear-gradient(100deg,rgba(99,85,240,.075),rgba(8,145,178,.045) 55%,transparent 92%),#FFFFFF}

const LANG = (() => {
  try {
    const q = new URL(location.href).searchParams.get('lang');
    return q === 'en' ? 'en' : 'zh';
  } catch (e) { return 'zh'; }
})();
document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
/* T(key, ...args)：值为函数时传参调用，否则直接返回 */
const T = (k, ...a) => {
  const v = I18N[LANG][k];
  if (v === undefined) return I18N.zh[k] !== undefined ? (typeof I18N.zh[k] === 'function' ? I18N.zh[k](...a) : I18N.zh[k]) : k;
  return typeof v === 'function' ? v(...a) : v;
};
/* 切换语言：改 URL 参数后重载，数据不受影响 */
function switchLang() {
  try { window.__wbExitPass && window.__wbExitPass(); } catch (e) {}   /* 自己发起的跳转，别被退出确认拦住 */
  const u = new URL(location.href);
  u.searchParams.set('lang', LANG === 'en' ? 'zh' : 'en');
  location.href = u.toString();
}

/* ---------- 主题：暗黑 / 明亮 ---------- */
const THEME_KEY = 'pd_workbench_theme';
let THEME = (() => { try { return localStorage.getItem(THEME_KEY) === 'light' ? 'light' : 'dark'; } catch (e) { return 'dark'; } })();
function setTheme(t) {
  THEME = t === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem(THEME_KEY, THEME); } catch (e) {}
  const b = $('themeBtn');
  if (b) { b.innerHTML = THEME === 'dark' ? I.sun : I.moon; b.title = THEME === 'dark' ? T('themeToLight') : T('themeToDark'); }
}
