/* ================= 全局搜索 ================= */
const SEARCH_MODS = ['tasks','schedules','personal','inspects','notes','projects','study'];
const SEARCH_MOD_LABEL = { tasks:'searchInTasks', schedules:'searchInSched', personal:'searchInPersonal', inspects:'searchInInspect', notes:'searchInNotes', projects:'searchInProjects', study:'searchInStudy' };
const SEARCH_ICON = { tasks:'task', schedules:'cal', personal:'user', inspects:'shield', notes:'bulb', projects:'proj', study:'book' };
const MOD_NAV = { tasks:'tasks', schedules:'schedule', personal:'personal', inspects:'inspect', notes:'notes', projects:'projects', study:'study' };

function readSearchForm() {
  const f = document.getElementById('searchForm');
  if (!f) return;
  const g = id => { const el = f.querySelector('#' + id); return el ? el.value : ''; };
  ui.search = {
    q: (g('sQ') || '').trim(),
    scope: g('sScope') || 'all',
    range: g('sRange') || 'all',
    start: g('sStart') || '',
    end: g('sEnd') || ''
  };
}
function itemHay(mod, x) {
  switch (mod) {
    case 'tasks': return [x.title, catName(x.cat), x.pid ? projName(x.pid) : '', x.done ? T('stClosed') : T('stTodo'), x.reported ? T('pillReported') : T('pillUnreport')].join(' ');
    case 'schedules': return [x.title, scatName(x.cat), x.note, x.allday ? T('sAllday') : ''].join(' ');
    case 'personal': return [x.title, pcatText(x.cat), x.note].join(' ');
    case 'inspects': return [x.target, catName(x.cat), x.people, x.notes, (resName(x.result) || ''), (IPROG[x.prog] ? IPROG[x.prog].n : '')].join(' ');
    case 'notes': return [x.text, (x.tags || []).join(' ')].join(' ');
    case 'projects': return [x.name, x.stage, x.next, x.blocker, (PSTAT[x.status] ? PSTAT[x.status].n : '')].join(' ');
    /* 【v13】学习打卡：四个长文本 + 八维中文名都纳入检索，搜「睡眠」能搜到当天记录 */
    case 'study': return [x.date, x.content, x.goal, x.summary, x.tomorrow, STU_DIM_CN.sleep].join(' ');
  }
  return '';
}
function itemDate(mod, x) {
  switch (mod) {
    case 'tasks': return x.due || '';
    case 'schedules': return x.date || '';
    case 'personal': return x.due || '';
    case 'inspects': return x.date || '';
    case 'notes': return x.createdAt ? ds(new Date(x.createdAt)) : '';
    case 'projects': return x.updatedAt ? ds(new Date(x.updatedAt)) : '';
    case 'study': return x.date || '';
  }
  return '';
}
function searchBounds(range) {
  if (range === 'week') { const ws = weekStart(TODAY()); return [ws, shift(ws, 6)]; }
  if (range === 'month') { const [y, m] = TODAY().split('-').map(Number); return [ds(new Date(y, m - 1, 1)), ds(new Date(y, m, 0))]; }
  if (range === 'custom') return [ui.search.start || '', ui.search.end || ''];
  return [null, null];
}
function runSearch() {
  const s = ui.search || { q: '', scope: 'all', range: 'all', start: '', end: '' };
  const q = (s.q || '').toLowerCase().trim();
  const [lo, hi] = searchBounds(s.range);
  const inRange = d => {
    if (lo === null && hi === null) return true;
    if (!d) return false;
    if (lo && d < lo) return false;
    if (hi && d > hi) return false;
    return true;
  };
  const mods = s.scope === 'all' ? SEARCH_MODS : [s.scope];
  const out = [];
  mods.forEach(mod => {
    const arr = S[mod] || [];
    arr.forEach(x => {
      const hay = (itemHay(mod, x) || '').toLowerCase();
      if (q && !hay.includes(q)) return;
      if (!inRange(itemDate(mod, x))) return;
      out.push({ mod, x });
    });
  });
  out.sort((a, b) => {
    const va = itemDate(a.mod, a.x) || '0000-00-00', vb = itemDate(b.mod, b.x) || '0000-00-00';
    return vb < va ? -1 : vb > va ? 1 : 0;
  });
  return out;
}
function searchRow(mod, x) {
  const nav = MOD_NAV[mod];
  let title = '', meta = '';
  if (mod === 'tasks') {
    title = x.title;
    meta = (x.due ? x.due : T('searchNoDate')) + ' · ' + (x.done ? T('stClosed') : (PRIO[x.prio] ? PRIO[x.prio].n : ''));
  } else if (mod === 'schedules') {
    title = x.title;
    meta = (x.date ? x.date : T('searchNoDate')) + (x.time ? ' ' + x.time : (x.allday ? ' ' + T('sAllday') : '')) + ' · ' + scatName(x.cat);
  } else if (mod === 'personal') {
    title = x.title;
    meta = (x.due ? x.due : T('searchNoDate')) + ' · ' + pcatText(x.cat) + (x.done ? ' · ' + T('stClosed') : '');
  } else if (mod === 'inspects') {
    title = x.target;
    meta = (x.date ? x.date : T('searchNoDate')) + ' · ' + catName(x.cat) + ' · ' + (IPROG[x.prog] ? IPROG[x.prog].n : '');
  } else if (mod === 'notes') {
    title = x.text;
    meta = (x.tags && x.tags.length) ? x.tags.join('、') : T('searchNoDate');
  } else if (mod === 'projects') {
    title = x.name;
    meta = (PSTAT[x.status] ? PSTAT[x.status].n : '') + (x.stage ? ' · ' + x.stage : '');
  } else if (mod === 'study') {
    title = (x.content || x.goal || x.date);
    meta = x.date + ' · ' + T('stuMinUnit', x.mins) + (x.score ? ' · ' + x.score : '');
  }
  return `<div class="srow">
    <div class="st"><b>${esc(title)}</b><span>${esc(meta)}</span></div>
    <button class="btn btn-sm" data-act="go" data-to="${nav}">${I.fwd}${T('searchOpen')}</button>
  </div>`;
}
function vSearch() {
  const s = ui.search || { q: '', scope: 'all', range: 'all', start: '', end: '' };
  const active = (s.q || '').trim() || s.range !== 'all' || s.scope !== 'all';
  const results = active ? runSearch() : [];
  const scopeOpts = [['all','scopeAll'],['tasks','scopeTasks'],['schedules','scopeSched'],['personal','scopePersonal'],['inspects','scopeInspect'],['notes','scopeNotes'],['projects','scopeProjects']]
    .map(([v,k]) => `<option value="${v}"${s.scope===v?' selected':''}>${T(k)}</option>`).join('');
  const rangeOpts = [['all','rangeAll'],['week','rangeWeek'],['month','rangeMonth'],['custom','rangeCustom']]
    .map(([v,k]) => `<option value="${v}"${s.range===v?' selected':''}>${T(k)}</option>`).join('');
  const customDates = s.range === 'custom'
    ? `<div class="form" style="margin-top:10px">
        <div class="f grow"><label>${T('searchStart')}</label><input type="date" id="sStart" value="${esc(s.start||'')}"></div> <!-- // modified -->
        <div class="f grow"><label>${T('searchEnd')}</label><input type="date" id="sEnd" value="${esc(s.end||'')}"></div> <!-- // modified -->
      </div>` : '';
  const form = `<div class="card"><div class="card-h">${I.search}<h2>${T('searchHead')}</h2>
      <span class="hint">${T('searchSub')}</span></div><div class="card-b">
    <form id="searchForm">
      <div class="f" style="margin-bottom:11px"><label>${T('searchPh')}</label>
        <input type="text" id="sQ" placeholder="${T('searchPh')}" maxlength="60" value="${esc(s.q)}"></div>
      <div class="form">
        <div class="f grow"><label>${T('searchScope')}</label><select id="sScope">${scopeOpts}</select></div>
        <div class="f grow"><label>${T('searchRange')}</label><select id="sRange">${rangeOpts}</select></div>
        <button class="btn btn-primary" type="submit">${I.search}${T('searchBtn')}</button>
      </div>
      ${customDates}
    </form>
    ${active ? `<div class="subbar" style="margin-top:12px"><span class="sb-l">${T('searchCount', results.length)}</span>
        <button class="tag-chip" data-act="search-clear">${T('searchClear')}</button></div>`
      : `<div class="hint" style="margin-top:10px">${T('searchHint')}</div>`}
  </div></div>`;
  let body;
  if (!active) {
    body = emptyBox(T('searchHint'), 'search');
  } else if (!results.length) {
    body = emptyBox(T('searchEmpty'), 'search');
  } else {
    const groups = {};
    results.forEach(r => { (groups[r.mod] = groups[r.mod] || []).push(r.x); });
    body = Object.keys(groups).map(mod => {
      const rows = groups[mod].map(x => searchRow(mod, x)).join('');
      return `<div class="card"><div class="card-h">${I[SEARCH_ICON[mod]]}<h2>${T(SEARCH_MOD_LABEL[mod])}</h2>
        <span class="hint">${groups[mod].length}</span></div>
        <div class="card-b tight"><div class="list">${rows}</div></div></div>`;
    }).join('');
  }
  return form + body;
}

/* --- 表单与事件绑定 --- */
function bind() {
  const tf = $('taskForm');
  if (tf) tf.onsubmit = e => {
    e.preventDefault();
    const v = $('tTitle').value.trim();
    if (!v) { toast(T('tNeedContent'), true); return; }
    const pid = $('tPid') ? $('tPid').value : '';
    S.tasks.unshift({ id: uid(), title: v, prio: Number($('tPrio').value), due: $('tDue').value || '', done: false, reported: false, reportedAt: null, cat: ($('tCat') ? $('tCat').value : ''), pid: pid, createdAt: Date.now(), doneAt: null, rolls: 0 });
    if (pid) { const p = projById(pid); if (p) p.updatedAt = Date.now(); }
    // 加到未来的任务，自动跳到「即将到来」，否则留在今天
    const due = $('tDue').value || '';
    ui.taskFilter = (due && due > TODAY()) ? 'upcoming' : 'today';
    save(true); render();
    toast(pid ? T('tAddedTo', projName(pid)) : T('tAdded'));
    setTimeout(() => { const i = $('tTitle'); if (i) i.focus(); }, 40);
  };
/* ---------- 【v13】学习打卡表单 ---------- */
  /* 表单每次渲染后，把当前编辑日期已存的八维回填进 ui.stuDims——
     否则「改完日期再保存」会把上一条记录的评分带过去。 */
  (() => {
    const rec = stuByDate(stuEditing());
    ui.stuDims = {};
    if (rec) STU_DIMS.forEach(k => { ui.stuDims[k] = Number(rec[k]) || 0; });
  })();
  const stf = $('stuForm');
  if (stf) stf.onsubmit = e => {
    e.preventDefault();
    const d = ($('sDate') ? $('sDate').value : '') || TODAY();
    /* 日期上限已在 input上锁max=TODAY()，这里再兜一层：手改DOM / 未来日期一律拒写，
       否则「近30天日历」之外的未来记录会让统计与连续天数失真。 */
    if (d > TODAY()) { toast(T('stuPick'), true); return; }
    const rec = { date: d,
      mins: Math.max(0, Number($('sMin') ? $('sMin').value : 0) || 0),
      score: Math.min(5, Math.max(0, Number($('sScore') ? $('sScore').value : 0) || 0)),
      goal: ($('sGoal') ? $('sGoal').value : '').trim(),
      content: ($('sContent') ? $('sContent').value : '').trim(),
      summary: ($('sSummary') ? $('sSummary').value : '').trim(),
      tomorrow: ($('sTomorrow') ? $('sTomorrow').value : '').trim() };
    STU_DIMS.forEach(k => { rec[k] = Number(ui.stuDims[k]) || 0; });
    saveStudy(rec);
  };
  /* 八维打分按钮：读当前 DOM 上的 .on 状态回填 ui.stuDims（点第n格＝打n分，再点同格＝清零）。
     这里不整表重渲染——否则每点一下都会重跑 render() 抢走焦点、textarea 里已打的字也会丢。 */
  document.querySelectorAll('[data-stu-dimbtn]').forEach(btn => {
    btn.onclick = () => {
      const wrap = btn.closest('.ds');
      if (!wrap) return;
      const k = btn.dataset.stuDimbtn, n = Number(btn.dataset.n);
      const btns = [...wrap.querySelectorAll('[data-stu-dimbtn]')];
      const cur = btns.filter(b => b.classList.contains('on')).length;
      const next = (cur === n) ? 0 : n;
      btns.forEach(b => b.classList.toggle('on', Number(b.dataset.n) <= next));
      ui.stuDims[k] = next;
    };
  });
  /* 切换日期时把八维已选状态同步给 ui（否则改完日期再保存，八维会写成 0） */
  const sdate = $('sDate');
  if (sdate) sdate.onchange = () => {
    const d = sdate.value || TODAY();
    ui.stuEdit = d;
    ui.stuDims = {};
    const rec = stuByDate(d);
    if (rec) STU_DIMS.forEach(k => { ui.stuDims[k] = Number(rec[k]) || 0; });
    render();
  };
/* ---------- 【v14】学习时间块 ---------- */
  /* 状态块点击：只改这一行 DOM，不整页 render()。
     若走 render()，同一行输入框里正在打的字会因重渲染丢失 —— 这是本模块最关键的一条约束。 */
  document.querySelectorAll('[data-blk-st]').forEach(btn => {
    btn.onclick = () => {
      const h = Number(btn.dataset.blkSt);
      const rec = stuRec(); if (!rec) return;
      const cur = blkState(rec, h);
      /* 循环：空→专注→一般→走神→休息→空 */
      const next = STU_STATES[(STU_STATES.indexOf(cur) + 1) % STU_STATES.length];
      blkSetState(h, next);
      /* 局部更新：状态块文案与 class */
      const tipKey = next === 'focus' ? 'stFocusTip' : next === 'normal' ? 'stNormalTip'
                   : next === 'drift' ? 'stDriftTip' : next === 'rest' ? 'stRestTip' : 'stEmpty';
      btn.className = 'blk-st' + (next ? ' s-' + next : '');
      btn.textContent = stuStateText(next);
      btn.title = next ? T(tipKey) : T('stEmpty');
      btn.setAttribute('aria-label', stuHourLabel(h) + ' ' + stuStateText(next));
      /* 有内容输入时才保留该行 */
      const txEl = document.querySelector('[data-blk-tx="' + h + '"]');
      if (txEl) txEl.placeholder = (next || txEl.value) ? '' : T('blkPhTx');
      /* 刷新对账条 + 时间轴速览（这两处依赖全局统计，必须重画） */
      refreshBlkDerived();
    };
  });
  /* 内容输入：失焦或停止输入 600ms 后落库（不逐字写 localStorage，也不重渲染） */
  document.querySelectorAll('[data-blk-tx]').forEach(inp => {
    const h = Number(inp.dataset.blkTx);
    let tm = null;
    inp.oninput = () => {
      clearTimeout(tm);
      tm = setTimeout(() => { blkSetTx(h, inp.value); refreshBlkDerived(); }, 600);
    };
    inp.onchange = () => {
      clearTimeout(tm);
      blkSetTx(h, inp.value);
      refreshBlkDerived();
      /* 空白行且无状态 → 视觉上清掉 placeholder 提示，让「没填」更明确 */
      inp.placeholder = inp.value ? '' : T('blkPhTx');
    };
  });
  const inf = $('insForm');
  if (inf) inf.onsubmit = e => {
    e.preventDefault();
    const v = $('iTarget').value.trim();
    if (!v) { toast(T('insNeedTarget'), true); return; }
    /* 【v20】新增卡片已不再提供「检查进度 / 检查结果 / 复查时间」三项：
       一律以「未检查 + 结果空 + 复查空」落库，后续在下方台账里直接改（台账内的改动会自动流转） */

/* ---------- 【v26】横竖屏切换（手机端） ----------
   需求：主题图标旁一个纯图标按钮，点一下让手机界面在竖屏 / 横屏之间切换，且不抬高品牌行。
   上一版为什么"点了没反应"：它只调 Screen Orientation API ——
     ① iOS Safari 与各家内置 WebView 根本没有 screen.orientation.lock；
     ② Android Chromium 只在「全屏」下才允许方向锁，而本页多是从聊天窗口点链接打开，全屏请求常被拒；
     ③ 就算偶尔锁成功，页面自身也没有任何视觉变化，用户只看到图标转了一下，就判定功能无效。
   本版改为「页面内旋转模拟为主 + 真实方向锁为增强」，任何环境点下去都必然看得见效果：
     · 旋转模拟：给 html 打上 data-orient-rot=1，由 CSS 把 body 转 90° 并交换宽高，
       让横屏版面真实铺满「竖持」手机的屏幕；用户把手机横置后 needRot() 自动判为 false、
       旋转层解除，页面无缝回到原生横屏布局 —— 与真机横屏的结果完全一致。
     · 真实方向锁：能锁就锁（锁上后屏幕真转，needRot() 随即自动为 false），锁不上静默忽略，
       不再弹"未生效"这种已经不影响结果的话 —— 模拟层已经保证了可见效果。
   状态显示：竖放手机图标，目标态为横屏时旋转 90° + 高亮，用朝向本身表达状态；
   方向变化、视口尺寸变化（地址栏伸缩 / 软键盘）都会重算，且只在需要变时才动 DOM。 */
const ORI_KEY = 'pd_workbench_orient';
/* 用户的显式选择落盘，刷新后保持；从未点过则跟随设备 */
let ORI = (function () {
  try { const v = localStorage.getItem(ORI_KEY); return (v === 'land' || v === 'port') ? v : 'auto'; }
  catch (e) { return 'auto'; }
})();
function isHandset() {
  try { return (window.matchMedia && matchMedia('(pointer:coarse)').matches) || window.innerWidth <= 860; }
  catch (e) { return window.innerWidth <= 860; }
}
/* 视口实际朝向：用宽高比判定，不用 screen.orientation.type ——
   实测无头浏览器与部分内嵌 WebView 会恒报 landscape-primary，拿它当依据会误判；
   留 40px 死区吸收地址栏收缩与软键盘弹出带来的高度抖动 */

function targetOrient() { return ORI === 'auto' ? (vpIsLand() ? 'land' : 'port') : ORI; }
/* 目标朝向与视口实际朝向不一致 → 需要旋转模拟（桌面端一律不旋转，该按钮对桌面无意义） */
function needRot() { return isHandset() && ((targetOrient() === 'land') !== vpIsLand()); }
function applyOrient() {
  /* 桌面端该按钮本就无效（点了只提示不支持），状态一律按竖屏显示，免得图标误示"已横屏" */
  const eff = isHandset() ? targetOrient() : 'port';
  document.documentElement.setAttribute('data-orient', eff);
  document.documentElement.setAttribute('data-orient-rot', needRot() ? '1' : '0');
  const b = $('rotBtn');
  if (b) { const t = eff === 'land' ? T('rotToPort') : T('rotToLand'); b.title = t; b.setAttribute('aria-label', t); }
}
/* 真实方向锁：纯增强，失败一律静默（旋转模拟已经生效，不必再向用户报错） */
function tryLockOrient(want) {

    if (so && typeof so.lock === 'function') { const p = so.lock(w); if (p && p.catch) p.catch(function () {}); return; }
    const legacy = (typeof screen !== 'undefined') && (screen.lockOrientation || screen.mozLockOrientation || screen.msLockOrientation);
    if (legacy) legacy.call(screen, w);

}
function toggleOrient() {
  if (!isHandset()) { toast(T('rotUnsupported'), true); return; }
  const next = targetOrient() === 'land' ? 'port' : 'land';
  ORI = next;
  try { localStorage.setItem(ORI_KEY, next); } catch (e) {}
  /* 先落视图，再顺手试真锁：顺序反过来的话，锁成功会先触发一次方向变化重算，白白多刷一次 */
  applyOrient();
  tryLockOrient(next);
  toast(next === 'land' ? T('rotLandDone') : T('rotPortDone'));
}

  $('rotBtn').innerHTML = I.phone;
  $('rotBtn').addEventListener('click', toggleOrient);

/* 手动转机、方向锁生效、地址栏伸缩都会改变视口尺寸，统一回 applyOrient 重算；
   防抖 120ms，避免抖动过程中反复改 DOM */
let oriTimer = 0;
function onOrientMaybe() { clearTimeout(oriTimer); oriTimer = setTimeout(applyOrient, 120); }
window.addEventListener('orientationchange', onOrientMaybe);
window.addEventListener('resize', onOrientMaybe);
try { if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', onOrientMaybe); } catch (e) {}
applyOrient();

/* ---------- 【v29】旋转视图的触摸滚动：不再依赖浏览器原生手势 ----------
   真机（安卓）实测：v27 的「滚动容器下放 .app」结构正确、scrollTop 可读可写，
   但手指划动仍然没反应 —— 问题出在轴向：
     body 被转了 90°，页面的纵向（Y 轴）落在屏幕的横向（X 轴）上；
     浏览器原生手势管道按「屏幕轴向」匹配滚动方向，用户在屏幕上上下划，
     对应的是页面 X 轴（overflow-x:hidden），于是什么都滚不动；
     真要滚得在屏幕上「左右划」，与直觉完全相反。
   修法：rot 模式下彻底绕开原生手势，touchmove 手动驱动滚动 ——
     ① 屏幕位移 → 页面位移换算：页面 X 轴 = 屏幕 Y 轴、页面 Y 轴 = 屏幕 X 轴（方向相反），
        所以屏幕横划（dsx）直接推进 scrollTop；屏幕竖划（dsy）为主的手势按 −dsy 推进，
        「竖持时上下划」与「侧头读横屏时朝版面上下划」两种习惯都能滚；
     ② 松手带惯性（按最后速度衰减），接近原生手感；碰壁即停；
     ③ 滚动目标从触点向上找最近的可滚元素（页面 .app / 弹层 .modal / 边栏 / 下拉面板），
        下拉面板或日历开着时优先滚面板自身，不带动底下的页面；
     ④ 仅在 data-orient-rot="1" 时介入；正常竖屏 / 原生横屏一律不拦，原生行为分毫不动。
   说明：tap（无位移的触摸）不会进 touchmove，preventDefault 只发生在确有位移时，
   点击、按钮、select 面板弹出等行为不受影响。 */
(function () {
  var st = null;    /* 当前手势：{ el, x, y, lt, vx } */
  var momo = 0;     /* 惯性动画句柄 */
  function rotOn() { return document.documentElement.getAttribute('data-orient-rot') === '1'; }
  /* 开着的浮层优先：有面板在手上就滚面板，别穿透到底下的页面 */
  function topPanel() {
    try {
      if (typeof SDP !== 'undefined' && SDP && SDP.el) return SDP.el;
      if (typeof CAL !== 'undefined' && CAL && CAL.el) return CAL.el;
    } catch (e) {}
    return null;
  }
  /* 从触点向上找最近的可滚元素；都没有就兜底 .app */
  function findScroller(t) {
    for (var n = t; n && n !== document.body; n = n.parentElement) {
      var ov = '';
      try { ov = getComputedStyle(n).overflowY; } catch (e) { continue; }
      if ((ov === 'auto' || ov === 'scroll') && n.scrollHeight > n.clientHeight + 1) return n;
    }
    return document.querySelector('.app');
  }
  function stopMomo() { if (momo) { cancelAnimationFrame(momo); momo = 0; } }
  document.addEventListener('touchstart', function (e) {
    stopMomo();
    if (!rotOn() || e.touches.length !== 1) { st = null; return; }
    var t = e.touches[0];
    st = { el: topPanel() || findScroller(e.target), x: t.clientX, y: t.clientY, lt: Date.now(), vx: 0 };
  }, { capture: false, passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!st || !rotOn() || !st.el) return;
    var t = e.touches[0];
    var dx = t.clientX - st.x, dy = t.clientY - st.y;
    if (!dx && !dy) return;
    /* 拦掉原生默认动作（错误轴向的滚动 / 下拉刷新 / 地址栏），滚动全部自己来 */
    if (e.cancelable) e.preventDefault();
    /* 轴向换算（见模块头注释）：横划为主用 dx，竖划为主用 −dy */
    var d = (Math.abs(dx) >= Math.abs(dy)) ? dx : -dy;
    var before = st.el.scrollTop;
    st.el.scrollTop += d;
    var moved = st.el.scrollTop - before;
    var now = Date.now(), dt = Math.max(1, now - st.lt);
    st.vx = 0.75 * st.vx + 0.25 * (moved / dt);   /* 实际滚动速度（px/ms），碰壁时自然归零 */
    st.x = t.clientX; st.y = t.clientY; st.lt = now;

    if (!st) return;
    var el = st.el, v = st.vx;
    st = null;
    if (!el || !v || Math.abs(v) < 0.2) return;   /* 速度太小不甩 */
    var last = 0;

      var dt = Math.min(48, now - last); last = now;
      v *= Math.pow(0.92, dt / 16.7);             /* 指数衰减，接近原生滑停手感 */
      var before = el.scrollTop;
      el.scrollTop += v * dt;
      if (Math.abs(v) < 0.02 || el.scrollTop === before) { momo = 0; return; }
      momo = requestAnimationFrame(step);
    }

    momo = requestAnimationFrame(step);
  }

  document.addEventListener('touchcancel', function () { st = null; stopMomo(); }, { passive: true });
})();

/* ---------- 【v27】主题化下拉面板：接管手机端 <select> 的原生弹层 ----------
   为什么必须自己画：手机端点开 select 弹出的选项列表是系统绘制的（iOS 底部滚轮 / Android 系统列表），
   完全不读页面 CSS，v26 那套 `select option{background-color}` 只在桌面浏览器生效，
   所以深色主题下弹出的仍是一块白底。原生弹层改不动，就自己画一个替身：

     ③ 选中后照原路写回 sel.value 并派发 change，页面里所有 onchange（筛选 / 排序 / 表单取值）
        一律照常生效，各处逻辑不感知面板的存在；
     ④ 任何滚动、尺寸变化都会关掉面板。

   横屏视图下 body 被旋转了 90°，getBoundingClientRect 给的是「屏幕坐标」，
   和面板所在的坐标系不是同一个空间，直接用会错位。 */
var SDP = { el: null, mask: null, sel: null };
var sdpLast = { el: null, t: 0 };   /* 判重用：记住「最近一次处理的是哪个控件、什么时候」 */
const SDP_CK = "<svg class='ck' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6L9 17l-5-5'/></svg>";

     ① 弹层里的控件，其 offsetParent 可能直接跳到某个「参与了合成/包含块」的祖先
        （本页 .modal 因为入场动画带了 transform，就被当成 select 的 offsetParent），

      blocker: g(row, '卡点') || '', status: (s === '已完成') ? 'done' : 'active'
    };
  },
  itemToProps: function (p) {
    return {
      '项目名称': { text: p.name || '' }, '当前阶段': { text: p.stage || '' }, '下一步': { text: p.next || '' },
      '卡点': { text: p.blocker || '' }, '状态': { select: p.status === 'done' ? '已完成' : '进行中' }
    };
  },
  adopt: function (ex, rx) { ex.name = rx.name; ex.stage = rx.stage; ex.next = rx.next; ex.blocker = rx.blocker; ex.status = rx.status; },
  snap: function (p) { return [p.id, p.name, p.stage, p.next, p.blocker, p.status, p.remoteId || '', p.updatedAt || 0]; }
});

/* ---- 灵感速记表（置顶 pin 为本地字段） ---- */
CloudSync && CloudSync.table({
  dbId: 'DiGbyhgCItN5hToHGdCHTc', tombKey: 'tombNote',
  arr: function () { return S.notes; }, setArr: function (a) { S.notes = a; },
  valid: function (x) { return !!x.text; },
  legacyKey: function (x) { return (x.text || '').replace(/\s+/g, ''); },
  rowToItem: function (row, g) {
    var d = g(row, '日期') ? String(g(row, '日期')).slice(0, 10) : '';
    var tags = g(row, '标签') ? String(g(row, '标签')).split(/[,，]/).map(function (t) { return t.trim(); }).filter(Boolean) : [];
    return { text: g(row, '内容') || '', tags: tags, createdAt: d ? Date.parse(d) || Date.now() : Date.now(), pin: false };
  },
  itemToProps: function (n) {
    return {
      '日期': { date: n.createdAt ? new Date(n.createdAt).toISOString().slice(0, 10) : new Date().toISOString().slice(0, 10) },
      '内容': { text: n.text || '' }, '标签': { text: (n.tags || []).join(',') }, '备注': { text: '' }
    };
  },
  adopt: function (ex, rx) { ex.text = rx.text; ex.tags = rx.tags; },
  snap: function (n) { return [n.id, n.text, (n.tags || []).join(','), !!n.pin, n.remoteId || '', n.updatedAt || 0]; }
});

/* ---- 检查任务表（序号 seq 由本地重排，不参与 LWW） ---- */
CloudSync && (function () {
  var CATTXT = ['监督检查', '飞行检查', '专项检查', '许可核查', '投诉举报核查', '案件查办', '材料报送', '会议培训', '其他'];
  var PROGTXT = { todo: '未检查', done: '已检查', wait: '待复查', rechecked: '已复查' };
  var RESTXT = { '': '未填', ok: '合格', rect: '限期整改', 'case': '立案查处' };
  function toKey(map, txt, def) { for (var k in map) { if (map[k] === txt) return k; } return def; }
  CloudSync.table({
    dbId: 'tj9MTHtPBar6WMGKqsCbrJ', tombKey: 'tombIns',
    arr: function () { return S.inspects; }, setArr: function (a) { S.inspects = a; },
    valid: function (x) { return !!x.target; },
    legacyKey: function (x) { return (x.target || '').replace(/\s+/g, ''); },
    rowToItem: function (row, g) {
      var ci = CATTXT.indexOf(g(row, '任务分类'));
      return {
        seq: 0, target: g(row, '检查对象') || '', cat: ci >= 0 ? ('cat' + (ci + 1)) : 'cat1',
        date: g(row, '检查时间') ? String(g(row, '检查时间')).slice(0, 10) : '',
        recheck: g(row, '复查时间') ? String(g(row, '复查时间')).slice(0, 10) : '',
        prog: toKey(PROGTXT, g(row, '检查进度'), 'todo'), result: toKey(RESTXT, g(row, '检查结果'), ''),
        people: g(row, '检查人员') || '', notes: g(row, '发现问题与整改要求') || '',
        createdAt: Date.now(), recheckedAt: null
      };
    },
    itemToProps: function (x) {
      var p = {};
      p['序号'] = { number: Number(x.seq) || 0 };
      p['检查对象'] = { text: x.target || '' };
      var ci = typeof CATKEYS !== 'undefined' ? CATKEYS.indexOf(x.cat) : -1;
      p['任务分类'] = { select: CATTXT[ci >= 0 ? ci : 0] };
      if (x.date) p['检查时间'] = { date: x.date };
      if (x.recheck) p['复查时间'] = { date: x.recheck };
      p['检查进度'] = { select: PROGTXT[x.prog] || '未检查' };
      p['检查结果'] = { select: RESTXT[x.result] || '未填' };
      p['检查人员'] = { text: x.people || '' };
      p['发现问题与整改要求'] = { text: x.notes || '' };
      return p;
    },
    adopt: function (ex, rx) {
      ex.target = rx.target; ex.cat = rx.cat; ex.date = rx.date; ex.recheck = rx.recheck;
      if (rx.prog !== ex.prog) { ex.prog = rx.prog; if (rx.prog === 'rechecked') ex.recheckedAt = Date.now(); }
      ex.result = rx.result; ex.people = rx.people; ex.notes = rx.notes;
    },
    afterMerge: function () { reseqIns(); },
    snap: function (x) { return [x.id, x.target, x.cat, x.date, x.recheck, x.prog, x.result, x.people, x.notes, x.remoteId || '', x.updatedAt || 0]; }
  });
})();

/* ---- 个人事项表（9 列契约：标题/优先级/截止日期/是否完成/分类/备注 + 本地ID/更新时间/已删除）
   【v12 改绑】本工作台下新建的「个人事项」表 wJKetf6NORpSEY4Q8fgHj6（同步 dbId 与 diagTables 一并切换）
   【v10 记录】曾改绑 nA1OgIdXUMIegbkzeTPKYh；【v9 记录】曾绑定空表 Y1ayYlJIeGCQVJMrTv9GRr ---- */
CloudSync && CloudSync.table({
  dbId: 'wJKetf6NORpSEY4Q8fgHj6', tombKey: 'tombPers',
  arr: function () { return S.personal; }, setArr: function (a) { S.personal = a; },
  valid: function (x) { return !!x.title; },
  legacyKey: function (x) { return (x.title || '').replace(/\s+/g, ''); },
  rowToItem: function (row, g) {
    return {
      title: g(row, '标题') || '', prio: Number(g(row, '优先级')) || 1,
      due: g(row, '截止日期') ? String(g(row, '截止日期')).slice(0, 10) : '',
      done: g(row, '是否完成') === true, cat: g(row, '分类') || '', note: g(row, '备注') || '',
      createdAt: Date.now(), doneAt: null, rolls: 0
    };
  },
  itemToProps: function (k) {
    var p = {};
    p['标题'] = { text: k.title || '' };
    p['优先级'] = { number: Number(k.prio) || 0 };
    if (k.due) p['截止日期'] = { date: k.due };
    p['是否完成'] = { checkbox: !!k.done };
    p['分类'] = { text: k.cat || '' };
    p['备注'] = { text: k.note || '' };
    return p;
  },
  adopt: function (ex, rx) {
    ex.title = rx.title; ex.prio = rx.prio; ex.due = rx.due; ex.cat = rx.cat; ex.note = rx.note;
    if (rx.done !== ex.done) { ex.done = rx.done; ex.doneAt = rx.done ? Date.now() : null; }
  },
  snap: function (k) { return [k.id, k.title, k.prio, k.due, !!k.done, k.cat, k.note || '', k.remoteId || '', k.updatedAt || 0]; }
});

/* ---- 学习打卡表（表 3aPlV6oXSpIGg0iQPJr4OQ，字段源自《学习计划表》）
   业务键＝日期：一天一条，legacy 老行也能按日期被认领迁移，不会每轮当新行重复插入。 ---- */
CloudSync && CloudSync.table({
  dbId: '3aPlV6oXSpIGg0iQPJr4OQ', tombKey: 'tombStudy',
  arr: function () { return S.study; }, setArr: function (a) { S.study = a; },
  valid: function (x) { return !!x.date; },
  legacyKey: function (x) { return x.date || ''; },
  rowToItem: function (row, g) {
    var d = g(row, '日期');
    var o = {
      date: d ? String(d).slice(0, 10) : '',
      mins: Number(g(row, '学习时长')) || 0,
      score: Number(g(row, '评分')) || 0,
      content: g(row, '学习内容') || '', goal: g(row, '学习目标') || '',
      summary: g(row, '每日小结') || '', tomorrow: g(row, '明日计划') || '',
      createdAt: Date.now()
    };
    STU_DIMS.forEach(function (k) { o[k] = Math.min(5, Math.max(0, Number(g(row, STU_DIM_CN[k])) || 0)); });
    /* 时间块存成一个文本列（紧凑 JSON 数组），读回逐项校验；非法项在这里就丢掉 */
    o.blocks = blkParse(g(row, '时间块'));
    o.pomos = Math.max(0, Number(g(row, '番茄数')) || 0);
    return o;
  },
  itemToProps: function (x) {
    var p = {};
    p['日期'] = { date: x.date };
    p['学习时长'] = { number: x.mins || 0 };
    p['评分'] = { number: x.score || 0 };
    p['学习内容'] = { text: x.content || '' };
    p['学习目标'] = { text: x.goal || '' };
    p['每日小结'] = { text: x.summary || '' };
    p['明日计划'] = { text: x.tomorrow || '' };
    STU_DIMS.forEach(function (k) { p[STU_DIM_CN[k]] = { number: x[k] || 0 }; });
    p['时间块'] = { text: blkStringify(x.blocks) };
    p['番茄数'] = { number: x.pomos || 0 };
    return p;
  },
  adopt: function (ex, rx) {
    ex.mins = rx.mins; ex.score = rx.score;
    ex.content = rx.content; ex.goal = rx.goal;
    ex.summary = rx.summary; ex.tomorrow = rx.tomorrow;
    STU_DIMS.forEach(function (k) { ex[k] = rx[k]; });
    /* 时间块 / 番茄数：云端有值才覆盖，避免 legacy 行把本地已记内容冲成空 */
    if (rx.blocks && rx.blocks.length) ex.blocks = rx.blocks;
    if (rx.pomos) ex.pomos = rx.pomos;
  },
  snap: function (x) {
    return [x.id, x.date, x.mins, x.score, x.content, x.goal, x.summary, x.tomorrow,
      STU_DIMS.map(function (k) { return x[k] || 0; }).join(','),
      blkStringify(x.blocks), x.pomos || 0, x.remoteId || '', x.updatedAt || 0];
  }
});

/* ---- 日程表（并入同一条流水线；系列日程的 系列ID/天序/总天数 与 关联检查 一并同步） ---- */
CloudSync && CloudSync.table({
  dbId: 'mw2fVRr2NrQy5r7Vj3CBSc', tombKey: 'tombSched',
  adoptOnEqual: true,   /* 日程沿用旧语义：云端持平也采用（同秒多端写入时以云端为准，避免残留旧值） */
  arr: function () { return S.schedules; }, setArr: function (a) { S.schedules = a; },
  valid: function (x) { return !!x.title; },
  legacyKey: function (x) { return (x.title || '') + '|' + (x.date || ''); },
  rowToItem: function (row, g) {
    return {
      title: g(row, '标题') || '', date: String(g(row, '日期') || '').slice(0, 10),
      time: g(row, '开始时间') || '', end: g(row, '结束时间') || '', cat: g(row, '类型') || 'scat1',
      note: g(row, '备注') || '', allday: g(row, '全天') === true, createdAt: Date.now(),
      insId: g(row, '关联检查') || '',
      sid: g(row, '系列ID') || '', si: Number(g(row, '天序')) || 0, st: Number(g(row, '总天数')) || 0
    };
  },
  itemToProps: function (s) {
    var p = {};
    p['标题'] = { text: s.title || '' };
    if (s.date) p['日期'] = { date: s.date };
    p['开始时间'] = { text: s.time || '' };
    p['结束时间'] = { text: s.end || '' };
    p['类型'] = { text: s.cat || 'scat1' };
    p['备注'] = { text: s.note || '' };
    p['全天'] = { checkbox: !!s.allday };
    p['关联检查'] = { text: s.insId || '' };
    if (s.sid) p['系列ID'] = { text: s.sid };
    if (s.st > 1) { p['天序'] = { number: s.si || 1 }; p['总天数'] = { number: s.st }; }
    return p;
  },
  adopt: function (ex, rx) {
    ex.title = rx.title; ex.date = rx.date; ex.time = rx.time; ex.end = rx.end;
    ex.cat = rx.cat; ex.note = rx.note; ex.allday = rx.allday; ex.insId = rx.insId;
    ex.sid = rx.sid; ex.si = rx.si; ex.st = rx.st;
  },
  snap: function (s) {
    return [s.id, s.title, s.date, s.time, s.end, s.cat, s.note, !!s.allday,
      s.insId || '', s.sid || '', s.si || 0, s.st || 0, s.remoteId || '', s.updatedAt || 0];
  }
});

/* ---- 启动：逐表串行拉取（错开 140ms，不打满页面 QPS），随后进入订阅 + 轮询 ---- */
if (CloudSync) {
  try { CloudSync.start(); } catch (e) { try { console.warn('[sync] start', e); } catch (_) {} }
}

/* ---- 全局 Esc 关闭最上层弹层 ---- */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const masks = document.querySelectorAll('.mask');
  if (masks.length) { masks[masks.length - 1].remove(); e.stopPropagation(); }
});
/* 【v17】番茄钟：启动恢复 + 每秒心跳（纯文本更新，无网络开销，页面隐藏也照常计时） */
pomoRestore();
setInterval(pomoTick, 1000);
pomoTick();

</script>
