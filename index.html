const ds = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };

/* ================= 【v17】番茄钟 =================
   定位：时间块是「事后回忆着记」，番茄钟是「事中自动打点」——结束时自动把整点标为专注，
   记录负担趋近于零。与已有的「专注」状态天然对齐，不新增页面（仍住在时间块卡里）。

   三条硬约束（都来自这个项目踩过的坑）：
   1) 计时**绝不调 render()**：整页重渲染会让同页输入框失焦丢字。tick 只改文本节点与进度条宽度。
   2) 走**墙钟**而不是累加计数：endAt - Date.now()，这样切页、切标签、甚至刷新都不丢时间。
   3) 页面关着时到期的不自动补记：可能你人根本没在学，写进去就是脏数据 —— 只提示、不落库。

   计时状态存 S.meta.pomo（localStorage），跨刷新恢复；不占云端列。 */

const POMO_DEF = { work: 25, brk: 5 };
function pomoCfg() {
  const c = (S.meta && S.meta.pomoCfg) || {};
  const w = Number.isInteger(c.work) && c.work >= 1 && c.work <= 180 ? c.work : POMO_DEF.work;
  const b = Number.isInteger(c.brk) && c.brk >= 1 && c.brk <= 60 ? c.brk : POMO_DEF.brk;
  return { work: w, brk: b };
}
/* 计时状态：{ mode:'focus'|'break', total:秒, endAt:时间戳, left:秒(暂停时用), running:布尔, startHour:整点 } */
function pomoState() {
  const p = S.meta && S.meta.pomo;
  if (!p || typeof p !== 'object') return null;
  if (p.mode !== 'focus' && p.mode !== 'break') return null;
  return p;
}
function pomoSet(p) { S.meta.pomo = p; save(true); }
/* 当前剩余秒数（墙钟推算，不做逐秒累加） */
function pomoRemain() {
  const p = pomoState();
  if (!p) return 0;
  if (p.running) return Math.max(0, Math.round((p.endAt - Date.now()) / 1000));
  return Math.max(0, Number(p.left) || 0);
}
const pomoIsRunning = () => { const p = pomoState(); return !!(p && p.running); };
/* UI 上要显示多少秒：空闲时显示「将要开始的那一段」的时长（默认 25:00），
   而不是 0 —— 否则待开始状态显示 00:00，看上去像已经跑完或坏掉了。 */
function pomoDisplay() {
  const p = pomoState();

}
/* 标签页标题的唯一来源：运行中带倒计时，空闲时只显示应用名。
   renderNav 与 pomoTick 都调它 —— 否则 renderNav 会把倒计时覆盖掉。 */
function pomoDocTitle() {
  const p = pomoState();
  if (p && (p.running || pomoRemain() > 0)) {
    return pomoMMSS(pomoRemain()) + ' · ' + T(p.mode === 'focus' ? 'pomoWork' : 'pomoBreak') + ' · ' + T('appName');
  }

}
const pomoMMSS = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
/* 今天的番茄个数 */
function pomoToday() { const r = stuByDate(TODAY()); return (r && Number(r.pomos)) || 0; }

function pomoStart() {
  const cfg = pomoCfg(), p = pomoState();
  /* 已有暂停中的会话 → 继续；否则开一段新的专注 */
  if (p && !p.running && p.left > 0) {
    p.running = true;
    p.endAt = Date.now() + p.left * 1000;
    p.left = 0;
    pomoSet(p);
  } else if (p && p.running) {
    return;                                  /* 已在跑，忽略重复点击 */
  } else {
    const total = cfg.work * 60;
    pomoSet({ mode: 'focus', total: total, endAt: Date.now() + total * 1000, left: 0,
              running: true, startHour: new Date().getHours() });

}
function pomoPause() {

  p.left = pomoRemain();
  p.running = false;
  p.endAt = 0;
  pomoSet(p);
  pomoTick();

}
function pomoReset() {
  S.meta.pomo = null;
  save(true);
  pomoTick();
  toast(T('pomoResetDone'));
}
/* 进入下一段（专注结束 → 休息；休息结束 → 待开始） */
function pomoAdvance(fromFinish) {
  const cfg = pomoCfg(), p = pomoState();
  if (!p) return;
  if (p.mode === 'focus') {
    const total = cfg.brk * 60;
    pomoSet({ mode: 'break', total: total, endAt: Date.now() + total * 1000, left: 0,
              running: true, startHour: 0 });
    if (fromFinish) toast(T('pomoFocusDone'));
  } else {
    S.meta.pomo = null;
    save(true);
    if (fromFinish) toast(T('pomoBreakDone'));

}
/* 专注结束时把「开始时的整点」标为专注，并累加当日番茄数。
   选开始时刻的整点而不是结束时刻：用户按下开始的那一刻意图明确，
   25 分钟通常落在同一个整点内；跨整点时以开始时刻记账更好解释、也好纠正。 */
function pomoLogFocus(p) {
  const h = Number.isInteger(p.startHour) ? p.startHour : new Date().getHours();
  const rec = stuRec();                       /* 没有当天记录时按需建空壳 */
  blkSetState(h, 'focus');
  rec.pomos = (Number(rec.pomos) || 0) + 1;
  rec.updatedAt = Date.now();

  return h;
}
/* 一秒一跳：只改文本、进度条、标题 —— 不碰 DOM 结构，不调 render() */
let pomoLastSig = '';
function pomoTick() {
  const p = pomoState();
  const remain = pomoDisplay();
  const running = pomoIsRunning();
  document.title = pomoDocTitle();   /* 切到别的标签也能看到倒计时 */
  const tEl = document.getElementById('pomoTime');
  if (!tEl) return;
  const bar = document.querySelector('[data-pomo-bar]');
  const total = p ? (p.total || 1) : 1;
  const pct = p ? Math.max(0, Math.min(100, ((total - remain) / total) * 100)) : 0;
  tEl.textContent = pomoMMSS(remain);
  if (bar) bar.style.width = pct + '%';
  /* 结构类变化（模式切换 / 按钮文案 / 计数）才整体刷新这一块；每帧刷新会造成无谓的 DOM 抖动 */
  const sig = (p ? p.mode + '|' + running + '|' + (remain === 0) : 'idle') + '|' + pomoToday();
  if (sig !== pomoLastSig) {
    pomoLastSig = sig;
    const box = document.getElementById('pomoBox');
    if (box) box.innerHTML = pomoInnerHtml();
  }
  /* 到期处理 */
  if (p && running && remain <= 0) {
    if (p.mode === 'focus') {
      const h = pomoLogFocus(p);
      toast(T('pomoDone', h));
      pomoBeep();
    }
    pomoAdvance(true);
    refreshBlkDerived();
    pomoTick();
  }

/* 完成时轻响一声；浏览器可能因无用户手势而拒绝，静默忽略 */
function pomoBeep() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = new AC();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.value = 0.06;
    o.connect(g); g.connect(ac.destination);
    o.start();
    setTimeout(() => { try { o.stop(); ac.close(); } catch (e) {} }, 260);
  } catch (e) {}
}
/* 启动时恢复上次的计时；页面关着时已到期的**不自动补记**（人可能根本没在学，
   补记就是脏数据），只提示并把计时清掉。 */
function pomoRestore() {
  const p = pomoState();
  if (!p) return;
  if (p.running && p.endAt && p.endAt <= Date.now()) {
    S.meta.pomo = null;
    save(true);
    setTimeout(() => toast(T('pomoExpired')), 800);
    return;
  }
  if (p.running && p.endAt) p.left = pomoRemain();
}

/* ---- 番茄钟 UI（住在时间块卡内，不新增卡片） ---- */

/* ---------- 【v14】学习时间块：四态定义与小时轴 ---------- */
/* 状态循环顺序：空→专注→一般→走神→休息→空。点一下走一格，是防弃坑的核心（不打字也能记） */
const STU_STATES = ['', 'focus', 'normal', 'drift', 'rest'];
const STU_ST_KEY = { focus:'stFocus', normal:'stNormal', drift:'stDrift', rest:'stRest' };
/* 可配置的学习时段。默认 07:00–23:00（覆盖到当天 24 点），跳过午饭午休 13、14 点。
   早先写死 am:[7,11] 导致 12:00 这一格被漏掉（纸质计划表是 7–12 + 15–24），
   现改为「起止 + 跳过」两个自由度，并开放给用户在同页调整。 */
const STU_CFG_DEF = { h0: 7, h1: 23, skip: [13, 14] };
function stuCfg() {
  const c = (S && S.meta && S.meta.stuCfg) || {};
  let h0 = Number.isInteger(c.h0) ? c.h0 : STU_CFG_DEF.h0;
  let h1 = Number.isInteger(c.h1) ? c.h1 : STU_CFG_DEF.h1;
  h0 = Math.min(23, Math.max(0, h0));
  h1 = Math.min(23, Math.max(0, h1));
  if (h0 > h1) { const t = h0; h0 = h1; h1 = t; }          /* 反选自动纠正，不让用户卡死 */
  const skip = (Array.isArray(c.skip) ? c.skip : STU_CFG_DEF.skip)
    .filter(x => Number.isInteger(x) && x >= 0 && x <= 23);
  return { h0, h1, skip };
}
/* 当天时间轴 = 配置时段（去跳过项）∪ 近 7 天已有数据的小时。
   取并集是为了「改小时段不丢已有记录」——否则用户把起点从 7 调到 9，
   原来 7、8 点的记录就从界面上消失了（数据还在，但他看不见、也改不了）。 */
function stuHours() {
  const { h0, h1, skip } = stuCfg();
  const set = new Set();
  for (let h = h0; h <= h1; h++) if (skip.indexOf(h) < 0) set.add(h);
  const today = TODAY();
  for (let i = 0; i < 7; i++) {
    const r = stuByDate(shift(today, -i));
    if (r && Array.isArray(r.blocks)) r.blocks.forEach(b => set.add(b.hour));
  }
  return [...set].sort((a, b) => a - b);
}
const stuHourLabel = h => (h < 10 ? '0' : '') + h + ':00';
/* 时间块 ↔ 云端文本列：紧凑 JSON 数组，如 [[7,"focus","背条文"],[8,"focus",""]] */
function blkStringify(blocks) {
  if (!Array.isArray(blocks) || !blocks.length) return '';
  return JSON.stringify(blocks.map(b => [b.hour, b.state, (b.tx || '')]));
}
function blkParse(raw) {
  if (!raw) return [];
  var txt = String(raw).trim();
  if (!txt || txt[0] !== '[') return [];
  try {
    var arr = JSON.parse(txt);
    if (!Array.isArray(arr)) return [];
    return arr.filter(a2 => Array.isArray(a2) && Number.isInteger(a2[0]) && a2[0] >= 0 && a2[0] <= 23
      && STU_STATES.includes(a2[1]))
      .map(a2 => ({ hour: a2[0], state: a2[1], tx: typeof a2[2] === 'string' ? a2[2] : '' }));
  } catch (e) { return []; }
}
/* 状态键 → 本地化文案（带title 提示，比图标更明确） */
const stuStateText = k => (k ? T(STU_ST_KEY[k]) : T('stEmpty'));
const TODAY = () => ds(new Date());
const shift = (base, n) => { const d = new Date(base + 'T00:00:00'); d.setDate(d.getDate() + n); return ds(d); };
const dayDiff = (a, b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 864e5);
const WD = I18N[LANG].wd;
const human = s => {
  if (!s) return T('dNoDeadline');
  const t = TODAY(), n = dayDiff(t, s);
  if (n === 0) return T('dToday');
  if (n === 1) return T('dTomorrow');
  if (n === -1) return T('dYesterday');
  if (n < 0) return T('dOverdueN', -n);
  if (n <= 6) return T('dInDays', WD[new Date(s+'T00:00:00').getDay()], n);
  return s.slice(5).replace('-', '/');
};
const clock = ts => {
  const d = new Date(ts), t = TODAY(), n = dayDiff(ds(d), t);
  const hm = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  if (n === 0) return T('tToday', hm);
  if (n === 1) return T('tYesterday', hm);
  return `${d.getMonth()+1}/${d.getDate()} ${hm}`;
};

const weekStart = (base, offset = 0) => {
  const d = new Date(base + 'T00:00:00');
  const k = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - k + offset * 7);
  return ds(d);

/* ---------- 个人事项：分类标签（内置键 + 用户自定义名称，一条事项可挂多个标签） ---------- */
const PCATKEYS = ['pcat1','pcat2','pcat3','pcat4','pcat5','pcat6','pcat7','pcat8','pcat9'];
/* 【v13】标签展示顺序：生活 工作 学习 子女 健康 财务 维修 收纳 其他。
   内置键的取值保持不变（pcat3 仍是健康、pcat4 仍是财务、pcat5 仍是其他），只调整呈现次序，
   避免改动取值把云端/本地已有数据的分类串掉。 */
const PCATORDER = ['pcat1','pcat2','pcat6','pcat7','pcat3','pcat4','pcat8','pcat9','pcat5'];
/* 【v13】多标签分隔符：云端「分类」仍是文本字段，多标签以「、」拼接后原样存取，单标签老数据天然兼容 */
const PCATSEP = '、';
/* 自定义类别直接以名称字符串为值（云端按文本同步，各端显示一致）；内置键走 i18n */
const pcatName = c => {
  if (!c) return T('pcNone');
  if (PCATKEYS.indexOf(c) >= 0) return T(c);
  return String(c); /* 自定义类别：原样显示名称 */
};
/* 【v13 新增】存储值 → 标签数组（兼容单标签老数据与云端回填的多标签串） */
function pcatSplit(v) {
  return String(v == null ? '' : v).split(/[、,，;；|]+/).map(s => s.trim()).filter(Boolean);
}
/* 【v13 新增】标签数组 → 存储值（去重去空） */
function pcatJoin(arr) {
  return [...new Set((arr || []).filter(Boolean))].join(PCATSEP);
}
/* 【v13 新增】存储值 → 显示名数组 */
function pcatNames(v) { return pcatSplit(v).map(pcatName); }
/* 【v13 新增】存储值 → 单行显示文本（搜索结果摘要用） */
function pcatText(v) { return pcatNames(v).join(PCATSEP); }
/* 【v13 新增】标签池：内置（按 PCATORDER 排）+ 自定义；自定义与内置同名时以内置为准 */
function pcatPool() {
  const out = [], seen = new Set();
  PCATORDER.forEach(k => { const n = T(k); if (!seen.has(n)) { seen.add(n); out.push({ v: k, n: n }); } });
  (S.pcats || []).forEach(nm => { const n = String(nm); if (!seen.has(n)) { seen.add(n); out.push({ v: n, n: n }); } });
  return out;
}
/* 【v13 修改】多选标签选择器（chips）：替代原单选下拉，可同时勾选多个标签 + 新增标签。
   勾选按"显示名"判定：老数据里以名称形式存下的自定义标签（如「学习」）能与同名内置标签对上。 */
function pcatPicker(id, selected) {
  const sel = pcatSplit(selected), selNames = sel.map(pcatName);
  const pool = pcatPool();
  /* 其他设备同步来的陌生标签名：临时带出，防止回显丢失 */
  sel.forEach((v, i) => { if (!pool.some(p => p.v === v || p.n === selNames[i])) pool.push({ v: v, n: selNames[i] }); });
  return `<div class="pcat-box" id="${id}" data-pcat-picker="1">${pool.map(p =>
    `<button type="button" class="tag-chip pcat-chip${selNames.indexOf(p.n) >= 0 ? ' on' : ''}" data-cat="${esc(p.v)}" data-catn="${esc(p.n)}">${esc(p.n)}</button>`).join('')}<button type="button" class="tag-chip pcat-new" data-pcat-new="1">${T('pcatNewOpt')}</button></div>`;
}
/* 【v13 新增】读取多选标签选择器当前勾选 → 存储值（接受 id 或元素） */
function pcatRead(target) {
  const box = (typeof target === 'string') ? $(target) : target;
  if (!box) return '';
  return pcatJoin([...box.querySelectorAll('.pcat-chip.on')].map(b => b.dataset.cat).filter(v => v && v !== '__new'));
}
/* 【v13 修改】绑定多选标签选择器：点标签切换勾选；点「新增标签」弹输入窗并即时勾选 */
function bindPcatPicker(target) {
  const box = (typeof target === 'string') ? $(target) : target;
  if (!box || box.dataset.pcatBound) return;
  box.dataset.pcatBound = '1';
  box.addEventListener('click', async e => {
    const nb = e.target.closest('[data-pcat-new]');
    if (nb) {
      const v = await promptBox(T('pcatNewTitle'), '');
      /* 标签名里不能混入分隔符，否则存进去会被当成两个标签 */
      const nm = String(v == null ? '' : v).trim().replace(/[、,，;；|]+/g, '').slice(0, 20);
      if (!nm) return;
      let chip = [...box.querySelectorAll('.pcat-chip[data-catn]')].find(b => b.dataset.catn === nm);
      if (!chip) {
        /* 与内置标签同名时不重复登记自定义，直接复用内置标签 */
        if (PCATKEYS.map(k => T(k)).indexOf(nm) < 0 && !(S.pcats || []).includes(nm)) { S.pcats.push(nm); save(); }
        chip = document.createElement('button');
        chip.type = 'button'; chip.className = 'tag-chip pcat-chip';
        chip.dataset.cat = nm; chip.dataset.catn = nm; chip.textContent = nm;
        box.insertBefore(chip, nb);
      }
      chip.classList.add('on');
      return;
    }
    const c = e.target.closest('.pcat-chip'); if (!c) return;
    c.classList.toggle('on');
  });
}

function xmlEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* 是否运行在内嵌环境（iframe / 内建预览面板）：此类环境常静默拦截 a[download] */
function isEmbedded(){ try { return window.self !== window.top; } catch(e){ return true; } }
function downloadBlob(name, blob, textContent){
  let ok = false;
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    ok = true;
  } catch(e){ ok = false; }
  /* 内嵌环境下 a[download] 会被静默拦截（无异常、无保存框）→ 主动弹手动兜底窗 */
  if (!ok || isEmbedded()) { try { downloadFallback(name, blob, textContent); } catch(e){} }
  return ok;
}

/* 新窗口保存：把文件 base64 内嵌进一个中转页，在中转页（非沙箱真窗口）里用 a[download] 真正触发下载。

   直接 window.open(数据 blob) 只会“展示”内容不弹保存框 —— v4 已踩坑。 */
function openSaveWindow(name, blob){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const b64 = String(fr.result).split(',')[1] || '';
      const mime = blob.type || 'application/octet-stream';
      const safeName = String(name).replace(/[<>&"]/g, '');
      const hint = String(T('dlWinHint')).replace(/[<>&]/g, '');
      const html = '<!doctype html><html><head><meta charset="utf-8"><title>' + safeName + '</title></head>'
        + '<body style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;padding:56px 24px;text-align:center;background:#f6f7f9;color:#222">'
        + '<p style="font-size:15px;margin:0 0 22px">' + hint + '</p>'
        + '<a id="d" href="#" download="' + safeName + '" style="display:inline-block;padding:13px 30px;background:#0d9488;color:#fff;border-radius:10px;text-decoration:none;font-size:16px">' + safeName + '</a>'
        + '<scr' + 'ipt>'
        + 'var b64="' + b64 + '",bin=atob(b64),u8=new Uint8Array(bin.length);'
        + 'for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);'
        + 'var url=URL.createObjectURL(new Blob([u8],{type:"' + mime + '"}));'
        + 'var a=document.getElementById("d");a.href=url;a.click();'
        + '<\/scr' + 'ipt></body></html>';
      const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
      const w = window.open(url, '_blank');
      if (!w) toast(T('dlPopupBlocked'), true);
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch(e){ toast(T('dlPopupBlocked'), true); }
  };
  fr.onerror = () => toast(T('dlPopupBlocked'), true);
  fr.readAsDataURL(blob);
}
/* 下载兜底：新窗口打开中转页触发真正下载 / 文本格式可复制内容另存 */
async function downloadFallback(name, blob, textContent){
  try {
    const opts = [{ v: 'open', n: T('dlOpen') }];
    if (textContent != null) opts.push({ v: 'copy', n: T('dlCopy') });
    const r = await choiceBox(T('dlTitle'), T('dlBody', name), opts);
    if (r === 'open') {
      openSaveWindow(name, blob);
    } else if (r === 'copy') {
      let done = false;
      try { await navigator.clipboard.writeText(textContent); done = true; }
      catch(e){
        const ta = document.createElement('textarea'); ta.value = textContent;
        ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
        try { done = document.execCommand('copy'); } catch(e2){}
        ta.remove();
      }
      toast(done ? T('dlCopied') : T('dlCopyFail'), !done);
    }
  } catch(e){}
}

function crc32(buf){

    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,size,true); ch.setUint32(24,size,true); ch.setUint16(28,nameBytes.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true); ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,offset,true);

/* 组装一个完整 xlsx 的全部 zip 条目（sheet 名可配，导出日历/检查台账共用） */
function xlsxFiles(sheetName, rows){

    { name:'xl/workbook.xml', data:wb },
    { name:'xl/_rels/workbook.xml.rels', data:XLSX_PARTS.wbrels },

    { name:'xl/worksheets/sheet1.xml', data:sheetXml(rows) }

}

// modified: [v31-P0] 解析/归一化失败时先把原始串隔离留档，绝不静默清空；最多保留最近 3 份
function quarantineRaw(raw, why) {
  if (!raw) return;
  try {
    const stamp = Date.now();
    const item = JSON.stringify({ at: stamp, why: why, raw: raw }); // modified
    localStorage.setItem(KEY + '_corrupt_latest', item); // modified
    localStorage.setItem(KEY + '_corrupt_' + stamp, item); // modified
    const keys = []; // modified
    for (let i = 0; i < localStorage.length; i++) { // modified
      const k = localStorage.key(i); // modified
      if (k && k.indexOf(KEY + '_corrupt_') === 0 && k !== KEY + '_corrupt_latest') keys.push(k); // modified
    }
    keys.sort().slice(0, Math.max(0, keys.length - 3)).forEach(k => { try { localStorage.removeItem(k); } catch (_) {} }); // modified
  } catch (_) {}
}
function load() {
  let raw = null;
  try {
    raw = localStorage.getItem(KEY);
    if (!raw) { S = blank(); S.meta.sample = false; save(); return; }
    const d = JSON.parse(raw);
    if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('bad shape'); // modified
    S = Object.assign(blank(), d);
    S.meta = Object.assign(blank().meta, (d.meta && typeof d.meta === 'object') ? d.meta : {}); // modified
    ['tasks','notes','projects','inspects','schedules','personal','study'].forEach(k => { if (!Array.isArray(S[k])) S[k] = []; });
    try { normalize(); } // modified
    catch (ne) { // modified
      quarantineRaw(raw, 'normalize: ' + (ne && ne.message)); // modified
      try { console.warn('[load] normalize failed; raw data kept as-is', ne); } catch (_) {} // modified
    }
  } catch (e) {
    quarantineRaw(raw, 'parse: ' + (e && e.message)); // modified
    S = blank(); S.meta.sample = false;

    try { console.warn('[load] read failed; original data quarantined', e); } catch (_) {} // modified
  }
}
/* 数据兼容：补齐字段、清理指向已删项目的悬空引用 */
function normalize() {
  // modified: [v31-P1] 云端/手工导入的脏数据可能含 null 或非对象元素，先剔除再取 id，避免整页白屏
  ['tasks','notes','projects','inspects','schedules','personal','study'].forEach(k => { // modified
    S[k] = (Array.isArray(S[k]) ? S[k] : []).filter(x => x && typeof x === 'object' && !Array.isArray(x)); // modified
  }); // modified
  // modified: [v31-P1] 非法日期串（云端手改/旧备份）会让 dayDiff 得 NaN、排序与提醒错位；只兜非身份字段
  // modified: 日程 date 参与业务键、学习 date 参与去重，二者不动，避免清空后误删数据
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/; // modified
  const cleanD = v => (typeof v === 'string' && DATE_RE.test(v)) ? v : ''; // modified
  S.tasks.forEach(x => { if ('due' in x) x.due = cleanD(x.due); }); // modified
  S.personal.forEach(x => { if ('due' in x) x.due = cleanD(x.due); }); // modified
  S.inspects.forEach(x => { ['date','recheck'].forEach(f => { if (f in x) x[f] = cleanD(x[f]); }); }); // modified
  const ids = new Set(S.projects.map(p => p.id));
  /* 【v30】身份与版本戳统一前置：后面的「自愈去重」要靠 updatedAt 决定留哪一条。
     旧版漏了三处：①去重时 updatedAt 还没回填，只能留第一条（等于随机留旧数据）；
     ②schedules 先补戳、其余表后补戳，两条路径不一致；③study 完全没补 id，
     合并时 byId[undefined] 会互相顶掉。这里一次补全，后面只负责校验。 */
  const idBackfill = (arr) => {
    if (!Array.isArray(arr)) return;
    arr.forEach(x => {
      if (!x || typeof x !== 'object') return;
      if (!x.id) x.id = uid();
      if (!x.updatedAt) x.updatedAt = x.createdAt || Date.now();
    });
  };
  ['tasks', 'notes', 'projects', 'inspects', 'personal', 'schedules', 'study'].forEach(k => idBackfill(S[k]));
  S.tasks.forEach(k => {
    if (k.pid === undefined) k.pid = '';

    case 'result': return RESKEYS.indexOf(a.result || '') - RESKEYS.indexOf(b.result || '');

function insSorted() {
  const k = INS_SORT_COLS.indexOf(ui.insSort.k) >= 0 ? ui.insSort.k : 'date';

  return S.inspects.slice().sort((a, b) => {

    if (k === 'date' || k === 'recheck') {

/* 复查时间提示语（逾期标红 / 临近标黄） */
function recheckHint(x) {
  if (!x.recheck || x.prog === 'rechecked') return { c: '', t: '' };
  const d = dayDiff(TODAY(), x.recheck);
  if (d < 0) return { c: 'od', t: T('insOd', -d) };
  if (d === 0) return { c: 'soon', t: T('insDueToday') };
  if (d <= RECHECK_SOON) return { c: 'soon', t: T('insDueSoon', d) };
  return { c: '', t: '' };
}
/* 复查到期：有复查时间、尚未复查完，且距今不超过 7 天（含已逾期） */
const recheckDue = () => {
  const t = TODAY();
  return S.inspects
    .filter(x => x.recheck && x.prog !== 'rechecked' && dayDiff(t, x.recheck) <= RECHECK_SOON)
    .sort((a, b) => (a.recheck > b.recheck ? 1 : -1));
};
/* 检查任务新增时，自动在「日程管理」生成一条简要日程：检查<公司名>（公司名可用缩写，即填写的检查对象） */
/* 【同步v3】日程删除登记墓碑：云端行由推送统一软删除；软删除生效前，拉取不会把已删日程"复活" */
function tombSchedules(members) {
  if (!S.tombSched) S.tombSched = {};
  const now = Date.now();
  (members || []).forEach(y => { if (y && y.id) S.tombSched[y.id] = now; });
}
/* 【v7】通用墓碑登记：任务/项目/记事/检查/个人事项删除时记录删除时间戳，推送时云端软删除（多设备删除传播） */
function tombItems(tombKey, members) {
  if (!S[tombKey]) S[tombKey] = {};
  const now = Date.now();
  (members || []).forEach(y => { if (y && y.id) S[tombKey][y.id] = now; });
}
/* 【修复】删除检查任务生成的日程时，在检查任务上打标记，防止它被自动重新生成（"删了刷新又出现"） */
function markInsSchedOff(members) {
  (members || []).forEach(y => {
    if (!y || !y.insId) return;
    const ins = S.inspects.find(x => x.id === y.insId);
    if (ins) ins.schedOff = true;
  });
}
/* 【修复】检查任务 → 关联日程 同步：编辑检查任务（名称/日期）后，把已存在的关联日程一并更新；
   若该任务的日程此前被手动删除过（schedOff），则沿用"不再自动生成"的用户意图，不复活。
   返回本次实际更新的日程条数。 */
function syncInspectSchedule(ins) {
  if (!ins || !ins.date || !ins.target) return 0;
  const title = '检查' + ins.target;
  const linked = S.schedules.filter(s => s.insId === ins.id);
  if (!linked.length) {
    /* 关联日程已不存在（被手动删除过）→ 尊重用户意图，不重新生成 */
    if (ins.schedOff) return 0;
    ensureInspectSchedule(ins);
    return 0;
  }
  let n = 0;
  linked.forEach(s => {
    if (s.title === title && s.date === ins.date) return;
    s.title = title;
    s.date = ins.date;
    s.note = '关联检查任务：' + ins.target;
    s.updatedAt = Date.now();
    s._dirty = true; /* 【同步v3】版本戳+待同步标记 */
    n++;
  });
  return n;
}
function ensureInspectSchedule(ins) {
  if (!ins || !ins.date || !ins.target) return;
  if (ins.schedOff) return; // 【修复】该检查任务的日程被用户手动删除过，不再自动生成
  const title = '检查' + ins.target;
  // 避免同一检查任务重复生成；同名同日期日程已存在时也不重复生成（防重复检查任务带出重复日程）
  if (S.schedules.some(s => s.insId === ins.id || (s.title === title && s.date === ins.date))) return;
  S.schedules.push({
    id: uid(),
    title: title,
    date: ins.date, time: '', end: '',
    cat: 'scat1', note: '关联检查任务：' + ins.target,
    allday: true, createdAt: Date.now(), updatedAt: Date.now(), _dirty: true,
    insId: ins.id, fromIns: true
  });
}
const insStats = () => {
  const n = S.inspects.length;
  const reN = S.inspects.filter(x => x.prog === 'rechecked').length;
  return {
    n, reN,
    doneN: S.inspects.filter(x => x.prog !== 'todo').length,
    waitN: S.inspects.filter(x => x.prog === 'wait').length,
    pct: n ? Math.round(reN / n * 100) : 0
  };
};
/* 项目关联 */
const projById = id => S.projects.find(p => p.id === id);
const projName = id => { const p = projById(id); return p ? p.name : ''; };
const tasksOfProj = id => S.tasks.filter(k => k.pid === id);
const projProgress = id => {
  const arr = tasksOfProj(id);
  const done = arr.filter(k => k.done).length;
  return { done, total: arr.length, pct: arr.length ? Math.round(done / arr.length * 100) : 0,
           open: arr.filter(k => !k.done), od: arr.filter(k => !k.done && k.due && k.due < TODAY()) };
};
/* 按日期把任务分组，返回 [[日期, [任务...]], ...] */
const groupByDue = arr => {
  const m = new Map();
  arr.forEach(k => { const d = k.due || ''; if (!m.has(d)) m.set(d, []); m.get(d).push(k); });
  return [...m.entries()];
};

/* GitHub 风格任务完成热力图（近 12 周，借鉴 github.com contributions） */
function heatCard() {
  const weeks = 12;
  const counts = {};
  S.tasks.forEach(k => { if (k.done && k.doneAt) { const d = ds(new Date(k.doneAt)); counts[d] = (counts[d] || 0) + 1; } });
  const today = TODAY();
  const start = weekStart(TODAY(), -(weeks - 1));
  let cols = '', total = 0;
  for (let w = 0; w < weeks; w++) {
    let col = '';
    for (let i = 0; i < 7; i++) {
      const d = shift(start, w * 7 + i);
      if (d > today) { col += `<span class="heat-cell"></span>`; continue; }
      const n = counts[d] || 0; total += n;
      const lv = n === 0 ? 0 : n === 1 ? 1 : n === 2 ? 2 : n <= 4 ? 3 : 4;
      col += `<span class="heat-cell heat-l${lv}" title="${d} · ${n}"></span>`;
    }
    cols += `<div class="heat-col">${col}</div>`;
  }
  return `<div class="card"><div class="card-h">${I.ok}<h2>${T('heatTitle')}</h2>
      <span class="hint">${T('heatSub')} · ${total}</span></div>
    <div class="card-b"><div class="heat">
      <div class="heat-grid">${cols}</div>
      <div class="heat-legend"><span>${T('heatLess')}</span>${[0,1,2,3,4].map(l=>`<span class="heat-cell heat-l${l}"></span>`).join('')}<span>${T('heatMore')}</span>${total===0?`<span>· ${T('heatEmpty')}</span>`:''}</div>
    </div></div></div>`;
}

/* 日期归一：2026-9-6 / 2026/9/6 / 2026年9月6日 / Excel 序列号 都能吃 */
function normDate(v) {
  // 全角数字／中文日期先归一，WPS 导出的表格里很常见
  let s = String(v == null ? '' : v)
    .replace(/[\uFF10-\uFF19]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .trim();
  if (!s) return '';
  let m = s.match(/(\d{4})\s*[-/.年]\s*(\d{1,2})\s*[-/.月]\s*(\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
  m = s.match(/^(\d{1,2})\s*[-/.]\s*(\d{1,2})\s*[-/.]\s*(\d{4})$/);
  if (m) return `${m[3]}-${String(m[1]).padStart(2, '0')}-${String(m[2]).padStart(2, '0')}`;
  if (/^\d{5}(\.\d+)?$/.test(s)) {                       // Excel 日期序列号
    const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(Number(s)) * 864e5);
    return isNaN(d.getTime()) ? '' : d.toISOString().slice(0, 10);
  }
  return '';
}
/* 分类名 → key；识别不了返回空，由调用方兜底为「监督检查」 */
function catFromName(name) {
  const s = String(name || '').trim();
  if (!s) return '';
  for (const k of CATKEYS) { if (T(k) === s) return k; }
  const KW = [['cat2', '飞行,飞检,跟踪'], ['cat3', '专项,整治,行动'], ['cat4', '许可,核查,验收'],
              ['cat5', '投诉,举报'], ['cat6', '案件,查办,稽查'], ['cat1', '监督,日常,例行'],
              ['cat7', '报送,材料,报表'], ['cat8', '会议,培训']];
  for (const [k, w] of KW) { if (w.split(',').some(x => s.indexOf(x) >= 0)) return k; }
  return '';
}
/* 按行切分：优先 Tab（Excel 复制默认 Tab），其次逗号（带引号保护） */
function splitRow(l) {
  if (l.indexOf('\t') >= 0) return l.split('\t');
  if (l.indexOf(',') >= 0 || l.indexOf('，') >= 0) {
    const src = l.replace(/，/g, ','), out = [];
    let cur = '', q = false;
    for (let i = 0; i < src.length; i++) {
      const c = src[i];
      if (c === '"') { if (q && src[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
      else if (c === ',' && !q) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur); return out;
  }
  return [l];
}
function parseInsText(text) {
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  const cells = lines.map(l => splitRow(l).map(c => String(c).trim()));
  let start = 0;
  const map = { t: 0, c: -1, d: -1, r: -1, p: -1 };
  const hi = lines.findIndex(l => l.trim());
  const first = hi >= 0 ? (cells[hi] || []).join('|') : '';
  if (hi >= 0 && /序号|检查对象|企业名称|单位名称|被检查|对象|企业|名称|单位/.test(first)) {
    start = hi + 1;
    const H = (cells[hi] || []).map(x => String(x).replace(/\s/g, ''));
    const at = ks => H.findIndex(h => ks.some(k => h.indexOf(k) >= 0));
    const ti = at(['检查对象', '企业名称', '单位名称', '被检查单位', '对象', '企业', '名称', '单位']);
    if (ti >= 0) map.t = ti;
    map.c = at(['任务分类', '检查类别', '分类', '类别', '检查类型']);
    map.d = at(['检查时间', '检查日期', '计划时间', '检查计划']);
    map.r = at(['复查时间', '复查日期']);
    map.p = at(['检查人员', '检查人', '人员', '执法人员']);
  }
  const rows = [];
  let skipped = 0;
  for (let i = start; i < cells.length; i++) {
    const c = cells[i] || [];
    const target = (c[map.t] || '').trim();
    if (!target) { if (c.some(x => x)) skipped++; continue; }
    if (/^序号$|^[-—=]+$/.test(target)) continue;
    rows.push({ target: target, cat: catFromName(c[map.c]), date: normDate(c[map.d]),
                recheck: normDate(c[map.r]), people: (c[map.p] || '').trim() });
  }
  return { rows: rows, skipped: skipped };
}
/* 【v17】批量导入弹层：入口在页面右上角（「导出Excel」旁边），替代原先页面下方的常驻卡片。
   返回式设计：解析成功 → 关闭本层、由预览层接手；解析失败 → 保留本层让用户就地修改。 */
function openInsBatchDlg() {
  const m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML = `<div class="modal" style="max-width:560px"><h3>${T('insBatchSum')}</h3>
    <p class="imp-hint">${T('insBatchHint')}</p>
    <div class="f" style="margin-bottom:9px"><label>${T('insFile')}</label>
      <input type="file" id="insFile" accept=".csv,.tsv,.txt" style="padding:7px 10px"></div>
    <div class="f" style="margin-bottom:16px"><label>${T('insPasteLbl')}</label>
      <textarea id="insPaste" rows="5" placeholder="${esc(T('insPastePh'))}" style="font-size:13px;line-height:1.7"></textarea></div>
    <div class="ma"><button class="btn" data-r="0">${T('cancel')}</button>
      <button class="btn btn-primary" data-r="1">${I.upload}${T('insParse')}</button></div></div>`;
  /* 选 CSV 文件：读出内容填进文本框并直接进预览（原内嵌卡片的读取逻辑原样搬进来） */
  const fi = m.querySelector('#insFile');
  if (fi) fi.onchange = () => {
    const f = fi.files && fi.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      let txt = '';
      try { txt = new TextDecoder('utf-8').decode(fr.result); } catch (e) { txt = ''; }
      // Excel 另存的 CSV 在 Windows 上多为 GBK，出现乱码时回退一次
      if (!txt || txt.indexOf('\uFFFD') >= 0) {
        try { const g = new TextDecoder('gbk').decode(fr.result); if (g) txt = g; } catch (e) {}
      }
      const ta = m.querySelector('#insPaste'); if (ta) ta.value = txt;
      if (openInsImport()) m.remove();
    };
    fr.onerror = () => toast(T('insFileFail'), true);
    fr.readAsArrayBuffer(f);
    fi.value = '';
  };
  m.addEventListener('click', e => {
    if (e.target === m) return m.remove();
    const b = e.target.closest('[data-r]'); if (!b) return;
    if (b.dataset.r === '1') { if (openInsImport()) m.remove(); return; }
    m.remove();
  });
  document.body.appendChild(m);
}

    </tbody></table></div>
    <div class="imp-opts">

      <button class="btn btn-primary" data-r="1">${I.save}${T('insImportBtn')}</button></div></div>`;
  m.addEventListener('click', e => {
    if (e.target === m) return m.remove();
    const b = e.target.closest('[data-r]'); if (!b) return;
    if (b.dataset.r === '1') {
      if (m.dataset.done) return; m.dataset.done = '1'; /* 【修复】防连点重复导入同一批数据 */
      const dup = m.querySelector('#ii_dup').checked;
      const rep = m.querySelector('#ii_rep').checked;
      if (rep) S.inspects = [];
      const normT = v => String(v || '').replace(/\s+/g, ''); /* 宽松去重键：忽略空格/换行差异 */
      const exist = new Set(S.inspects.map(x => normT(x.target)));
      let added = 0, dups = 0;
      r.rows.forEach(x => {
        if (dup && exist.has(normT(x.target))) { dups++; return; }
        const ins = { id: uid(), seq: 0, target: x.target, cat: x.cat || 'cat1', date: x.date,
          recheck: x.recheck, prog: 'todo', result: '', people: x.people, notes: '',
          createdAt: Date.now(), updatedAt: Date.now(), recheckedAt: null, remoteId: '' };
        S.inspects.push(ins);
        ensureInspectSchedule(ins);
        exist.add(normT(x.target)); added++;
      });
      reseqIns(); save(true); render(); toast(T('insImported', added, dups));
    }
    m.remove();
  });
  document.body.appendChild(m);
  return true; /* 【v17】供调用方判断解析是否成功进入预览 */
}

/* 【v11】各分组条数：与 vPersonal 的筛选口径严格一致，供分组按钮徽标与空态提示使用。
   【v13】改为对"已过顶部筛选的集合"计数，徽标才与列表里实际看到的条数一致。 */
function personalCounts(a) {
  const t = TODAY(); a = a || S.personal;
  return {
    today:    a.filter(k => !k.done && (!k.due || k.due <= t)).length,
    overdue:  a.filter(k => !k.done && k.due && k.due < t).length,
    upcoming: a.filter(k => !k.done && k.due && k.due > t).length,
    all:      a.length,
    done:     a.filter(k => k.done).length
  };
}

  const p = ui.personalPrioFilter, c = ui.personalCatFilter;
  return S.personal.filter(k => {
    if (p && String(Number(k.prio) || 1) !== p) return false;
    if (c === '__none') return !pcatSplit(k.cat).length;
    if (c) return pcatNames(k.cat).indexOf(c) >= 0;
    return true;
  });
}

function vPersonal() {

  let arr;
  if (f === 'today') arr = base.filter(k => !k.done && (!k.due || k.due <= TODAY()));
  else if (f === 'overdue') arr = base.filter(k => !k.done && k.due && k.due < TODAY());
  else if (f === 'upcoming') arr = base.filter(k => !k.done && k.due && k.due > TODAY());
  else if (f === 'done') arr = base.filter(k => k.done).sort((a,b) => (b.doneAt||0)-(a.doneAt||0));

      </select>
      ${filtering ? `<button class="btn btn-sm" data-act="pflt-clear">${T('pFltClear')}</button>` : ''}

  return head(T('personalHead'), '',
    `<button class="btn btn-primary" data-act="p-add-focus">${I.plus}${T('pAdd')}</button>`)
  + `<div class="card"><div class="card-h">${I.plus}<h2>${T('pNew')}</h2></div>
     <div class="card-b"><form id="personalForm">
       <!--【v21】「要做什么」+「轻急缓重」+「截止日期」三项并到一行；分类标签单独一行；备注降到两行 -->
       <div class="form form-3in1" style="margin-bottom:9px">
         <div class="f grow"><label>${T('pLblTitle')}</label><input type="text" id="pTitle" placeholder="${T('phPersonal')}" maxlength="140" required></div>

         <button class="btn btn-primary" type="submit" style="align-self:flex-end">${I.plus}${T('pBtnAdd')}</button></div>

       <div class="sp">${fltBar}
         <button class="btn btn-sm head-act${ui.batchP?' btn-danger':''}" data-act="batch-pers">${ui.batchP?T('batchExit'):T('batchTasks')}</button></div>
       <div class="sp sp-row2"><div class="seg">${segs.map(([k,n])=>`<button data-act="pfilter" data-f="${k}" class="${f===k?'on':''}">${n}<span class="cnt${pc[k]?'':' zero'}">${pc[k]}</span></button>`).join('')}</div></div>
       </div></div>
       ${ui.batchP ? selBar('p', arr.length) : ''}
     <div class="card-b">${arr.length ? `<div class="list">${arr.map(personalRow).join('')}</div>` : emptyHtml}</div></div>`;

/* ================= 日程 ================= */
/* 相对日期徽标：今天 / 明天 / N天后 / 已过N天（借鉴 Google Calendar 列表） */
function relDatePill(d) {
  if (!d) return '';
  const n = dayDiff(TODAY(), d);
  if (n === 0) return `<span class="pill rel today">${T('relToday')}</span>`;
  if (n === 1) return `<span class="pill rel">${T('relTmr')}</span>`;
  if (n < 0) return `<span class="pill rel past">${T('relPast', -n)}</span>`;
  if (n <= 7) return `<span class="pill rel">${T('relIn', n)}</span>`;
  return `<span class="pill gray">${esc(String(d).slice(5).replace('-', '/'))}</span>`; // modified
}
function schedRow(s) {
  const col = SCATCOLOR[s.cat] || '#888';
  const pick = ui.batchS ? `<button class="chk pick${ui.selS.has(s.id)?' on':''}" data-act="ssel" data-id="${s.id}" aria-label="${T('batchTasks')}">${I.check}</button>` : '';
  return `<div class="item" style="border-left:3px solid ${col}">
    ${pick}
    <div class="it-main"><div class="it-title">${esc(s.title)}</div>
      <div class="it-meta">
        ${relDatePill(s.date)}

  const set = new Set(S.study.map(x => x.date));
  if (!set.size) return 0;
  let cur = TODAY();
  /* 今天还没打卡不算断签——从昨天起算，避免白天没打卡就把连续天数显示成 0 */
  if (!set.has(cur)) cur = shift(cur, -1);

  const rec = stuRec(); if (!rec) return false;
  if (!Array.isArray(rec.blocks)) rec.blocks = [];
  let b = rec.blocks.find(x => x.hour === hour);
  if (!b) {
    if (!st && !blkTx(rec, hour)) return false;
    b = { hour: hour, state: '', tx: '' };
    rec.blocks.push(b);
  }
  if (b.state === st) return false;
  b.state = st;
  if (!st && !b.tx) rec.blocks = rec.blocks.filter(x => x !== b);   /* 状态清空且没内容 → 整行丢弃，不留空壳 */
  rec.updatedAt = Date.now();
  save(true);
  return true;
}
function blkSetTx(hour, tx) {
  const rec = stuRec(); if (!rec) return;
  if (!Array.isArray(rec.blocks)) rec.blocks = [];
  let b = rec.blocks.find(x => x.hour === hour);
  if (!b) {
    if (!tx.trim()) return;                        /* 空内容不建行 */
    b = { hour: hour, state: '', tx: '' };
    rec.blocks.push(b);
  }
  if (b.tx === tx) return;
  b.tx = tx;
  rec.updatedAt = Date.now();
  save(true);
}
/* 一行是否该显示：有状态 或 有内容 */
const blkRowLive = (rec, h) => { const b = blkOf(rec, h); return !!(b && (b.state || b.tx)); };

/* ---- 时长对账条（v14 的核心自纠机制） ---- */
function blkSummaryHtml(rec) {
  const auto = blkMinutes(rec);                 /* 有效时长：专注 + 一般 */
  const drift = blkDriftMinutes(rec);
  const manual = rec ? (Number(rec.mins) || 0) : 0;
  const hm = m => `${Math.floor(m / 60)}<span class="u">h</span> ${m % 60}<span class="u">m</span>`;
  const ad = Math.abs(manual - auto);
  const same = (manual === auto) || ad <= 30;   /* 30 分钟内的差属正常估算误差，不报警 */
  /* 自动为 0 时不给「多了/少了」的结论——没有基准，任何比较都没意义 */
  if (!auto) {
    return `<div class="blk-sum">
      <div class="bx"><div class="k">${T('blkSumActual')}</div><div class="v">0<span class="u">h</span></div></div>
      <div class="bx${manual ? ' warn' : ''}"><div class="k">${T('blkSumManual')}</div><div class="v">${hm(manual)}</div></div>
      <div class="bx"><div class="k">${T('blkSumDiff')}</div><div class="v">—</div></div>
    </div>
    <div class="blk-note">${T('blkSumNone')}${manual ? ' · ' + esc(T('blkSumNoBase')) : ''}</div>`;
  }
  const diff = manual - auto;
  let note, ok2 = false;
  if (same) { note = T('blkNoteSame', hm(auto)); ok2 = true; }
  else if (diff > 0) { note = ad >= 120 ? T('blkNoteBigOver', fmtDiff(diff)) : T('blkNoteOver', fmtDiff(diff)); }
  else { note = T('blkNoteUnder', fmtDiff(ad)); }
  /* 走神提醒单独一行：它既不该算进有效时长，也不该被当成"漏记"，而是一条可回收的时间线索 */
  const driftLine = drift
    ? `<div class="blk-note drift">${I.alert}<span>${T('blkDriftLine', fmtDiff(drift))}</span></div>`
    : '';
  return `<div class="blk-sum">
    <div class="bx"><div class="k">${T('blkSumActual')}</div><div class="v">${hm(auto)}</div></div>
    <div class="bx${same ? ' good' : ' warn'}"><div class="k">${T('blkSumManual')}</div><div class="v">${hm(manual)}</div></div>
    <div class="bx${same ? ' good' : ' warn'}"><div class="k">${T('blkSumDiff')}</div><div class="v">${diff === 0 ? '0' : (diff > 0 ? '+' : '−') + fmtDiff(ad)}</div></div>
  </div>
  <div class="blk-note${ok2 ? ' ok' : ''}">${note}</div>
  ${driftLine}`;
}

/* 分钟 → 可读差值。必须用 floor 折算小时：原先用 round，
   40 分钟会算成 Math.round(0.67)=1 小时，显示成 "1h40m"（非整小时差值全部算错）。
   不足 1 小时只显示分钟，避免出现 "0h40m" 这种别扭写法。 */
const fmtDiff = m => {
  const t = Math.max(0, Math.round(m));
  const h = Math.floor(t / 60), mm = t % 60;
  if (!h) return `${mm}m`;
  if (!mm) return `${h}h`;
  return `${h}h${mm}m`;
};

/* 一周分布 · 统计卡部分（折叠时只显示这5 张卡） */
/* 把最近 7 天的聚合结果算出来：{days, hours, recs, agg, best, worst} */
function blkWeekAgg() {
  const today = TODAY(), days = [];
  for (let i = 6; i >= 0; i--) days.push(shift(today, -i));
  const hours = stuHours();
  const recs = days.map(d => stuByDate(d));
  const any = recs.some(r => r && r.blocks && r.blocks.length);
  const agg = { focus: 0, normal: 0, drift: 0, rest: 0 };
  recs.forEach(r => { if (r && r.blocks) r.blocks.forEach(b => { if (agg[b.state] !== undefined) agg[b.state]++; }); });
  const byHour = {};
  hours.forEach(h => { byHour[h] = { good: 0, bad: 0, n: 0 }; });
  recs.forEach(r => {
    if (!r || !r.blocks) return;
    r.blocks.forEach(b => {
      const t = byHour[b.hour]; if (!t) return;
      /* 「高效样本」=专注+一般；只有 >=2 天同一小时有记录才下结论，否则样本太少会误判 */
      if (b.state === 'focus' || b.state === 'normal') { t.good++; t.n++; }
      else if (b.state === 'drift') { t.bad++; t.n++; }
    });
  });
  const ranked = Object.entries(byHour).filter(([, v]) => v.n >= 2).sort((a, b) => b[1].good - a[1].good);
  const best = ranked.length ? ranked[0] : null;
  const driftRank = Object.entries(byHour).filter(([, v]) => v.n >= 2 && v.bad > 0).sort((a, b) => b[1].bad - a[1].bad);
  const worst = driftRank.length ? driftRank[0] : null;
  return { days, hours, recs, agg, best, worst, any };
}
/* 折叠态：只出 5 张统计卡 */
function blkWeekStatsHtml() {
  const w = blkWeekAgg();
  if (!w.any) return emptyBox(T('blkEmptyAll'), 'cal');
  return blkWeekStatCardsHtml(w.agg, w.best, w.worst);
}
/* 展开态：统计卡 +7×N 热力网格 */
function blkWeekBodyHtml() {
  const w = blkWeekAgg();
  if (!w.any) return emptyBox(T('blkEmptyAll'), 'cal');
  const { days, hours, recs, agg, best, worst } = w;
  const grid = `<div class="blk-week-grid">${days.map((d, di) => `
    <div class="bwg-row">
      <span class="bwg-lb">${d.slice(5).replace('-', '/')}</span>
      <span class="bwg-cells">${hours.map(h => {

        const st = b ? b.state : '';
        return `<i class="${st ? 's-' + st : ''}" title="${esc(d + ' ' + stuHourLabel(h) + ' ' + stuStateText(st))}"></i>`;
      }).join('')}</span>
    </div>`).join('')}</div>`;
  return blkWeekStatCardsHtml(agg, best, worst) + grid;
}

/* 5 张统计卡（折叠/展开两种视图共用同一份实现，避免两处不一致） */

    <div class="stat"><div class="n" style="font-size:17px">${best ? stuHourLabel(+best[0]) : '—'}</div><div class="l">${T('blkStatBest')}</div><div class="sb">${best ? T('blkDayHours', best[1].good) : T('blkStatBestNone')}</div></div>
    <div class="stat${worst ? ' red' : ''}"><div class="n" style="font-size:17px">${worst ? stuHourLabel(+worst[0]) : '—'}</div><div class="l">${T('blkStatWorst')}</div><div class="sb">${worst ? T('blkDayHours', worst[1].bad) : T('blkStatWorstNone')}</div></div>

}

/* ---- 从「明日计划」预填：把昨天的 tomorrow 拆成条目，塞进今天还没排的空行 ---- */
function blkPrefill() {
  const rec = stuRec(); if (!rec) return;
  const y = stuByDate(shift(TODAY(), -1));
  const src = (y && y.tomorrow ? y.tomorrow : (rec.tomorrow || '')).trim();
  if (!src) { toast(T('blkNeedPlan'), true); return; }
  /* 按中英文标点与换行拆条；过滤空项与过短项 */
  const parts = src.split(/[\n；;，,、。]+/).map(x => x.trim()).filter(x => x.length >= 2);
  if (!parts.length) { toast(T('blkNeedPlan'), true); return; }
  const hours = stuHours();
  const nowH = new Date().getHours();
  /* 从当前小时起找空行（就近排），都排满了则无位可放 */
  const order = hours.slice().sort((a, b) => Math.abs(a - nowH) - Math.abs(b - nowH));
  let filled = 0, dropped = 0;
  parts.forEach(txt => {
    const h = order.find(x => !blkRowLive(rec, x));
    /* 【修复】原先这里直接 return，条目被静默丢弃，却仍提示"预填完成：已把明日计划拆成 N 项"，
       用户以为都排上了。现在把放不下的条数如实报出来。 */
    if (h === undefined) { dropped++; return; }
    if (!Array.isArray(rec.blocks)) rec.blocks = [];
    let b = rec.blocks.find(x => x.hour === h);
    if (!b) { b = { hour: h, state: '', tx: '' }; rec.blocks.push(b); }
    b.tx = txt.slice(0, 80);
    if (!b.state) b.state = 'focus';     /* 预填的默认标「专注」；不认同就点一下改 */
    filled++;
  });
  rec.updatedAt = Date.now();
  save(true); render();
  if (!filled) {
    toast(T('blkNoRoom', parts.length), true);           /* 一条都没排上 → 明确说清楚原因 */
  } else if (dropped) {
    toast(T('blkFromPlanPartial', filled, dropped), true);  /* 部分排上 → 告知还剩几条没位置 */
  } else {
    toast(T('blkFromPlan', filled));
  }
}

function stuStreakStripHtml() {
  const arr = S.study.filter(x => stuLogged(x.date));

/* ---- 写操作：保存一天（含「同一天只留一条」的合并语义） ---- */
function saveStudy(rec) {
  const d = rec.date;
  if (!d) return;
  const idx = S.study.findIndex(x => x.date === d);
  const base = idx >= 0 ? S.study[idx] : { id: uid(), date: d, createdAt: Date.now() };
  /* 【v14】打卡表单只提交表单字段，不含 blocks。若直接 Object.assign，
     rec.blocks=undefined 会把已记的时间块整块冲掉 —— 先摘出来再赋值。 */
  const keepBlocks = rec.blocks;
  Object.assign(base, rec, { updatedAt: Date.now() });
  if (keepBlocks !== undefined) base.blocks = keepBlocks;
  else if (!Array.isArray(base.blocks)) base.blocks = [];
  if (idx >= 0) S.study[idx] = base; else S.study.push(base);
  ui.stuEdit = d;
  save(true); render();
  toast(T('stuSaved'));
}

/* ---- 写操作：删除一天 ---- */
async function delStudy(date) {
  const i = S.study.findIndex(x => x.date === date);
  if (i < 0) return;
  if (!await confirmBox(T('stuDelTitle'), T('stuDelBody', date), T('del'), true)) return;
  const [gone] = S.study.splice(i, 1);
  /* 软删除：墓碑留给makeIdentitySync 传播到云端与其他设备 */
  if (gone && gone.id) { S.tombStudy[gone.id] = Date.now(); }
  if (ui.stuEdit === date) ui.stuEdit = '';
  save(true); render();
  toast(T('stuDeleted'));
}

function openNoteEdit(id) {
  const n = S.notes.find(x => x.id === id); if (!n) return;
  const m = document.createElement('div'); m.className = 'mask';
  m.innerHTML = `<div class="modal" style="max-width:470px"><h3>${T('mEditNote')}</h3>
    <div class="f" style="margin-bottom:10px"><label>${T('lblIdea')}</label><textarea id="ne_text" rows="5" maxlength="1200">${esc(n.text)}</textarea></div>

  m.addEventListener('click', e => {
    if (e.target === m) return m.remove();
    const b = e.target.closest('[data-r]'); if (!b) return;
    if (b.dataset.r === '1') {
      const txt = m.querySelector('#ne_text').value.trim();
      if (!txt) { toast(T('tNeedContent'), true); return; }
      const tags = (m.querySelector('#ne_tags').value || '').split(/[,，;；\s]+/).map(x => x.replace(/^#/, '').trim()).filter(Boolean).slice(0, 6);
      n.text = txt; n.tags = [...new Set(tags)];
      n.updatedAt = Date.now(); /* 【v7】LWW 版本戳，save 钩子触发推送 */
      save(true); render(); toast(T('mEditNoteOk'));
    }
    m.remove();
  });
  document.body.appendChild(m);
  setTimeout(() => { const i = m.querySelector('#ne_text'); if (i) i.focus(); }, 30);
}
/* 复制记事全文：clipboard API 优先，失败回退 execCommand */
function copyNoteText(txt, done) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => legacyCopy(txt, done));
  } else legacyCopy(txt, done);
}
function legacyCopy(txt, done) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast(T('nCopyFail'), true); }
  ta.remove();
}

function vReview() {

  const doneArr = S.tasks.filter(k => k.done && k.doneAt && inWeek(k.doneAt));
  const created = S.tasks.filter(k => k.createdAt && inWeek(k.createdAt)).length;
  const notesN = S.notes.filter(n => inWeek(n.createdAt)).length;
  const dist = { 1:0, 2:0, 3:0, 4:0 };
  doneArr.forEach(k => dist[k.prio] = (dist[k.prio]||0) + 1);
  const mx = Math.max(1, ...Object.values(dist));
  const od = overdue(), st = stuck();
  const closed = doneArr.filter(k => k.reported).length;

/* 云端自检：逐表 query 一次，报告"能否读取 / 云端行数 / 本地条数 / 失败原因" */
function runCloudDiag() {
  let db = null;
  try { db = window.__SMART_PAGE__ && window.__SMART_PAGE__.database; } catch (e) {}
  if (!db) { DIAG = { noCloud: true, rows: [], okN: 0 }; render(); return; }
  const list = diagTables();
  const out = list.map(t => ({ name: t.name, local: t.local(), rows: null, ok: false, err: '' }));
  DIAG = { running: true, rows: [], okN: 0 }; render();
  let left = list.length;
  list.forEach((t, i) => {
    let pr;
    try { pr = db.query({ databaseId: t.id, pageSize: 200 }); } catch (e) { pr = Promise.reject(e); }
    Promise.resolve(pr).then(r => {
      const rs = (r && r.results) || [];
      out[i].rows = rs.length + ((r && r.hasMore) ? '+' : '');
      out[i].ok = true;
    }, e => {
      out[i].ok = false;
      out[i].err = (e && (e.message || e.code)) || String(e);
    }).then(() => {
      if (--left <= 0) { DIAG = { rows: out, okN: out.filter(x => x.ok).length }; render(); }
    });
  });
}

function importBackupFile(file) {
  const fr = new FileReader();

      const looksOk = data && typeof data === 'object' &&
        ['tasks', 'personal', 'schedules', 'notes', 'projects', 'inspects', 'study'].some(k => Array.isArray(data[k])); // modified
      if (!looksOk) { toast(T('bkImportFail'), true); return; }
      // modified: [v31-P1] 补 tombStudy；导入后补 meta/数组校验并走 normalize，旧备份缺字段不再白屏
      const tk = { tombSched: S.tombSched, tombTask: S.tombTask, tombProj: S.tombProj, tombNote: S.tombNote, tombIns: S.tombIns, tombPers: S.tombPers, tombStudy: S.tombStudy }; // modified
      S = Object.assign(blank(), data);
      S.meta = Object.assign(blank().meta, (data.meta && typeof data.meta === 'object') ? data.meta : {}); // modified
      ['tasks','notes','projects','inspects','schedules','personal','study'].forEach(k => { if (!Array.isArray(S[k])) S[k] = []; }); // modified
      /* 本地未推送的删除墓碑并入（时间取最新），避免刚删的条目被云端旧数据"复活" */
      ['tombSched','tombTask','tombProj','tombNote','tombIns','tombPers','tombStudy'].forEach(k => { // modified
        S[k] = Object.assign({}, S[k] || {}, tk[k] || {});
      });
      try { normalize(); } catch (ne) { try { console.warn('[import] normalize', ne); } catch (_) {} } // modified
      save(true); render();
      toast(T('bkImported', total()));
    } catch (e) { toast(T('bkImportFail'), true); }
  };
  fr.onerror = () => toast(T('bkImportFail'), true);
  fr.readAsText(file);
}

  $('toasts').appendChild(d);

}

    }

    case 'blk-prefill': { blkPrefill(); return; }
    case 'blk-copy-yesterday': { blkCopyYesterday(); return; }
    case 'blk-clear': { await blkClearAll(); return; }
    case 'blk-jump': {
      /* 时间轴速览点一下 → 滚到该小时那一行并聚焦内容框 */
      const h = el.dataset.h;
      const row = $('blkrow' + h);
      if (row) {
        row.scrollIntoView({ block: 'center', behavior: 'smooth' });
        const tx = row.querySelector('[data-blk-tx]');
        if (tx) setTimeout(() => tx.focus(), 220);
      }
      return;
    }    case 'week': ui.weekOff = el.dataset.d === '0' ? 0 : ui.weekOff + Number(el.dataset.d); if (ui.weekOff > 0) ui.weekOff = 0; render(); return;

    case 'toggle': case 'done': {
      const k = tById(id); if (!k) return;
      k.done = a === 'done' ? true : !k.done;
      k.doneAt = k.done ? Date.now() : null;
      k.updatedAt = Date.now(); /* 【v7】LWW 版本戳 */
      if (k.pid) { const p = projById(k.pid); if (p) p.updatedAt = Date.now(); }
      save(); render();
      if (k.done) {
        // 关联项目的任务全做完时给一句提示
        if (k.pid) {
          const g = projProgress(k.pid);
          toast(g.total && g.done === g.total ? T('tProjCleared', projName(k.pid)) : T('tProjProgress', projName(k.pid), g.done, g.total));
        } else toast(T('tCompleted', k.title.slice(0, 18)));
      }
      return;
    }
    case 'report': {
      const k = tById(id); if (!k) return;
      k.reported = !k.reported;
      k.reportedAt = k.reported ? Date.now() : null;
      k.updatedAt = Date.now();
      save(); render(); toast(k.reported ? T('repOn') : T('repOff'));
      return;
    }
    case 'tomorrow': {
      const k = tById(id); if (!k) return;
      k.due = shift(TODAY(), 1); k.rolls = (k.rolls||0) + 1; k.carried = null;
      save(); render(); toast(T('tPostponed'));
      return;
    }
    case 'roll-all': {
      const od = overdue(); if (!od.length) return;
      if (!await confirmBox(T('mRollTitle'), T('mRollBody', od.length, shift(TODAY(),1)), T('mRollOk'))) return;
      const tm = shift(TODAY(), 1);
      od.forEach(k => { k.due = tm; k.rolls = (k.rolls||0)+1; k.carried = null; k.updatedAt = Date.now(); });
      save(true); render(); toast(T('tPostponedN', od.length));
      return;
    }
    case 'edit-task': { openTaskEdit(id); return; }
    case 'del-task': {
      const k = tById(id); if (!k) return;
      if (!await confirmBox(T('mDelTaskTitle'), T('mDelTaskBody', esc(k.title)), T('del'), true)) return;
      tombItems('tombTask', [k]); /* 【v7】墓碑：云端软删除，多设备传播 */
      S.tasks = S.tasks.filter(x => x.id !== id); save(true); render(); toast(T('tDeleted'));
      return;
    }
    case 'del-note': {
      if (!await confirmBox(T('mDelNoteTitle'), T('mDelNoteBody'), T('del'), true)) return;
      var noteTarget = S.notes.find(x => x.id === id);
      tombItems('tombNote', noteTarget ? [noteTarget] : []);
      S.notes = S.notes.filter(x => x.id !== id); save(true); render(); toast(T('tDeleted'));
      return;
    }
    /* ---- 日程删除（补齐缺失能力）+ 记事置顶/编辑/复制 ---- */
    case 'del-s': {
      const s = S.schedules.find(x => x.id === id); if (!s) return;
      const members = (s.sid && s.st > 1) ? S.schedules.filter(x => x.sid === s.sid) : [s];
      const ok = members.length > 1
        ? await confirmBox(T('mDelSSeries'), T('mDelSSeriesBody', members.length, esc(s.title)), T('del'), true)
        : await confirmBox(T('mDelSTitle'), T('mDelSBody', esc(s.title)), T('del'), true);
      if (!ok) return;
      tombSchedules(members); /* 【同步v3】登记墓碑，推送时云端软删除 */
      markInsSchedOff(members); /* 【修复】检查任务标记不再生成 */
      const ids = new Set(members.map(y => y.id));
      S.schedules = S.schedules.filter(x => !ids.has(x.id)); save(true); render(); toast(T('sDeleted'));
      return;
    }
    case 'note-pin': {
      const n = S.notes.find(x => x.id === id); if (!n) return;
      n.pin = !n.pin; n.updatedAt = Date.now(); save(true); render(); toast(n.pin ? T('tPinned') : T('tUnpinned'));
      return;
    }
    case 'note-edit': { openNoteEdit(id); return; }
    case 'note-copy': {
      const n = S.notes.find(x => x.id === id); if (!n) return;
      copyNoteText(n.text, () => toast(T('nCopied')));
      return;
    }
    /* ---- 批量管理（任务 / 日程 / 记事 / 个人事项 / 检查台账）---- */
    case 'batch-tasks': ui.batchT = !ui.batchT; ui.selT.clear(); render(); return;
    case 'batch-scheds': ui.batchS = !ui.batchS; ui.selS.clear(); render(); return;
    case 'batch-notes': ui.batchN = !ui.batchN; ui.selN.clear(); render(); return;
    case 'batch-pers': ui.batchP = !ui.batchP; ui.selP.clear(); render(); return;
    case 'batch-ins': ui.batchI = !ui.batchI; ui.selI.clear(); render(); return;
    case 'tsel': ui.selT.has(id) ? ui.selT.delete(id) : ui.selT.add(id); render(); return;
    case 'ssel': ui.selS.has(id) ? ui.selS.delete(id) : ui.selS.add(id); render(); return;
    case 'nsel': ui.selN.has(id) ? ui.selN.delete(id) : ui.selN.add(id); render(); return;
    case 'psel': ui.selP.has(id) ? ui.selP.delete(id) : ui.selP.add(id); render(); return;
    case 'isel': ui.selI.has(id) ? ui.selI.delete(id) : ui.selI.add(id); render(); return;
    case 'sel-all': {
      const pick = el.dataset.pick; const on = el.dataset.on === '1';
      const sel = pick === 'tsel' ? ui.selT : pick === 'ssel' ? ui.selS : pick === 'psel' ? ui.selP : pick === 'isel' ? ui.selI : ui.selN;
      document.querySelectorAll(`[data-act="${pick}"]`).forEach(b2 => {
        if (on) sel.add(b2.dataset.id); else sel.delete(b2.dataset.id);
      });
      render(); return;
    }
    case 'batch-del-tasks': {
      const ids = [...ui.selT]; if (!ids.length) return;
      if (!await confirmBox(T('mDelSelTasksTitle'), T('mDelSelTasksBody', ids.length), T('del'), true)) return;
      tombItems('tombTask', S.tasks.filter(x => ui.selT.has(x.id))); /* 【v7】墓碑登记，推送时云端软删除 */
      S.tasks = S.tasks.filter(x => !ui.selT.has(x.id));
      exitBatch('t'); save(true); render(); toast(T('tBatchDeleted', ids.length));
      return;
    }
    case 'batch-del-pers': {
      const ids = [...ui.selP]; if (!ids.length) return;
      if (!await confirmBox(T('mDelSelPersTitle'), T('mDelSelPersBody', ids.length), T('del'), true)) return;
      tombItems('tombPers', S.personal.filter(x => ui.selP.has(x.id)));
      S.personal = S.personal.filter(x => !ui.selP.has(x.id));
      exitBatch('p'); save(true); render(); toast(T('pBatchDeleted', ids.length));
      return;
    }
    case 'batch-del-ins': {
      const ids = [...ui.selI]; if (!ids.length) return;
      if (!await confirmBox(T('mDelSelInsTitle'), T('mDelSelInsBody', ids.length), T('del'), true)) return;
      const members = S.inspects.filter(x => ui.selI.has(x.id));
      tombItems('tombIns', members);
      /* 关联自动日程一并走墓碑删除（与单条删除行为一致） */
      const linked = S.schedules.filter(s => ui.selI.has(s.insId));
      if (linked.length) { tombSchedules(linked); markInsSchedOff(members); }
      S.inspects = S.inspects.filter(x => !ui.selI.has(x.id));
      S.schedules = S.schedules.filter(s => !ui.selI.has(s.insId));
      reseqIns();
      exitBatch('i'); save(true); render(); toast(T('insBatchDeleted', ids.length));
      return;
    }
    case 'batch-del-scheds': {
      const ids = [...ui.selS]; if (!ids.length) return;
      if (!await confirmBox(T('mDelSelSchedsTitle'), T('mDelSelSchedsBody', ids.length), T('del'), true)) return;
      tombSchedules(S.schedules.filter(x => ui.selS.has(x.id))); /* 【同步v3】登记墓碑 */
      S.schedules = S.schedules.filter(x => !ui.selS.has(x.id));
      exitBatch('s'); save(true); render(); toast(T('sBatchDeleted', ids.length));
      return;
    }
    case 'batch-del-notes': {
      const ids = [...ui.selN]; if (!ids.length) return;
      if (!await confirmBox(T('mDelSelNotesTitle'), T('mDelSelNotesBody', ids.length), T('del'), true)) return;
      tombItems('tombNote', S.notes.filter(x => ui.selN.has(x.id)));
      S.notes = S.notes.filter(x => !ui.selN.has(x.id));
      exitBatch('n'); save(true); render(); toast(T('nBatchDeleted', ids.length));
      return;
    }
    case 'del-proj': {
      const p = pById(id); if (!p) return;
      const linked = tasksOfProj(id);
      if (linked.length) {
        // 有关联待办时，让用户决定这些任务的去向，避免误删
        const mode = await choiceBox(T('mDelProjTitle'),
          T('mDelProjLinked', esc(p.name), linked.length),
          [{ n: T('mKeepTasks'), v: 'keep' }, { n: T('mDelAll'), v: 'all' }]);
        if (!mode) return;
        if (mode === 'all') { tombItems('tombTask', S.tasks.filter(x => x.pid === id)); S.tasks = S.tasks.filter(x => x.pid !== id); }
        else S.tasks.forEach(x => { if (x.pid === id) { x.pid = ''; x.updatedAt = Date.now(); } });
      } else {
        if (!await confirmBox(T('mDelProjTitle'), T('mDelProjBody', esc(p.name)), T('del'), true)) return;
      }
      tombItems('tombProj', [p]); /* 【v7】墓碑：云端软删除 */
      S.projects = S.projects.filter(x => x.id !== id);
      if (ui.projFilter === id) ui.projFilter = '';
      save(true); render(); toast(T('tDeleted'));
      return;
    }
    case 'edit-proj': { openProjEdit(id); return; }

    /* ---- 检查任务 ---- */
    case 'ifilter': ui.insFilter = el.dataset.f || ''; render(); return;
    /* 【v22】台账底部筛选条：任务分类 / 检查结果 两个下拉，选完即时生效。
       【v23】只能由 select 的 change 事件走到这里（bindAfterRender 里按 id 绑 onchange），
       两个下拉标签上**不能再加 data-act**：全局 click 委托会先于 change 触发，
       在「点击展开」那一刻就 render()，原生下拉弹层随即被销毁，表现为「闪一下就选不中」。 */
    case 'insflt-cat': ui.insCatF = (el && el.value) || ''; render(); return;
    case 'insflt-res': ui.insResF = (el && el.value) || ''; render(); return;
    /* 【v22】检查对象关键字搜索：只在点「搜索」（或输入框里回车）时才应用，
       打字过程只更新草稿 ui.insQ，不触发过滤 —— 否则列表边打边跳，长关键字还没输完就空了 */
    case 'ins-search': {
      const box = $('insQ');
      ui.insQ = box ? box.value : ui.insQ;
      ui.insQApplied = ui.insQ.trim();
      const n = insFiltered().length;
      render();
      toast(T('insFltd', n));
      return;
    }
    /* 【v22】重置：恢复「台账全部内容」—— 进度分组、任务分类、检查结果、关键字一起清空 */
    case 'ins-flt-reset': {
      ui.insFilter = ''; ui.insCatF = ''; ui.insResF = '';
      ui.insQ = ''; ui.insQApplied = '';
      const n = insFiltered().length;
      render();
      toast(T('insResetDone', n));
      return;
    }
    /* 【v16】台账排序：点表头 / 移动端排序条 */
    case 'ins-sort': {
      const k = el.dataset.k; if (!k) return;
      if (ui.insSort.k === k) ui.insSort.d = ui.insSort.d === 'asc' ? 'desc' : 'asc';
      else { ui.insSort.k = k; ui.insSort.d = 'asc'; }
      render(); return;
    }
    case 'ins-sortdir': { ui.insSort.d = ui.insSort.d === 'asc' ? 'desc' : 'asc'; render(); return; }
    case 'ins-parse': { openInsImport(); return; }
    case 'ins-batch-dlg': { openInsBatchDlg(); return; } /* 【v17】右上角「批量导入」按钮 */
    case 'edit-ins': { openInsEdit(id); return; }
    case 'ins-rechecked': {
      const x = insById(id); if (!x) return;
      x.prog = 'rechecked'; x.recheckedAt = Date.now(); x.updatedAt = Date.now();
      save(true); render(); toast(T('tInsRechecked', x.target.slice(0, 16)));
      return;
    }
    case 'del-ins': {
      const x = insById(id); if (!x) return;
      if (!await confirmBox(T('mDelInsTitle'), T('mDelInsBody', esc(x.target)), T('del'), true)) return;
      tombItems('tombIns', [x]); /* 【v7】墓碑：云端软删除 */
      const linked = S.schedules.filter(s => s.insId === id);
      if (linked.length) { tombSchedules(linked); markInsSchedOff([x]); } /* 关联日程一并墓碑删除并标记不再生成 */
      S.inspects = S.inspects.filter(y => y.id !== id);
      S.schedules = S.schedules.filter(s => s.insId !== id); // 同步移除关联的自动日程
      reseqIns();
      save(true); render(); toast(T('tDeleted'));
      return;
    }
    case 'clear-sample': {
      if (!await confirmBox(T('mClearSampleTitle'), T('mClearSampleBody'), T('bkClearSample'), true)) return;
      // 示例数据在启动时已打上 _s 标记，这里精确清除，用户自己添加的不受影响
      S.tasks = S.tasks.filter(x => !x._s); S.notes = S.notes.filter(x => !x._s);
      S.projects = S.projects.filter(x => !x._s); S.inspects = S.inspects.filter(x => !x._s);
      S.schedules = S.schedules.filter(x => !x._s); S.personal = S.personal.filter(x => !x._s);
      reseqIns();
      S.meta.sample = false; S.meta.itemsAtExport = Math.min(S.meta.itemsAtExport, total());
      save(true); render(); toast(T('tSampleCleared'));
      return;
    }
    /* ---- 个人事项 ---- */
    case 'p-add-focus': {
      const i = $('pTitle'); if (i) { i.scrollIntoView({ block: 'center', behavior: 'smooth' }); i.focus(); }
      return;
    }
    case 'pfilter': ui.personalFilter = el.dataset.f || 'today'; render(); return;
    /* 【v13】我的事项顶部筛选：改了条件就切到「全部」，保证一选就能看到符合条件的事项 */
    case 'pflt-prio': ui.personalPrioFilter = (el && el.value) || ''; ui.personalFilter = 'all'; render(); return;
    case 'pflt-cat': ui.personalCatFilter = (el && el.value) || ''; ui.personalFilter = 'all'; render(); return;
    case 'pflt-clear': ui.personalPrioFilter = ''; ui.personalCatFilter = ''; render(); return;
    case 'toggle-p': {
      const k = S.personal.find(x => x.id === id); if (!k) return;
      k.done = !k.done; k.doneAt = k.done ? Date.now() : null;
      save(true); render(); toast(k.done ? T('pCompleted', k.title.slice(0, 16)) : T('pUncompleted'));
      return;
    }
    case 'p-postpone': {
      const k = S.personal.find(x => x.id === id); if (!k) return;
      k.due = shift(TODAY(), 1); k.rolls = (k.rolls || 0) + 1; k.updatedAt = Date.now();
      save(true); render(); toast(T('pPostponed'));
      return;
    }
    case 'edit-p': { openPersonalEdit(id); return; }
    case 'del-p': {
      const k = S.personal.find(x => x.id === id); if (!k) return;
      if (!await confirmBox(T('mDelPTitle'), T('mDelPBody', esc(k.title)), T('del'), true)) return;
      tombItems('tombPers', [k]);
      S.personal = S.personal.filter(x => x.id !== id); save(true); render(); toast(T('pDeleted'));
      return;
    }

    /* ---- 日程 ---- */
    case 'sched-view': ui.schedView = el.dataset.v || 'month'; render(); return;
    case 'sched-today': ui.schedCursor = TODAY(); render(); return;
    case 'sched-prev': {
      const cur = ui.schedCursor || TODAY();
      const [y, m] = cur.split('-').map(Number);
      ui.schedCursor = ui.schedView === 'week' ? shift(cur, -7) : ds(new Date(y, m - 2, 1));
      render(); return;
    }
    case 'sched-next': {
      const cur = ui.schedCursor || TODAY();
      const [y, m] = cur.split('-').map(Number);
      ui.schedCursor = ui.schedView === 'week' ? shift(cur, 7) : ds(new Date(y, m, 1));
      render(); return;
    }
    case 'sched-day': {
      const d = el.dataset.d || TODAY();
      ui.schedCursor = d;
      openSchedEdit(null, d); /* 点击日期格：直接弹出该日的新建日程窗口（预填日期） */
      return;
    }
    case 'sched-add': { openSchedEdit(null); return; }
    case 'edit-s': { openSchedEdit(id); return; }
    case 'sched-export-x': { exportScheduleExcel(); return; }
    case 'ins-excel': { exportInsExcel(); return; }

    /* ---- 全局搜索 ---- */
    case 'search-scope': { readSearchForm(); render(); return; }
    case 'search-range': { readSearchForm(); render(); return; }
    case 'search-dates': { readSearchForm(); render(); return; }
    case 'search-clear': { ui.search = { q: '', scope: 'all', range: 'all', start: '', end: '' }; render(); return; }

    /* ---- 【v11】数据备份（导出/导入恢复）与云端自检 ---- */
    case 'bk-export': { exportBackup(); return; }
    case 'bk-import': { const bf = $('bkFile'); if (bf) bf.click(); else toast(T('tNeedFile'), true); return; }
    case 'diag-run': { runCloudDiag(); return; }
    case 'bk-corrupt-dl': { // modified: [v31-N2] 下载隔离的原始损坏数据
      const cb = corruptBackup(); // modified
      if (!cb) { toast(T('bkImportFail'), true); return; } // modified
      downloadText('涨潮归_损坏数据备份_' + new Date(cb.at || Date.now()).toISOString().slice(0, 10) + '.json', cb.raw, 'application/json;charset=utf-8'); // modified
      return; // modified
    }

    case 'wipe': {
      if (!await confirmBox(T('mWipeTitle'), T('mWipeBody'), T('mWipeOk'), true)) return;
      /* 清空 = 全部块登记墓碑，推送时云端统一软删除，防止下次拉取"复活" */
      tombSchedules(S.schedules);
      tombItems('tombTask', S.tasks); tombItems('tombProj', S.projects);
      tombItems('tombNote', S.notes); tombItems('tombIns', S.inspects); tombItems('tombPers', S.personal);
      tombItems('tombStudy', S.study); // modified: [v31-P1] 清空时学习打卡也要登记墓碑，否则云端旧行会复活
      const tk = { tombSched: S.tombSched, tombTask: S.tombTask, tombProj: S.tombProj, tombNote: S.tombNote, tombIns: S.tombIns, tombPers: S.tombPers, tombStudy: S.tombStudy }; // modified
      exitBatch('t'); exitBatch('s'); exitBatch('n'); exitBatch('p'); exitBatch('i');
      S = blank(); Object.assign(S, tk); S.meta.sample = false; save(true); ui.view = 'tasks'; render(); toast(T('tWiped'));
      return;
    }
  }
}

/* --- 任务编辑弹层 --- */
function openTaskEdit(id) {
  const k = tById(id); if (!k) return;
  const m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML = `<div class="modal" style="max-width:470px"><h3>${T('mEditTask')}</h3>
    <div class="f" style="margin-bottom:11px"><label>${T('lblWhat')}</label><input type="text" id="et_title" value="${esc(k.title)}" maxlength="140"></div>
    <div class="form" style="margin-bottom:11px">
      <div class="f grow"><label>${T('lblPrio')}</label><select id="et_prio">
        ${Object.entries(PRIO).map(([v,p]) => `<option value="${v}"${Number(k.prio)===Number(v)?' selected':''}>${p.n}${LANG==='en'?` (${p.s})`:`（${p.s}）`}</option>`).join('')}
      </select></div>
      <div class="f grow"><label>${T('lblDue')}</label><input type="date" id="et_due" value="${esc(k.due || '')}"></div> <!-- // modified -->
    </div>
    <div class="form" style="margin-bottom:11px">
      <div class="f grow"><label>${T('lblCat')}</label><select id="et_cat">
        <option value="">${T('catNone')}</option>
        ${CATKEYS.map(c => `<option value="${c}"${k.cat === c ? ' selected' : ''}>${catName(c)}</option>`).join('')}
      </select></div>
      <div class="f grow"><label>${T('colReport')}</label>
        <button type="button" class="chk-lb${k.reported ? ' on' : ''}" id="et_rep" style="align-self:center">
          <span class="chk rep${k.reported ? ' on' : ''}">${I.check}</span>${k.reported ? T('pillReported') : T('pillUnreport')}</button></div>
    </div>
    <div class="f" style="margin-bottom:18px"><label>${T('lblLinkProj')}</label><select id="et_pid">
      <option value="">${T('optNoProj')}</option>
      ${S.projects.map(p => `<option value="${p.id}"${k.pid===p.id?' selected':''}>${esc(p.name)}${p.status==='done'?(LANG==='en'?' (completed)':'（已完成）'):''}</option>`).join('')}
    </select></div>
    <div class="ma"><button class="btn" data-r="0">${T('cancel')}</button><button class="btn btn-primary" data-r="1">${I.save}${T('save')}</button></div></div>`;
  let etRep = false;
  const repBtn = m.querySelector('#et_rep');
  if (repBtn) repBtn.addEventListener('click', () => {
    etRep = !etRep;
    const on = k.reported ? !etRep : etRep;
    repBtn.classList.toggle('on', on);
    repBtn.lastChild.textContent = on ? T('pillReported') : T('pillUnreport');
  });
  m.addEventListener('click', e => {
    if (e.target === m) return m.remove();
    if (e.target.closest('#et_rep')) return;
    const b = e.target.closest('[data-r]'); if (!b) return;
    if (b.dataset.r === '1') {
